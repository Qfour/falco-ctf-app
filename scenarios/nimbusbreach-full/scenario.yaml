# The unified CTF Company scenario — all 10 missions, canonical 01→10 order
# (recon → cred access → evade → harvest → RCE → persist → C2 → hide → exfil boss).
# This is THE scenario every edition runs. Editions differ only in time budget
# and how much is hands-on vs walked through (解説) — see playbook-*.md. The
# scoreboard always shows all 10 so the full arc is visible and completed.
id: nimbusbreach-full
title: "CTF Company — Full Scenario (10 missions)"
challenges:
  - 01-initial-recon
  - 02-credential-files
  - 03-stealth-read
  - 04-key-search
  - 05-silent-search
  - 06-web-rce-shell
  - 07-persist
  - 08-c2-beacon
  - 09-hidden-cache
  - 10-final-exfil
# Advisory only (P27-3): the MITRE ATT&CK tactics this scenario intends to
# cover, derived from challenges/*/falco-rule.yaml `attack.tactic`. Not
# consumed by Go (catalog.go ignores unknown fields) — `make gen-attack`
# cross-checks this list against the actual challenges: above and prints a
# non-blocking warning on mismatch. Order follows first-occurrence in the
# challenges: list above.
tactics:
  - Discovery
  - Credential Access
  - Stealth
  - Execution
  - Command and Control
  - Exfiltration
