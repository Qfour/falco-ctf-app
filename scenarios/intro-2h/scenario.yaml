# Intro (2-hour beginner edition). A coherent ASCENDING slice of the canonical
# NimbusBreach storyline (same order as the full track, just fewer missions) —
# so the narrative and the scoreboard (which sorts by id) stay aligned.
#
# Skips the harder missions (05 evade-search, 07 upper-layer, 09 hardlink,
# 10 boss); those live in nimbusbreach-full. The 02→03 pair (fire a rule, then
# evade the same rule) is the teaching centerpiece.
#
# Time budget: 30m Falco intro · 60m CTF (these 6) · 30m debrief.
id: intro-2h
title: "NimbusBreach — Intro (2h beginner edition)"
challenges:
  - 01-initial-recon      # recon (K8s API)            ★1 trigger
  - 02-credential-files   # credential access (shadow) ★1 trigger
  - 03-stealth-read       # EVADE the same rule as 02  ★2 evade
  - 04-key-search         # credential harvest         ★2 trigger
  - 06-web-rce-shell      # web RCE → shell            ★3 trigger
  - 08-c2-beacon          # C2 / reverse shell         ★4 trigger
