# ADR-0014 narrative overlay for scenario `tutorial-intro`
# (docs/adr/0014-journey-narrative-scenario-overlay.md).
#
# `tutorial-intro` walks 00 -> 01 -> 03 (never runs 02 or 04).
#
# UPDATE (P27-2, content-engineer): the "Mission 02" contradiction this
# override originally existed to fix has been resolved at the source —
# challenges/03-stealth-read/journey.yaml's briefing is now neutralized
# (no direct mission-number reference), so the briefing override below is
# no longer strictly required (it is intentionally kept byte-identical to
# the now-neutral challenge-local text, for parity with the docs generated
# from journey.yaml directly).
#
# What THIS override still does that the neutralized local file cannot:
# 03's local `bridge` field ("...箱の中を漁りにいく。まずは正面から find で
# どうなるか見てみよう。") is a forward teaser toward 04-key-search — which
# is not part of this scenario. Left unoverridden, tutorial-intro's closing
# beat would dangle a reference to a mission its participants never see.
# `bridge: ""` clears it (no teaser, since 03 is tutorial-intro's last
# mission) without touching journey.yaml's own bridge (which nimbusbreach-
# full still needs, unchanged, to flow into 04).
#
# See also scenarios/nimbusbreach-full/narrative.yaml, which uses the same
# ADR-0014 mechanism in the opposite direction: restoring the "Mission NN"
# callbacks that P27-2 neutralized out of the challenge-local fallback, for
# the one scenario where the full 01->10 order makes them non-contradictory.
overrides:
  03-stealth-read:
    briefing: >-
      正面から /etc/shadow を読むと Falco の Read sensitive file untrusted が
      即座に発火する。CTF Company の SOC はこの手のアクセスを常時監視しており、
      同じ検知は資格情報退避用の vault ファイルにも効いている。同じ情報を
      Falco に気づかれず取り直せれば、SOC は単発の false positive と判断するはずだ。
      Read sensitive file untrusted を一度も発火させずに
      /opt/nimbus/vault/creds.recover の flag を取り出し、提出せよ。
    bridge: ""
