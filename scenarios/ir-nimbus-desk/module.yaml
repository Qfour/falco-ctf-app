id: ir-nimbus-desk
title: "事案調査 — nimbus-desk (防御側)"
summary: >-
  架空の事案。公開の web service が侵入された後に保全された痕跡 (Falco のアラート・file の目録・
  container の log・外向きの通信の記録) を調べ、何が・いつ・どの順に起きたかを組み立てる。
outcomes:
  - Falco のアラートを読んで事案の記録と正常な記録を区別し、事案の段階を 5 つ以上、起きた順に並べられる
  - アラートに出ない段階 (内容をまとめた file、拒否された送信) を、file の目録・container の log・通信の記録から特定できる
  - 別々の file の時刻を UTC の 1 本の時系列に統合し、紛らわしい正常な記録と区別できる
  - 再構成した各段階に、ATT&CK の Tactic を対応づけられる
version: 1
level: 3
duration: {handsOnMinutes: 40, debriefMinutes: 10}
missions:
  - 50-nimbus-desk-triage
  - 51-nimbus-desk-egress
