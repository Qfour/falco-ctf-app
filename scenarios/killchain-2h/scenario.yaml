# Killchain (2-hour beginner event). Curated subset of the existing missions,
# sequenced as a real cloud-native intrusion kill-chain: recon → cred access →
# cred harvest → web RCE → C2, then one evade capstone. Maps each step to a
# real attack campaign (see playbook.md / debrief.md).
#
# Time budget: 30m Falco intro · 60m CTF (these 6) · 30m debrief.
id: killchain-2h
title: "Operation Killchain — 2h Intro (Falco kill-chain)"
challenges:
  - 02-credential-files   # 1. credential access (read /etc/shadow)
  - 01-initial-recon      # 2. K8s API recon
  - 04-key-search         # 3. credential harvest (private keys)
  - 06-web-rce-shell      # 4. web RCE → shell
  - 08-c2-beacon          # 5. C2 / reverse shell
  - 03-stealth-read       # 6. EVADE capstone (evade the cred-access rule)
