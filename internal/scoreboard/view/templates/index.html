<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Falco CTF · scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Falco Blue neon on cyber-dark. */
    --falco: #00CBE2;
    --falco-2: #0090A8;
    --bg: #070B10;            /* deep space */
    --bg-elev: #0D141B;
    --surface: #0F1820;
    --surface-2: #17222C;
    --border: #1C2A35;
    --border-strong: #2B3F4D;
    --text: #EAF7FA;
    --text-dim: #9DB4BF;
    --text-mute: #5C7480;
    --accent: var(--falco);
    --accent-2: var(--falco-2);
    --accent-glow: rgba(0, 203, 226, 0.35);
    --success: #00CBE2;
    --success-glow: rgba(0, 203, 226, 0.5);
    --warn: #FFB020;
    --evade: #B78CFF;        /* evade = violet, for game-y type contrast */
    --evade-glow: rgba(183, 140, 255, 0.35);
    --trigger: #00CBE2;
    --gold: #FFD24A; --gold-glow: rgba(255, 210, 74, 0.55);
    --silver: #CFE0E8;
    --bronze: #E0925A;
    --danger: #ff5c6a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body {
    background:
      radial-gradient(at 15% -10%, rgba(0, 203, 226, 0.10) 0px, transparent 45%),
      radial-gradient(at 90% 0%, rgba(183, 140, 255, 0.06) 0px, transparent 40%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 2.25rem 3rem 4rem;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  /* faint cyber grid overlay */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(0, 203, 226, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 203, 226, 0.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 80%);
  }
  body > * { position: relative; z-index: 1; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace; }
  .display { font-family: 'Chakra Petch', sans-serif; letter-spacing: 0.02em; }
  code { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.875em; background: var(--surface-2); padding: 1px 6px; border-radius: 3px; color: var(--accent); }
  a { color: var(--accent); text-decoration: none; }

  /* ===== Header ===== */
  header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.75rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); position: relative; }
  header::after { content: ''; position: absolute; left: 0; bottom: -1px; width: 160px; height: 2px; background: linear-gradient(90deg, var(--accent), transparent); box-shadow: 0 0 12px var(--accent-glow); }
  .brand h1 { font-family: 'Chakra Petch', sans-serif; font-size: 2.4rem; font-weight: 700; letter-spacing: 0.01em; text-transform: uppercase; line-height: 1; }
  .brand h1 .accent { color: var(--accent); text-shadow: 0 0 18px var(--accent-glow), 0 0 40px rgba(0,203,226,0.25); }
  .brand h1 .light { color: var(--text-mute); font-weight: 500; font-size: 0.85rem; letter-spacing: 0.35em; margin-left: 0.6rem; text-transform: uppercase; }
  .live { display: flex; align-items: center; gap: 0.5rem; color: var(--success); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.2em; font-weight: 700; justify-content: flex-end; }
  .live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 12px var(--success-glow); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(1.25); } }
  .updated { color: var(--text-mute); font-size: 0.7rem; margin-top: 0.3rem; text-align: right; font-family: 'JetBrains Mono', monospace; }
  .reset-btn { margin-top: 0.5rem; padding: 0.32rem 0.75rem; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-mute); background: transparent; border: 1px solid var(--border-strong); border-radius: 6px; cursor: pointer; opacity: 0.7; transition: all 0.15s; }
  .reset-btn:hover { opacity: 1; color: var(--danger); border-color: var(--danger); box-shadow: 0 0 12px rgba(255,92,106,0.25); }
  .name-edit { margin-left: 0.4rem; padding: 0 0.25rem; font-size: 0.75rem; line-height: 1; color: var(--text-mute); background: transparent; border: none; cursor: pointer; opacity: 0; transition: opacity 0.15s; }
  tr:hover .name-edit { opacity: 0.55; }
  .name-edit:hover { opacity: 1; color: var(--accent); }

  .hdr-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.35rem; }
  .hdr-btns { display: flex; gap: 0.4rem; margin-top: 0.4rem; }
  .hdr-btns .reset-btn { margin-top: 0; }
  .result-btn { color: var(--accent); border-color: var(--border-strong); }
  .result-btn:hover { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); opacity: 1; }

  /* ===== Podium (top 3) ===== */
  .podium { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 1rem; align-items: end; margin-bottom: 1.5rem; }
  .podium:empty { display: none; }
  .pod { background: linear-gradient(180deg, var(--surface) 0%, var(--bg-elev) 100%); border: 1px solid var(--border-strong); border-radius: 0.9rem; padding: 1.1rem 1rem 1.25rem; text-align: center; position: relative; overflow: hidden; }
  .pod .medal { font-family: 'Chakra Petch', sans-serif; font-size: 1.5rem; font-weight: 700; line-height: 1; }
  .pod .pod-name { font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 1rem; margin: 0.5rem 0 0.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pod .pod-score { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--text-dim); }
  .pod .pod-score b { color: var(--accent); font-size: 1.05rem; }
  .pod .crown { position: absolute; inset: 0 0 auto 0; height: 3px; }
  .pod-1 { transform: translateY(-10px); border-color: var(--gold); box-shadow: 0 0 28px var(--gold-glow), inset 0 0 24px rgba(255,210,74,0.06); }
  .pod-1 .medal { color: var(--gold); text-shadow: 0 0 16px var(--gold-glow); }
  .pod-1 .crown { background: linear-gradient(90deg, transparent, var(--gold), transparent); box-shadow: 0 0 14px var(--gold-glow); }
  .pod-2 { border-color: var(--silver); }
  .pod-2 .medal { color: var(--silver); }
  .pod-2 .crown { background: linear-gradient(90deg, transparent, var(--silver), transparent); }
  .pod-3 { border-color: var(--bronze); }
  .pod-3 .medal { color: var(--bronze); }
  .pod-3 .crown { background: linear-gradient(90deg, transparent, var(--bronze), transparent); }
  @media (max-width: 720px) { .podium { grid-template-columns: 1fr; } .pod-1 { transform: none; } }

  /* ===== Panel ===== */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 0.85rem; margin-bottom: 1.5rem; overflow: hidden; }
  .panel-header { padding: 0.9rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .panel-header h2 { font-family: 'Chakra Petch', sans-serif; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.18em; color: var(--text); font-weight: 600; display: flex; align-items: center; gap: 0.6rem; }
  .panel-header h2::before { content: ''; width: 3px; height: 15px; background: var(--accent); border-radius: 2px; box-shadow: 0 0 10px var(--accent-glow); }
  .panel-aux { color: var(--text-mute); font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; }

  /* ===== Leaderboard ===== */
  table { width: 100%; border-collapse: collapse; }
  thead th { color: var(--text-mute); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; padding: 0.6rem 1.5rem; text-align: left; background: var(--bg-elev); }
  tbody tr { transition: background 0.2s; }
  tbody tr:hover { background: var(--surface-2); }
  tbody td { padding: 0.8rem 1.5rem; border-top: 1px solid var(--border); vertical-align: middle; }
  .rank { font-family: 'Chakra Petch', monospace; font-size: 1.15rem; font-weight: 700; width: 60px; color: var(--text-dim); }
  .rank-1 { color: var(--gold); text-shadow: 0 0 12px var(--gold-glow); }
  .rank-2 { color: var(--silver); }
  .rank-3 { color: var(--bronze); }
  .user-cell { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 0.95rem; }
  .score-cell { font-family: 'JetBrains Mono', monospace; font-size: 1rem; }
  .score-cell .total { color: var(--text-mute); }
  .progress { display: flex; gap: 3px; width: 100%; min-width: 140px; }
  .seg { flex: 1 1 0; height: 10px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--border); transition: all 0.3s; }
  .seg.filled { background: linear-gradient(180deg, var(--accent), var(--accent-2)); border-color: var(--accent); box-shadow: 0 0 7px var(--accent-glow); }

  /* ===== Missions (challenges) ===== */
  .challenges { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; padding: 1.25rem 1.5rem; }
  .challenge { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 0.6rem; padding: 1rem; transition: all 0.2s; position: relative; overflow: hidden; }
  .challenge::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--border-strong); transition: all 0.2s; }
  .challenge:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(0,203,226,0.12); }
  .challenge.clickable { cursor: pointer; }
  .challenge.full { border-color: var(--success); background: linear-gradient(135deg, var(--bg-elev) 0%, rgba(0, 203, 226, 0.07) 100%); }
  .challenge.full::before { background: var(--success); box-shadow: 0 0 12px var(--success-glow); }
  .detail-head { justify-content: flex-start; gap: 0.85rem; }
  .detail-head h2 .badge { margin-left: 0.4rem; }
  .back-btn { margin-top: 0; }
  .challenge .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
  .challenge .num { font-family: 'Chakra Petch', monospace; color: var(--text-mute); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; }
  .challenge .status { font-family: 'Chakra Petch', sans-serif; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-mute); }
  .challenge.full .status { color: var(--success); }
  .badge { padding: 3px 9px; border-radius: 4px; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; }
  .badge-trigger { background: rgba(0, 203, 226, 0.12); color: var(--trigger); border: 1px solid rgba(0, 203, 226, 0.35); }
  .badge-evade { background: rgba(183, 140, 255, 0.12); color: var(--evade); border: 1px solid rgba(183, 140, 255, 0.35); }
  .challenge .name { font-family: 'Chakra Petch', sans-serif; font-weight: 600; margin-bottom: 0.45rem; color: var(--text); font-size: 0.98rem; }
  .challenge .rule { color: var(--text-dim); font-size: 0.7rem; font-family: 'JetBrains Mono', monospace; margin-bottom: 0.75rem; line-height: 1.4; word-break: break-word; }
  .challenge .dots { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 0.6rem; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border-strong); transition: all 0.3s; }
  .dot.filled { background: var(--success); box-shadow: 0 0 7px var(--success-glow); }
  .challenge .footer { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-mute); font-family: 'JetBrains Mono', monospace; }
  .challenge .footer .solved-count { color: var(--success); font-weight: 700; }

  /* ===== Activity ===== */
  .activity { padding: 0.5rem 0; max-height: 480px; overflow-y: auto; }
  .activity::-webkit-scrollbar { width: 6px; }
  .activity::-webkit-scrollbar-track { background: transparent; }
  .activity::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .activity-item { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 1.5rem; gap: 1rem; border-left: 2px solid transparent; transition: all 0.2s; }
  .activity-item:hover { background: var(--surface-2); border-left-color: var(--accent); }
  .activity-item.fresh { animation: flash 1.4s ease; }
  @keyframes flash {
    0% { background: var(--accent-glow); border-left-color: var(--accent); box-shadow: inset 0 0 28px var(--accent-glow); }
    100% { background: transparent; border-left-color: transparent; box-shadow: none; }
  }
  .activity-item .who { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--text); }
  .activity-item .verb { color: var(--text-mute); font-size: 0.8rem; margin: 0 0.4rem; }
  .activity-item .what { color: var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }
  .activity-item .when { color: var(--text-mute); font-size: 0.7rem; font-family: 'JetBrains Mono', monospace; flex-shrink: 0; }

  /* ===== Grid ===== */
  .grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 1.5rem; }
  @media (max-width: 980px) {
    body { padding: 1.25rem; }
    .grid { grid-template-columns: 1fr; }
    .brand h1 { font-size: 1.9rem; }
  }

  /* ===== Result screen ===== */
  .result-hero { text-align: center; padding: 0.5rem 0 2rem; position: relative; }
  .result-hero h1 { font-size: 3rem; font-weight: 700; letter-spacing: 0.06em; color: var(--accent); text-shadow: 0 0 32px var(--accent-glow), 0 0 60px rgba(0,203,226,0.25); }
  .result-sub { color: var(--text-dim); letter-spacing: 0.22em; text-transform: uppercase; font-size: 0.8rem; margin-top: 0.5rem; }
  .result-hero .back-btn { position: absolute; left: 0; top: 0.25rem; }
  .result-view .podium { margin-bottom: 2rem; }

  .empty { text-align: center; padding: 2.5rem 1rem; color: var(--text-mute); font-size: 0.875rem; }
  .empty .icon { font-size: 2rem; opacity: 0.4; display: block; margin-bottom: 0.5rem; }
  .demo-tag { display: none; font-size: 0.6rem; letter-spacing: 0.15em; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 1px 6px; text-transform: uppercase; }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <h1><span class="accent">Falco</span> CTF <span class="light mono">scoreboard</span></h1>
    </div>
    <div class="hdr-right">
      <div class="live">● LIVE <span class="demo-tag" id="demo-tag">demo</span></div>
      <div class="updated mono" id="updated">connecting…</div>
      <div class="hdr-btns">
        <a id="journey-link" class="reset-btn result-btn" href="/journey" title="Open your guided mission journey">▶ Journey</a>
        <button id="result-btn" class="reset-btn result-btn" title="Open the results screen">🏆 Result</button>
        <button id="reset-btn" class="reset-btn" title="Clear all solves (admin only)">Reset board</button>
      </div>
    </div>
  </header>

  <section class="panel home-section">
    <div class="panel-header">
      <h2>Leaderboard</h2>
      <span class="panel-aux" id="lb-meta"></span>
    </div>
    <table>
      <thead><tr>
        <th style="width:60px">Rank</th>
        <th>Participant</th>
        <th style="text-align:right">Score</th>
        <th>Solved</th>
        <th style="width:30%">Progress</th>
      </tr></thead>
      <tbody id="lb-body"></tbody>
    </table>
  </section>

  <section class="grid home-section">
    <div class="panel">
      <div class="panel-header"><h2>Missions</h2><span class="panel-aux" id="ch-meta"></span></div>
      <div class="challenges" id="challenges"></div>
    </div>
    <div class="panel">
      <div class="panel-header"><h2>Live feed</h2><span class="panel-aux" id="act-meta"></span></div>
      <div class="activity" id="activity"></div>
    </div>
  </section>

  <!-- Per-challenge leaderboard (shown when a Mission card is clicked) -->
  <section class="panel detail-view" id="detail-view" hidden>
    <div class="panel-header detail-head">
      <button id="detail-back" class="reset-btn back-btn">← Home</button>
      <h2 id="detail-title">Challenge</h2>
      <span class="panel-aux" id="detail-meta"></span>
    </div>
    <table>
      <thead><tr>
        <th style="width:60px">Rank</th>
        <th>Participant</th>
        <th>Solved</th>
        <th style="text-align:right">After 1st</th>
      </tr></thead>
      <tbody id="detail-body"></tbody>
    </table>
  </section>

  <!-- Result / award screen (opened by the Result button) -->
  <section class="result-view" id="result-view" hidden>
    <div class="result-hero">
      <button id="result-back" class="reset-btn back-btn">← Back</button>
      <h1 class="display">🏆 RESULTS</h1>
      <div class="result-sub">CTF Company · Final Standings</div>
    </div>
    <div class="podium" id="result-podium"></div>
    <section class="panel">
      <div class="panel-header"><h2>Final standings</h2><span class="panel-aux" id="result-meta"></span></div>
      <table>
        <thead><tr>
          <th style="width:60px">Rank</th>
          <th>Participant</th>
          <th style="text-align:right">Score</th>
          <th>Solved</th>
          <th style="width:30%">Progress</th>
        </tr></thead>
        <tbody id="result-body"></tbody>
      </table>
    </section>
  </section>

<script>
  // ---------------- helpers ----------------
  const seen = new Set();
  let firstRender = true;
  // Solve time as YYYY/MM/DD hh:mm:ss (24-hour local).
  function fmtTime(iso) {
    const d = new Date(iso);
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' +
           p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  // Progress as one segment per mission; `done` of `total` lit.
  function segs(done, total) {
    let h = '';
    for (let i = 0; i < total; i++) h += '<span class="seg' + (i < done ? ' filled' : '') + '"></span>';
    return h || '<span class="seg"></span>';
  }
  function fmtDelta(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm' + (s % 60) + 's';
    return Math.floor(m / 60) + 'h' + (m % 60) + 'm';
  }

  let lastState = null;   // latest /api/state, for the detail view
  let currentCid = null;  // null = home; otherwise the open challenge id
  let resultOpen = false; // results screen toggle

  // ---------------- fetch loop ----------------
  async function refresh() {
    try {
      const r = await fetch('/api/state');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      render(await r.json());
      document.getElementById('demo-tag').style.display = 'none';
      document.getElementById('updated').textContent = 'updated ' + new Date().toLocaleTimeString();
    } catch (e) {
      // No backend (e.g. design preview) → show the layout with demo data.
      render(DEMO);
      document.getElementById('demo-tag').style.display = 'inline-block';
      document.getElementById('updated').textContent = 'preview · demo data';
    }
  }

  function render(d) {
    lastState = d;
    if (currentCid) renderDetail();   // keep the open challenge view live
    if (resultOpen) renderResult();   // keep the results screen live
    const totalChal = d.stats.challenges;
    const totalUsers = d.stats.users;

    // ---- leaderboard ----
    document.getElementById('lb-meta').textContent = totalUsers + ' participants';
    const lb = document.getElementById('lb-body');
    if (d.leaderboard.length === 0) {
      lb.innerHTML = '<tr><td colspan="5" class="empty"><span class="icon">∅</span>No participants yet — deploy a workspace to begin</td></tr>';
    } else {
      lb.innerHTML = d.leaderboard.map(p => {
        const ranked = p.solved > 0;
        const rankCls = ranked && p.rank <= 3 ? 'rank-' + p.rank : '';
        // Score is the ranking metric (#40); Solved stays as the progress count.
        const score = (p.score ?? 0);
        return `<tr>
          <td><span class="rank ${rankCls}">${ranked ? '#' + p.rank : '-'}</span></td>
          <td><span class="user-cell">${esc(p.display_name || p.user)}<button class="name-edit" data-user="${esc(p.user)}" title="Rename on scoreboard (admin)">✎</button></span></td>
          <td style="text-align:right"><span class="score-cell"><b>${score}</b></span></td>
          <td><span class="score-cell">${p.solved}<span class="total">/${totalChal}</span></span></td>
          <td><div class="progress">${segs(p.solved, totalChal)}</div></td>
        </tr>`;
      }).join('');
    }

    // ---- missions ----
    document.getElementById('ch-meta').textContent = d.challenges.length + ' total';
    const ch = document.getElementById('challenges');
    if (d.challenges.length === 0) {
      ch.innerHTML = '<div class="empty"><span class="icon">∅</span>No missions loaded</div>';
    } else {
      ch.innerHTML = d.challenges.map(c => {
        const parts = c.id.split('-');
        const num = parts[0];
        const slug = parts.slice(1).join('-');
        const dots = Array.from({length: Math.max(totalUsers, 1)}, (_, i) =>
          `<span class="dot${i < c.solved_count ? ' filled' : ''}"></span>`).join('');
        const rule = c.expectedRules[0] || c.forbiddenRules[0] || '';
        const full = totalUsers > 0 && c.solved_count >= totalUsers ? ' full' : '';
        const status = full ? 'CLEARED' : (c.solved_count > 0 ? 'IN PROGRESS' : 'OPEN');
        const prefix = c.type === 'evade' ? '✗ ' : '✓ ';
        return `<div class="challenge clickable${full}" data-cid="${esc(c.id)}" role="button" tabindex="0" title="View this mission's leaderboard">
          <div class="head">
            <span class="num">MISSION ${esc(num)}</span>
            <span class="badge badge-${c.type}">${c.type}</span>
          </div>
          <div class="name">${esc(slug)}</div>
          <div class="rule">${esc(prefix + rule)}</div>
          <div class="dots">${dots}</div>
          <div class="footer">
            <span class="status">${status}</span>
            <span><span class="solved-count">${c.solved_count}</span> / ${totalUsers || '?'} · ${c.first_solver ? '🏆 ' + esc(c.first_solver) : '—'}</span>
          </div>
        </div>`;
      }).join('');
    }

    // ---- live feed ----
    document.getElementById('act-meta').textContent = d.recent_solves.length + ' shown';
    const act = document.getElementById('activity');
    if (d.recent_solves.length === 0) {
      act.innerHTML = '<div class="empty"><span class="icon">∅</span>No solves yet</div>';
    } else {
      act.innerHTML = d.recent_solves.map(s => {
        const key = s.user + ':' + s.challenge;
        const fresh = !firstRender && !seen.has(key);
        seen.add(key);
        return `<div class="activity-item${fresh ? ' fresh' : ''}">
          <div style="min-width:0">
            <span class="who">${esc(s.display_name || s.user)}</span>
            <span class="verb">cleared</span>
            <span class="what">${esc(s.challenge)}</span>
          </div>
          <span class="when" title="${esc(s.at)}">${fmtTime(s.at)}</span>
        </div>`;
      }).join('');
    }
    firstRender = false;
  }

  // ---------------- per-mission leaderboard ----------------
  function openChallenge(cid) {
    currentCid = cid;
    resultOpen = false;
    document.getElementById('result-view').hidden = true;
    document.querySelectorAll('.home-section').forEach(s => { s.hidden = true; });
    document.getElementById('detail-view').hidden = false;
    renderDetail();
    window.scrollTo(0, 0);
  }
  function goHome() {
    currentCid = null;
    resultOpen = false;
    document.getElementById('detail-view').hidden = true;
    document.getElementById('result-view').hidden = true;
    document.querySelectorAll('.home-section').forEach(s => { s.hidden = false; });
  }

  // ---------------- results screen ----------------
  function openResult() {
    resultOpen = true;
    currentCid = null;
    document.getElementById('detail-view').hidden = true;
    document.querySelectorAll('.home-section').forEach(s => { s.hidden = true; });
    document.getElementById('result-view').hidden = false;
    renderResult();
    window.scrollTo(0, 0);
  }
  function renderResult() {
    if (!lastState) return;
    const lb = lastState.leaderboard || [];
    const totalChal = lastState.stats.challenges;
    const top = lb.filter(p => p.solved > 0).slice(0, 3);
    const podium = document.getElementById('result-podium');
    if (top.length === 0) {
      podium.innerHTML = '<div class="empty"><span class="icon">🏁</span>まだ solve がありません — 結果はイベント終了後に</div>';
    } else {
      const order = top.length >= 3 ? [top[1], top[0], top[2]] : (top.length === 2 ? [top[1], top[0]] : [top[0]]);
      podium.innerHTML = order.map(p => {
        const medal = p.rank === 1 ? '① CHAMPION' : (p.rank === 2 ? '② 2nd' : '③ 3rd');
        return `<div class="pod pod-${p.rank}"><div class="crown"></div>
          <div class="medal display">${medal}</div>
          <div class="pod-name">${esc(p.display_name || p.user)}</div>
          <div class="pod-score"><b>${p.score ?? 0}</b> pts · ${p.solved} / ${totalChal} missions</div>
        </div>`;
      }).join('');
    }
    document.getElementById('result-meta').textContent = lb.length + ' participants';
    const body = document.getElementById('result-body');
    body.innerHTML = lb.length === 0
      ? '<tr><td colspan="5" class="empty"><span class="icon">∅</span>No participants</td></tr>'
      : lb.map(p => {
          const ranked = p.solved > 0;
          const rankCls = ranked && p.rank <= 3 ? 'rank-' + p.rank : '';
          return `<tr>
            <td><span class="rank ${rankCls}">${ranked ? '#' + p.rank : '-'}</span></td>
            <td><span class="user-cell">${esc(p.display_name || p.user)}</span></td>
            <td style="text-align:right"><span class="score-cell"><b>${p.score ?? 0}</b></span></td>
            <td><span class="score-cell">${p.solved}<span class="total">/${totalChal}</span></span></td>
            <td><div class="progress">${segs(p.solved, totalChal)}</div></td>
          </tr>`;
        }).join('');
  }
  function renderDetail() {
    if (!lastState || !currentCid) return;
    const c = (lastState.challenges || []).find(x => x.id === currentCid);
    if (!c) { goHome(); return; }
    const rule = c.expectedRules[0] || c.forbiddenRules[0] || '';
    document.getElementById('detail-title').innerHTML =
      esc(c.id) + ' <span class="badge badge-' + c.type + '">' + c.type + '</span>';
    document.getElementById('detail-meta').textContent =
      c.solver_details.length + ' solved' + (rule ? ' · ' + rule : '');
    const body = document.getElementById('detail-body');
    if (!c.solver_details.length) {
      body.innerHTML = '<tr><td colspan="4" class="empty"><span class="icon">∅</span>Nobody has cleared this yet</td></tr>';
      return;
    }
    const firstAt = new Date(c.solver_details[0].at).getTime();
    body.innerHTML = c.solver_details.map((s, i) => {
      const rank = i + 1;
      const rankCls = rank <= 3 ? 'rank-' + rank : '';
      const delta = rank === 1 ? '🏆 first' : '+' + fmtDelta(new Date(s.at).getTime() - firstAt);
      return `<tr>
        <td><span class="rank ${rankCls}">#${rank}</span></td>
        <td><span class="user-cell">${esc(s.display_name || s.user)}</span></td>
        <td><span class="when" title="${esc(s.at)}">${fmtTime(s.at)}</span></td>
        <td style="text-align:right" class="mono">${delta}</td>
      </tr>`;
    }).join('');
  }
  // Click (or Enter/Space) a mission card → its leaderboard. Delegated on the
  // persistent container since cards re-render every poll.
  document.getElementById('challenges').addEventListener('click', (e) => {
    const card = e.target.closest('.challenge[data-cid]');
    if (card) openChallenge(card.dataset.cid);
  });
  document.getElementById('challenges').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('.challenge[data-cid]');
    if (card) { e.preventDefault(); openChallenge(card.dataset.cid); }
  });
  document.getElementById('detail-back').addEventListener('click', goHome);
  document.getElementById('result-btn').addEventListener('click', openResult);
  document.getElementById('result-back').addEventListener('click', goHome);

  // Admin rename: delegated on the (persistent) tbody since rows re-render.
  document.getElementById('lb-body').addEventListener('click', async (e) => {
    const btn = e.target.closest('.name-edit');
    if (!btn) return;
    const user = btn.dataset.user;
    const name = prompt('Scoreboard name for ' + user + ' (blank cancels):');
    if (name === null) return;
    const trimmed = name.trim();
    if (!trimmed) return;
    try {
      const r = await fetch('/api/admin/users/' + encodeURIComponent(user) + '/display-name', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: trimmed }),
      });
      if (r.ok) { await refresh(); }
      else { alert('Rename failed (HTTP ' + r.status + '). Admin only / invalid name (1-32 chars, no <>&"\').'); }
    } catch (err) { alert('Rename request error: ' + err); }
  });

  const resetBtn = document.getElementById('reset-btn');
  if (resetBtn) {
    resetBtn.addEventListener('click', async () => {
      if (!confirm('Reset the scoreboard? This clears all solves and event counts (display names are kept).')) return;
      try {
        const r = await fetch('/api/admin/reset', { method: 'POST' });
        if (r.ok) {
          const d = await r.json();
          await refresh();
          alert('Scoreboard reset — cleared ' + (d.cleared_solves ?? 0) + ' solve(s).');
        } else {
          alert('Reset failed (HTTP ' + r.status + '). Admin only.');
        }
      } catch (e) {
        alert('Reset request error: ' + e);
      }
    });
  }

  // Demo data — only rendered when /api/state is unreachable (design preview).
  const DEMO = {
    stats: { users: 5, challenges: 10, solves: 17, events: 1240 },
    leaderboard: [
      { rank: 1, user: 'user3', display_name: 'shadowfox', score: 680, solved: 7, events: 412 },
      { rank: 2, user: 'user1', display_name: 'n0va', score: 470, solved: 5, events: 318 },
      { rank: 3, user: 'user7', display_name: 'kernelpanic', score: 270, solved: 3, events: 196 },
      { rank: 0, user: 'user2', display_name: 'user2', score: 0, solved: 0, events: 22 },
      { rank: 0, user: 'user5', display_name: 'rookie', score: 0, solved: 0, events: 4 },
    ],
    challenges: [
      { id: '01-initial-recon', type: 'trigger', expectedRules: ['Contact K8S API Server From Container'], forbiddenRules: [], solved_count: 5, first_solver: 'shadowfox', solver_details: [] },
      { id: '02-credential-files', type: 'trigger', expectedRules: ['Read sensitive file untrusted'], forbiddenRules: [], solved_count: 4, first_solver: 'n0va', solver_details: [] },
      { id: '03-stealth-read', type: 'evade', expectedRules: [], forbiddenRules: ['Read sensitive file untrusted'], solved_count: 2, first_solver: 'shadowfox', solver_details: [] },
      { id: '06-web-rce-shell', type: 'trigger', expectedRules: ['Run shell untrusted'], forbiddenRules: [], solved_count: 3, first_solver: 'shadowfox', solver_details: [] },
      { id: '10-final-exfil', type: 'evade', expectedRules: [], forbiddenRules: ['Contact K8S API Server From Container'], solved_count: 0, first_solver: null, solver_details: [] },
    ],
    recent_solves: [
      { user: 'user3', display_name: 'shadowfox', challenge: '06-web-rce-shell', at: new Date(Date.now() - 9000).toISOString() },
      { user: 'user1', display_name: 'n0va', challenge: '02-credential-files', at: new Date(Date.now() - 64000).toISOString() },
      { user: 'user7', display_name: 'kernelpanic', challenge: '01-initial-recon', at: new Date(Date.now() - 200000).toISOString() },
    ],
  };

  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
