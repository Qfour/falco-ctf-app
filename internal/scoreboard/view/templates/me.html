<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>falco-ctf · me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1E1E22;
    --bg-elev: #2B2D30;
    --surface: #2B2D30;
    --surface-2: #3E4042;
    --border: #3E4042;
    --border-strong: #535557;
    --text: #FFFFFF;
    --text-dim: #BBBDBF;
    --text-mute: #8A8C8E;
    --accent: #BDF78B;
    --accent-2: #A8E975;
    --accent-glow: rgba(189, 247, 139, 0.22);
    --success: #BDF78B;
    --success-glow: rgba(189, 247, 139, 0.35);
    --rule-bg: rgba(189, 247, 139, 0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(at 20% -10%, rgba(189, 247, 139, 0.08) 0px, transparent 50%),
      radial-gradient(at 85% 5%, rgba(189, 247, 139, 0.04) 0px, transparent 50%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 2.5rem 3rem;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
  .brand h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.025em; }
  .brand h1 .accent { color: var(--accent); }
  .brand h1 .light { color: var(--text-mute); font-weight: 400; font-size: 1rem; margin-left: 0.5rem; }
  .brand .subtitle { color: var(--text-dim); font-size: 0.875rem; margin-top: 0.25rem; }
  .live { display: flex; align-items: center; gap: 0.5rem; color: var(--accent); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.18em; font-weight: 600; }
  .live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--success-glow); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } }
  .updated { color: var(--text-mute); font-size: 0.7rem; margin-top: 0.25rem; text-align: right; }

  /* Identity hero */
  .ident { display: flex; align-items: center; gap: 1.25rem; margin-bottom: 2rem; padding: 1.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: 0.75rem; }
  .ident .avatar { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--bg); display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; font-weight: 700; }
  .ident .who-name { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; font-weight: 600; color: var(--text); }
  .ident .who-status { color: var(--text-dim); font-size: 0.875rem; margin-top: 0.15rem; }
  .ident .progress-mini { margin-left: auto; min-width: 200px; }
  .ident .progress-mini .label { color: var(--text-mute); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 0.4rem; }
  .ident .progress-mini .bar { width: 100%; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--border); }
  .ident .progress-mini .fill { height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); box-shadow: 0 0 10px var(--accent-glow); transition: width 0.5s ease; }
  .ident .progress-mini .count { color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 1rem; margin-top: 0.4rem; }
  .ident .progress-mini .count .total { color: var(--text-mute); }

  /* Grid: left = next + solved, right = recent rule fires */
  .grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 1.5rem; }
  @media (max-width: 980px) { body { padding: 1.25rem; } .grid { grid-template-columns: 1fr; } }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 0.75rem; margin-bottom: 1.5rem; overflow: hidden; }
  .panel-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .panel-header h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.18em; color: var(--text-dim); font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
  .panel-header h2::before { content: ''; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; }
  .panel-aux { color: var(--text-mute); font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; }

  /* Next challenge */
  .next { padding: 1.25rem 1.5rem; }
  .next .hint { color: var(--text-dim); font-size: 0.8rem; margin-bottom: 0.6rem; }
  .next .target { display: inline-block; padding: 0.75rem 1.25rem; background: var(--bg); border: 1px solid var(--accent); border-radius: 0.5rem; font-family: 'JetBrains Mono', monospace; font-size: 1.05rem; color: var(--accent); box-shadow: 0 0 16px var(--accent-glow); }
  .next .target.done { color: var(--text-mute); border-color: var(--border-strong); box-shadow: none; }

  /* Solved list */
  .solved-list { list-style: none; padding: 0.5rem 0; }
  .solved-list li { display: flex; justify-content: space-between; align-items: center; padding: 0.65rem 1.5rem; border-left: 2px solid var(--accent); transition: background 0.15s; }
  .solved-list li:hover { background: var(--surface-2); }
  .solved-list li .chal { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--text); }
  .solved-list li .at { color: var(--text-mute); font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; }
  .solved-list li .check { color: var(--accent); margin-right: 0.6rem; font-weight: 700; }

  /* Rule fire feed */
  .fires { padding: 0.5rem 0; max-height: 520px; overflow-y: auto; }
  .fires::-webkit-scrollbar { width: 6px; }
  .fires::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .fire-item { padding: 0.75rem 1.5rem; border-left: 2px solid transparent; transition: background 0.15s; }
  .fire-item:hover { background: var(--surface-2); border-left-color: var(--accent); }
  .fire-item.fresh { animation: flash 1.4s ease; }
  @keyframes flash {
    0%   { background: var(--rule-bg); border-left-color: var(--accent); box-shadow: inset 0 0 24px var(--accent-glow); }
    100% { background: transparent; border-left-color: transparent; box-shadow: none; }
  }
  .fire-item .rule { color: var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; font-weight: 500; word-break: break-word; }
  .fire-item .when { color: var(--text-mute); font-size: 0.7rem; font-family: 'JetBrains Mono', monospace; margin-top: 0.2rem; }

  .empty { text-align: center; padding: 2.5rem 1rem; color: var(--text-mute); font-size: 0.875rem; }
  .empty .icon { font-size: 2rem; opacity: 0.4; display: block; margin-bottom: 0.5rem; }

  .help { background: var(--surface); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.5rem; text-align: center; }
  .help h2 { font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 0.4rem; }
  .help p { color: var(--text-dim); font-size: 0.9rem; }
  .help code { background: var(--surface-2); padding: 2px 8px; border-radius: 3px; color: var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 0.85em; }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>falco<span class="accent">-ctf</span> <span class="light mono">me</span></h1>
      <div class="subtitle">your live progress + Falco rule activity</div>
    </div>
    <div>
      <div class="live">● LIVE</div>
      <div class="updated mono" id="updated">connecting…</div>
    </div>
  </header>

  <div id="page"></div>

<script>
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function avatarChar(u) { return (u || '?').slice(-1).toUpperCase(); }
  function fmtAgo(unixSec) {
    const ms = Date.now() - unixSec * 1000;
    const s = Math.max(0, Math.floor(ms / 1000));
    if (s < 5)    return 'just now';
    if (s < 60)   return s + 's ago';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    return Math.floor(s / 3600) + 'h ago';
  }
  function fmtAgoISO(iso) {
    const ms = Date.now() - new Date(iso).getTime();
    const s = Math.max(0, Math.floor(ms / 1000));
    if (s < 5)    return 'just now';
    if (s < 60)   return s + 's ago';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }

  const user = new URLSearchParams(location.search).get('user') || '';
  const fireSeen = new Set();
  let firstRender = true;

  if (!user) {
    document.getElementById('page').innerHTML = `
      <div class="help">
        <h2>Append ?user=&lt;your-username&gt; to the URL</h2>
        <p>Example: <code>${esc(location.origin)}/me?user=alice</code></p>
        <p style="margin-top:0.75rem">If you reached this page from the workspace, ask the operator for your username.</p>
      </div>`;
  } else {
    refresh();
    setInterval(refresh, 2000);
  }

  async function refresh() {
    try {
      const r = await fetch('/api/users/' + encodeURIComponent(user) + '/me');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      render(await r.json());
      document.getElementById('updated').textContent = 'updated ' + new Date().toLocaleTimeString();
    } catch (e) {
      document.getElementById('updated').textContent = 'connection error';
    }
  }

  function render(d) {
    const total = d.total_challenges || 0;
    const solvedCount = d.solved_count || 0;
    const pct = total ? Math.round(100 * solvedCount / total) : 0;
    const fires = d.recent_rule_fires || [];
    const solved = d.solved || [];
    const events = d.events || 0;

    let nextHTML;
    if (d.next_unsolved) {
      nextHTML = `<span class="target">→ ${esc(d.next_unsolved)}</span>`;
    } else if (solvedCount > 0) {
      nextHTML = `<span class="target done">All ${total} challenges solved — nice work.</span>`;
    } else {
      nextHTML = `<span class="target">No challenges loaded yet</span>`;
    }

    const displayName = d.display_name || user;
    const identitySuffix = (displayName !== user) ? ` <span style="color:var(--text-mute); font-weight:400; font-size:0.85rem">(${esc(user)})</span>` : '';
    document.getElementById('page').innerHTML = `
      <section class="ident">
        <div class="avatar">${avatarChar(displayName)}</div>
        <div>
          <div class="who-name">${esc(displayName)}${identitySuffix}</div>
          <div class="who-status">${solvedCount > 0 ? solvedCount + ' challenge' + (solvedCount === 1 ? '' : 's') + ' solved · ' + events.toLocaleString() + ' Falco events triggered' : 'Just getting started · ' + events.toLocaleString() + ' Falco events seen'}</div>
        </div>
        <div class="progress-mini">
          <div class="label">Progress</div>
          <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
          <div class="count">${solvedCount}<span class="total">/${total}</span> · ${pct}%</div>
        </div>
      </section>

      <div class="grid">
        <div>
          <section class="panel">
            <div class="panel-header"><h2>Next challenge</h2></div>
            <div class="next">
              <div class="hint">Pick this up in your terminal:</div>
              ${nextHTML}
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h2>Solved</h2>
              <span class="panel-aux">${solvedCount} done</span>
            </div>
            ${solved.length === 0
              ? '<div class="empty"><span class="icon">∅</span>No solves yet — your first one will appear here.</div>'
              : '<ul class="solved-list">' + solved.map(s => `
                  <li>
                    <span><span class="check">✓</span><span class="chal">${esc(s.challenge)}</span></span>
                    <span class="at" title="${esc(s.at)}">${fmtAgoISO(s.at)}</span>
                  </li>`).join('') + '</ul>'}
          </section>
        </div>

        <section class="panel">
          <div class="panel-header">
            <h2>Falco rules you triggered (last 60s)</h2>
            <span class="panel-aux">${fires.length} fire${fires.length === 1 ? '' : 's'}</span>
          </div>
          <div class="fires">
            ${fires.length === 0
              ? '<div class="empty"><span class="icon">∅</span>Nothing in the last 60s.<br>Run a syscall in your workspace and watch this fill in.</div>'
              : fires.slice().reverse().map(f => {
                  const key = f.rule + ':' + f.at;
                  const fresh = !firstRender && !fireSeen.has(key);
                  fireSeen.add(key);
                  return `<div class="fire-item${fresh ? ' fresh' : ''}">
                    <div class="rule">${esc(f.rule)}</div>
                    <div class="when">${fmtAgo(f.at)}</div>
                  </div>`;
                }).join('')}
          </div>
        </section>
      </div>
    `;
    firstRender = false;
  }
</script>
</body>
</html>
