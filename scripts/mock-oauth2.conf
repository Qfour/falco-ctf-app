# Mock oauth2-proxy /oauth2/auth subrequest for local dev.
# Returns 202 with X-Auth-Request-Email so auth-policy /check can be exercised
# without spinning up Dex.
server {
  listen 80;
  location /oauth2/auth {
    add_header X-Auth-Request-Email "user1@ctf.local" always;
    return 202;
  }
  location / {
    return 404;
  }
}
