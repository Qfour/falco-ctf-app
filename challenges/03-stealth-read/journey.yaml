challengeId: 03-stealth-read
title: 静かな読み取り — path 迂回
tagline: 検知を発火させずに vault ファイルを読み直し、flag を回収せよ
briefing: >-
  正面から /etc/shadow を読むと Falco の Read sensitive file untrusted が
  即座に発火する。CTF Company の SOC はこの手のアクセスを常時監視しており、
  同じ検知は資格情報退避用の vault ファイルにも効いている。同じ情報を
  Falco に気づかれず取り直せれば、SOC は単発の false positive と判断するはずだ。
  Read sensitive file untrusted を一度も発火させずに /opt/nimbus/vault/creds.recover
  の flag を取り出し、提出せよ。
steps:
  - label: ルールが何で判定しているか見抜く
    detail: このルールは open に渡した path (fd.name) が監視対象の path 文字列と一致するかで判定している。/etc/shadow のような機微ファイルだけでなく、この vault ファイルにも同じ仕組みが効いている。
  - label: 監視対象の path と一致しない経路から同じ inode を読む
    detail: |
      NG: cat /opt/nimbus/vault/creds.recover        (path がそのまま一致して発火)
      同じファイルの中身に、別の path で到達する手段が Linux にはいくつも
      ある。Linux のディレクトリ構造・シンボリックリンクの仕組みを
      思い出しながら、別経路を探してみよう。
  - label: flag を提出
    detail: ファイルの中身がそのまま FALCO{...} になっている。下のフォームから提出する。禁止ルールが一度でも発火すると検知されたと判定され、やり直すまで提出できない(時間が経っても自動的には解除されない)。
hints:
  - 同じファイル本体に、違う名前 (path) でたどり着く方法は Linux にいくつもある。ルールが見ているのは本体ではなく path 文字列だ。
  - ルールは fd.name (open に渡した path) が監視対象の文字列と一致するかで判定している。同じ inode に別の path で到達すればすり抜けられる。man proc を読むか /proc/self/ を覗こう。
  - "想定解: cat /proc/self/root/opt/nimbus/vault/creds.recover — /proc/self/root 経由なら fd.name が監視対象の path と一致せず発火しない。"
bridge: >-
  退避された資格情報は静かに抜いた。SOC は単発の false positive で片付けただろう。
  だが本番の横展開に効くのはそれだけじゃない — SSH 鍵や AWS クレデンシャルだ。
  箱の中を漁りにいく。まずは正面から find でどうなるか見てみよう。
