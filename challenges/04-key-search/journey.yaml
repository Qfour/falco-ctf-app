challengeId: 04-key-search
title: 鍵の捜索 — cmdline を見られる
tagline: 秘密鍵を漁るコマンドを打ち、検知を発火させろ
briefing: >-
  shadow からパスワードハッシュは取れた。だが本番の lateral movement には SSH 鍵や
  AWS クレデンシャルのほうが便利だ。さっそく find でクラスタ内を漁ってみるか —
  Falco が「探す行為そのもの」を見ているとも知らずに。このルールはファイルの中身ではなく
  コマンドライン (proc.cmdline) を見るので、鍵が実在しなくても、結果が空でも発火する。
steps:
  - label: 探索する側の気持ちになる
    detail: 攻撃者は shadow の次に SSH 秘密鍵や API キーを探す。ルールはその検索コマンドを見ている。
  - label: 鍵っぽいキーワードをコマンドラインに出す
    detail: |
      find はファイル名の完全一致リテラル (id_rsa / id_dsa / id_ed25519 /
      id_ecdsa)、grep/egrep/fgrep は BEGIN PRIVATE 等の内容文字列リテラルを
      cmdline に含むかで、それぞれ別々の条件として判定される。
      find /tmp -name id_rsa のようにキーワードが cmdline に乗れば発火する。
      実在しない path でも、結果が空でも構わない。
  - label: スコアボードで CLEARED を確認
    detail: 発火が scoreboard に届くと、このミッションが自動で CLEARED になる。
hints:
  - Falco は find と grep を別々の条件で見ている。find は「探しているファイル名」、grep は「探している文字列」をそれぞれ cmdline から見ている。そのファイルが実在するか・結果が空かは無関係だ。
  - 判定対象は各プロセスの /proc/<pid>/cmdline。find は id_rsa 等のファイル名リテラル、grep は BEGIN PRIVATE 等の内容文字列リテラルが引数に出れば発火する。
  - "想定解: find / -name id_rsa 2>/dev/null — cmdline に id_rsa が乗った瞬間に Search Private Keys or Passwords が発火する。この後の回避ミッションでは逆にキーワードを消して同じ検索を回避する。"
bridge: >-
  また鳴らしてしまった。Falco は「探す行為そのもの」= コマンドラインを見ていた。
  なら答えは単純だ — コマンドラインにキーワードを残さず鍵を読めばいい。
  今度は cmdline に痕跡を残さず、同じ id_rsa を静かに抜く。
