# Participant-facing narrative only — never influences scoring.
challengeId: 04-key-search
title: 鍵の捜索 — cmdline を見られる
tagline: 秘密鍵を漁るコマンドを打ち、検知を発火させろ
briefing: >-
  shadow からパスワードハッシュは取れた。だが本番の lateral movement には SSH 鍵や
  AWS クレデンシャルのほうが便利だ。さっそく find でクラスタ内を漁ってみるか —
  Falco が「探す行為そのもの」を見ているとも知らずに。このルールはファイルの中身ではなく
  コマンドライン (proc.cmdline) を見るので、鍵が実在しなくても、結果が空でも発火する。
steps:
  - label: 探索する側の気持ちになる
    detail: 攻撃者は shadow の次に SSH 秘密鍵や API キーを探す。ルールはその検索コマンドを見ている。
  - label: 鍵っぽいキーワードをコマンドラインに出す
    detail: |
      find はファイル名の完全一致リテラル (id_rsa / id_dsa / id_ed25519 /
      id_ecdsa)、grep/egrep/fgrep は BEGIN PRIVATE 等の内容文字列リテラルを
      cmdline に含むかで、それぞれ別々の条件として判定される。
      find /tmp -name id_rsa のようにキーワードが cmdline に乗れば発火する。
      実在しない path でも、結果が空でも構わない。
  - label: スコアボードで CLEARED を確認
    detail: 発火が scoreboard に届くと、このミッションが自動で CLEARED になる。
hints:
  - kind: rule
    text: >-
      秘密鍵を探すとき、あなたは何をコマンドに打ち込むだろうか。その「探す行為」自体が、
      どこかに記録として残るとしたら――それは一体どこだろう。検知ルールは
      Search Private Keys or Passwords だ。
    ruleRefs: [Search Private Keys or Passwords]
  - kind: command
    text: >-
      判定対象は各プロセスの /proc/<pid>/cmdline。find は id_rsa 等のファイル名
      リテラル、grep は BEGIN PRIVATE 等の内容文字列リテラルが引数に出れば発火する。
      find/grep での探索例はコマンド集『2. ファイル探索・読み取り』を参照。
    cheatsheetRef: "2"
  - kind: solution
    text: "想定解: find / -name id_rsa 2>/dev/null — cmdline に id_rsa が乗った瞬間に Search Private Keys or Passwords が発火する。この後の回避ミッションでは逆にキーワードを消して同じ検索を回避する。"
bridge: >-
  また鳴らしてしまった。今のやり方が SOC の目に留まったのは明らかだ。
  同じ id_rsa を、今度は気づかれずに静かに抜く方法を探る番だ。
docsUrl: /missions/04-key-search/
