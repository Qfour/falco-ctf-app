challengeId: 02-credential-files
title: 資格情報の奪取 — 王道の /etc/shadow
tagline: 侵入後の定石で機密ファイルを読み、検知を発火させろ
briefing: >-
  侵入した環境ではまず、書き込みは即バレるという鉄則を踏まえておく必要がある。
  次は王道の credential 窃取だ。
  Linux でパスワードハッシュが眠る場所と言えば古典中の古典、/etc/shadow。
  Falco はコンテナ内であっても host kernel の syscall を観測しているので、
  境界の中で読んでも逃れられない。Read sensitive file untrusted を発火させれば CLEARED。
steps:
  - label: 侵入後の定石を思い出す
    detail: 攻撃者が真っ先に狙うのは root しか読まないパスワードハッシュの実体ファイル。
  - label: 機密ファイルを読む
    detail: |
      パスワードハッシュの実体ファイルを普通に開いてみよう (cat/less/head 等どれでも可)。
      /etc/sudoers や /etc/pam.d/su など sensitive_files に含まれる path でも発火する。
  - label: スコアボードで CLEARED を確認
    detail: 読み取りが scoreboard に届くと、このミッションが自動で CLEARED になる。
hints:
  - Linux で「パスワードハッシュの実体」が置かれる伝統的なファイルは何か。本来 root しか読まない場所だ。
  - Falco が見るのは open に渡した path (fd.name)。cat / less / head どのコマンドで開いても発火する。
  - "想定解: cat /etc/shadow — 開いた瞬間に Read sensitive file untrusted が発火する。path 文字列で判定している点を覚えておくと、この先の回避ミッションで効いてくる。"
bridge: >-
  盛大にアラートを鳴らしてしまった — SOC はもうこちらを見ている。だが今のは「正面から
  読んだ」から光ったに過ぎない。同じ Read sensitive file untrusted は /etc/shadow
  専用ではなく、資格情報退避用の vault ファイルにも効いている。今度はその vault
  ファイルを、静かに読み直す番だ。
docsUrl: /missions/02-credential-files/
