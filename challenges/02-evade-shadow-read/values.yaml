# Per-challenge Helm values overlay applied by `charts/ctf-user/deploy-user.sh`.
# Seeds the per-user flag into /etc/shadow so it counts as a sensitive read,
# then leaves the container running.

challenge:
  extraEnv:
    - name: CTF02_FLAG
      value: "FALCO{ev4d3d_w1th_pr0c_self_r00t_2026}"
  postStart:
    - sh
    - -c
    - >-
      printf '# falco-ctf flag: %s\n' "${CTF02_FLAG}" >> /etc/shadow
