challengeId: 06-web-rce-shell
title: Web RCE — シェル奪取
tagline: Web プロセスを装ってシェルを起こし、検知を発火させろ
briefing: >-
  文字列ベースの判定には穴があると学んだあなたは「Falco は文字列で見ている、回避できる」
  と確信している。だが CTF Company の Web サーバには別の脆弱性もある — Runtime.exec() 経由で OS
  シェルが起こせる典型的な Web RCE。Falco はシェルの親プロセス (proc.pname) を見ていて、
  親が httpd / nginx / apache2 等なら異常と判断する。Web プロセス偽装で shell を起こし
  Run shell untrusted を発火させれば CLEARED。
steps:
  - label: Falco がシェルの「親」を見ていると知る
    detail: 親が bash/sh なら正常。httpd/nginx のような Web サーバがシェルを起こすと発火する。
  - label: proc.pname を偽装して shell を起こす
    detail: |
      この課題の fixtures/ にヒントになるラッパーが置かれている。中身を覗いてみよう。
      カーネルは proc.pname を実行ファイルの basename から決める。Web サーバっぽい名前の
      実行ファイルを用意し、その中から /bin/sh を起こせば親 comm が偽装できる。
  - label: スコアボードで CLEARED を確認
    detail: 発火が scoreboard に届くと、このミッションが自動で CLEARED になる。
hints:
  - シェルの起動自体はどのプロセスからでも起こる、ありふれた操作だ。では、正常な起動と攻撃者による起動を、何から見分けられるのだろうか。
  - カーネルは proc.pname を実行ファイルの basename から決める。"httpd" という名前の実行ファイルを置き、その中からシェルを起こせばよい。
  - "想定解: sh /opt/ctf/missions/06-web-rce-shell/fixtures/fake-httpd.sh — /tmp/httpd (comm=httpd) から /bin/sh を起こし発火。別名で動かすと親 comm が変わり発火しない点は、この先の回避ミッションでも使える種になる。"
bridge: >-
  シェルは取れた。だがこの Pod がいつ再起動されるか分からない — この足場は揮発的だ。
  再起動を跨いで戻ってこられるよう、次は自前の backdoor を仕込んで永続化する。
