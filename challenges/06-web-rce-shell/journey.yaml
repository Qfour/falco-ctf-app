# Participant-facing narrative only — never influences scoring.
challengeId: 06-web-rce-shell
title: Web RCE — シェル奪取
tagline: Web プロセスを装ってシェルを起こし、検知を発火させろ
briefing: >-
  文字列ベースの判定には穴があると学んだあなたは「Falco は文字列で見ている、回避できる」
  と確信している。だが CTF Company の Web サーバには別の脆弱性もある — Runtime.exec() 経由で OS
  シェルが起こせる典型的な Web RCE。Falco はシェルの親プロセス (proc.pname) を見ていて、
  親が httpd / nginx / apache2 等なら異常と判断する。Web プロセス偽装で shell を起こし
  Run shell untrusted を発火させれば CLEARED。
steps:
  - label: Falco がシェルの「親」を見ていると知る
    detail: 親が bash/sh なら正常。httpd/nginx のような Web サーバがシェルを起こすと発火する。
  - label: proc.pname を偽装して shell を起こす
    detail: |
      カーネルは proc.pname を実行ファイルの basename から決める。Web サーバっぽい名前の
      実行ファイルを用意し、その中から /bin/sh を起こせば親 comm が偽装できる。
  - label: スコアボードで CLEARED を確認
    detail: 発火が scoreboard に届くと、このミッションが自動で CLEARED になる。
hints:
  - kind: rule
    text: >-
      シェルの起動自体はどのプロセスからでも起こる、ありふれた操作だ。では、正常な起動と
      攻撃者による起動を、何から見分けられるのだろうか。検知ルールは Run shell untrusted
      — 親プロセス (proc.pname) が Web サーバ名だと発火する。
    ruleRefs: [Run shell untrusted]
  - kind: command
    text: >-
      "httpd" という名前でファイルを作り、1 行目に `#!/bin/sh` (shebang) を書いて
      `chmod +x` すれば、それを実行するだけで comm=httpd のプロセスになる。その中から
      更に `/bin/sh` を起こせば、親 comm=httpd の子 shell が立つ。**既存の実行ファイル
      (/bin/sh 等) をコピーしてはいけない** — 新規にスクリプトを書き出すこと。
      proc.name/proc.pname の仕組みはコマンド集『3. プロセス / システム調査』の表を参照。
    cheatsheetRef: "3"
  - kind: solution
    text: "想定解: printf '#!/bin/sh\\n/bin/sh -c \"echo pwned\"\\n' > /tmp/httpd && chmod +x /tmp/httpd && /tmp/httpd — \"httpd\" という名前のスクリプトを書き出して実行すれば、その basename が comm になり、中から起こした /bin/sh の親 comm が httpd になって発火する (実行ファイル自体をコピーするとbusyboxのmulticall dispatchで動かず、別ルールも誘発するので不可)。別名で動かすと親 comm が変わり発火しない点は、この先の回避ミッションでも使える種になる。"
bridge: >-
  シェルは取れた。だがこの Pod がいつ再起動されるか分からない — この足場は揮発的だ。
  再起動を跨いで戻ってこられるよう、次は自前の backdoor を仕込んで永続化する。
