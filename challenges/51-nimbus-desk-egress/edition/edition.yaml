version: 1
# No timestamp slot: every time in template/ is a literal string. They are the times of the
# same incident as 50-nimbus-desk-triage (its practice time.base 2026-10-21T17:00:00Z) and
# must stay equal to the literal times of 50's template: the refused connection 17:23:40,
# 17:23:55, 17:24:11; the shell tree's alerts 17:14:07, 17:15:32, 17:18:44; the restart
# 17:31:09. An edition that shifts 50's times shifts these by the same amount (README.md).
fixed:
  tactic-order: "execution,discovery,credential-access,collection,c2-exfiltration"
slots:
  # Q5 dest-host: the host name the shell's connection to 203.0.113.77 was meant for. It is
  # only in cluster-dns.log (the gateway refused the connection before any name was sent).
  # The 20 decoys are hosts of the same shape that the web service resolved from the same
  # pod in the same half hour (its link-preview check): 10 of them were then fetched through
  # the egress proxy, 10 were never fetched (nobody opened the ticket), so "not in the proxy
  # log" still leaves 11. Only the DNS answer = the refused dst decides. 16 x 32 = 512 names
  # (B8: S >= 2N for N <= 256 seats; 20 = MaxDecoys).
  - name: dest
    role: answer
    question: dest-host
    decoys: 20
