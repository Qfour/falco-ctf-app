version: 1
# The same incident and the same timeline as 50-nimbus-desk-triage (ADR-0056 amendment 26,
# B15): every LITERAL time of template/ is one of the literal times of 50's template (the
# shared egress-gateway.log, the three alerts 17:14:07 / 17:15:32 / 17:18:44, the
# preservation times, and the DNS / proxy lines of the shared world, which are written at the
# second of the 50 record they belong with). Every instant that exists in this bundle only (the
# web service's link-preview checks, the internal lookups, the intruder's lookup, the proxy
# fetches) is a filler slot (dns-* / px-*), drawn per seat in its own window.
#
# time.base is 50's (the same string): the windows are seconds after it. No window starts
# before 600 (17:10:00): 50's answer window is [17:00:00, 17:10:00), and a value drawn there
# could equal 50's answer of the same seat (B13). If an edition moves 50's time.base and its
# literal times, it moves this time.base and these literal times by the same amount.
#
# No fixed question (amendment 26): both questions vary per seat.
time:
  base: "2026-10-21T17:00:00Z"
slots:
  # Q5 dest-host: the host name the shell's connection to 203.0.113.77 was meant for. It is
  # only in cluster-dns.log (the gateway refused the connection before any name was sent).
  # The 20 decoys are hosts of the same shape that the web service resolved from the same
  # pod in the same half hour (its link-preview check): 10 of them were then fetched through
  # the egress proxy, 10 were never fetched (nobody opened the ticket), so "not in the proxy
  # log" still leaves 11. Only the DNS answer = the refused dst decides. 16 x 32 = 512 names
  # (B8: S >= 2N for N <= 256 seats; 20 = MaxDecoys).
