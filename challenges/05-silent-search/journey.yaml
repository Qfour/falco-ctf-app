# NOTE: evade mission — never write the flag value here (public repo).
challengeId: 05-silent-search
title: 静かな探索 — cmdline 回避
tagline: 検知ルールを発火させずに秘密鍵を読み出し、flag を回収せよ
briefing: >-
  防御側は cmdline のキーワードで危険な操作を検知している。
  だが cmdline 判定には穴がある。攻撃者はコマンドラインに痕跡を残さず
  /root/.ssh/id_rsa を読む方法を知っている。Search Private Keys or Passwords を
  一度も発火させずに鍵の中身から flag を抜き出し、提出せよ。
steps:
  - label: 鍵ファイルの場所を把握
    detail: /root/.ssh/id_rsa に postStart で秘密鍵が配置されている。
  - label: cmdline に痕跡を残さず読む
    detail: |
      現状の Search Private Keys or Passwords は grep/egrep/fgrep が BEGIN PRIVATE
      等の文字列を含む場合、または find が id_rsa 等のファイル名を含む場合にのみ
      発火する条件になっており、素の cat /root/.ssh/id_rsa 単体ではこのルールを
      発火させない。だが CLEARED はそれだけでは成立しない — このミッションは
      「入力リダイレクトで鍵を読んだ」ことを示す positive-proof ルール (Shell
      Redirected Private Key Read) の発火を別途要求している。コマンドライン引数に
      ファイル名を出さずに、同じファイルの中身をシェルへ渡す仕組みを使おう。
      シェルの入出力の繋ぎ方を思い出そう。
  - label: flag を提出
    detail: 鍵の中身に埋め込まれた FALCO{...} を下のフォームから提出する。禁止ルールが一度でも発火すると検知されたと判定され、やり直すまで提出できない（時間が経っても自動的には解除されない）。
hints:
  - kind: rule
    text: >-
      コマンドライン引数にファイル名を出さずにファイルを読む方法を考えよう。回避対象
      (禁止) ルールは Search Private Keys or Passwords。加えてこのミッションは、
      リダイレクト技法を実際に使ったことを示す positive-proof ルール
      Shell Redirected Private Key Read の発火を CLEARED の条件にしている
      (ここだけ他ミッションと逆で、発火させないと成立しない)。
    ruleRefs: [Search Private Keys or Passwords, Shell Redirected Private Key Read]
  - kind: command
    text: >-
      シェルの入力リダイレクト `<` を使うと、exec される cmdline は引数を含まない —
      このミッションは、その技法を実際に使ったことを示す positive-proof ルールの
      発火を CLEARED の条件にしている。自分のプロセスや /proc の観察はコマンド集
      『3. プロセス / システム調査』を参考に。
    cheatsheetRef: "3"
  - kind: solution
    text: "想定解: cat < /root/.ssh/id_rsa | grep FALCO / xxd < /root/.ssh/id_rsa。シェルが redirection でファイルを開くイベント自体が Shell Redirected Private Key Read を発火させ、これが技法を使った証明になる。fork-exec された cat の /proc/<pid>/cmdline は \"cat\" のみになる。"
bridge: >-
  鍵を静かに手に入れた。ここからが本題 — 盗んだ資格情報で別のサービスへ横展開する。
  CTF Company の Web サーバには RCE がある。そこからシェルを起こしにいく。
