challengeId: 05-silent-search
type: evade
forbiddenRules:
  - Search Private Keys or Passwords
# ADR-0008 Decision (2)(3): positive proof-of-technique. "Shell Redirected
# Private Key Read" is a NEW project-specific Falco rule (not upstream —
# see challenges/custom-falco-rules.txt) that fires when a shell opens
# /root/.ssh/id_rsa via input redirection BEFORE exec'ing its next command,
# proving the participant actually used the redirection technique rather
# than merely never having triggered the forbidden rule above.
expectedRules:
  - Shell Redirected Private Key Read
requireExpectedRuleFire: true
# Placeholder for local dev/tests. Real flag injected at deploy via FLAGS_FILE.
expectedFlag: FALCO{dev-silent-search}
# ATT&CK mapping — canonical source for docs/Navigator layer (make gen-attack).
# T1202 (previous mapping) is Windows-only on attack.mitre.org — its definition
# is specifically Forfiles/pcalua.exe/WSL/Scriptrunner indirection, not shell
# redirection. T1027.010 Command Obfuscation (platform: Linux/Windows/macOS)
# explicitly names "input streams" among the tricks used to keep arguments out
# of a monitored command line, citing stdin-based obfuscation in the wild — an
# exact match for `cat < id_rsa` evading the forbidden rule's proc.args match.
# (Not the T1027 parent: that's about obfuscating file/payload content, a
# different mechanism than obfuscating the command invocation itself.)
# ATT&CK v19 (2026-04-28) split TA0005 "Defense Evasion" into "Stealth"
# (TA0005) and "Defense Impairment" (TA0112, new). T1027.010 stayed under
# Stealth — verified attack.mitre.org (ADR-0024). techniqueId/Name
# unchanged, tactic label only.
attack:
  tactic: "Stealth"
  techniqueId: "T1027.010"
  techniqueName: "Command Obfuscation"
