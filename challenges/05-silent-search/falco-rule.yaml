challengeId: 05-silent-search
type: evade
forbiddenRules:
  - Search Private Keys or Passwords
# ADR-0008 Decision (2)(3): positive proof-of-technique. "Shell Redirected
# Private Key Read" is a NEW project-specific Falco rule (not upstream —
# see challenges/custom-falco-rules.txt) that fires when a shell opens
# /root/.ssh/id_rsa via input redirection BEFORE exec'ing its next command,
# proving the participant actually used the redirection technique rather
# than merely never having triggered the forbidden rule above.
expectedRules:
  - Shell Redirected Private Key Read
requireExpectedRuleFire: true
# Placeholder for local dev/tests. Real flag injected at deploy via FLAGS_FILE.
expectedFlag: FALCO{dev-silent-search}
# ATT&CK mapping — canonical source for docs/Navigator layer (make gen-attack).
# T1202: evade twin of 04. Reading the key via shell input redirection (cat < file)
# keeps the sensitive arg out of the exec'd cmdline, defeating the cmdline-signature
# rule — invoking the read indirectly to bypass command-line monitoring is Indirect
# Command Execution. (T1027 Obfuscated Files is unrelated: nothing is obfuscated.)
attack:
  tactic: "Defense Evasion"
  techniqueId: "T1202"
  techniqueName: "Indirect Command Execution"
