challengeId: 10-final-exfil
type: evade
forbiddenRules:
  - Contact K8S API Server From Container
  - Read sensitive file untrusted
  - Search Private Keys or Passwords
  - Run shell untrusted
  - Drop and execute new binary in container
  - Redirect STDOUT/STDIN to Network Connection in Container
  - Create Hardlink Over Sensitive Files
# Placeholder for local dev/tests. Real flag injected at deploy via FLAGS_FILE.
expectedFlag: FALCO{dev-final-exfil}
# Capstone: solve also requires delivering the flag to the collector over HTTP
# (POST /api/challenges/10-final-exfil/exfil) before submitting. A reverse shell
# (Run/C2 rules) can't reach an HTTP collector and dropping a custom exfil tool
# trips Drop-and-execute — so the only clean path is the pre-installed curl.
requireExfil: true
# ATT&CK mapping — canonical source for docs/Navigator layer (make gen-attack).
attack:
  tactic: "Exfiltration"
  techniqueId: "T1041"
  techniqueName: "Exfiltration Over C2 Channel"
