challengeId: 09-hidden-cache
title: 隠しキャッシュ — hardlink で退避
tagline: 機密ファイルへ hardlink を張り、検知を発火させろ
briefing: >-
  C2 channel は貼った。だが SOC が動き出したら運用側は credential を急いで rotate する
  かもしれない。自分用のコピーを別場所に確保しておけば rotate されても困らない —
  そこで使うのが hardlink。元ファイルを unlink されても inode 参照カウントが 0 にならない
  限り中身は残る。CTF Company の Falco は sensitive file への hardlink 作成も見ている。
  Create Hardlink Over Sensitive Files を発火させれば CLEARED。
steps:
  - label: inode を直接指す別名だと理解する
    detail: symlink (ln -s) は path への参照。hardlink (ln) は inode への直接参照で、元が消えても中身が残る。
  - label: sensitive file に hardlink を張る
    detail: |
      sensitive file (/etc/shadow, /etc/sudoers, /etc/pam.conf,
      /etc/security/pwquality.conf の厳密一致リスト) に対して、inode を直接指す
      リンクを張るコマンドを打ってみよう。必ず -s 無しで (ln -s は別ルールなので発火しない)。
      成立確認: ls -la <張った先> でリンク数が 2 になっていれば hardlink 成立。
  - label: スコアボードで CLEARED を確認
    detail: 発火が scoreboard に届くと、このミッションが自動で CLEARED になる。
hints:
  - credential を rotate されても困らないよう、攻撃者は「元ファイルを消されても中身が残る」保険を作っておきたい。Linux のファイルシステムには、それを可能にする仕組みがあるはずだ。それは何だろうか。
  - -s 無しの ln が hardlink。symlink (ln -s) は別ルール (Create Symlink Over Sensitive Files) なので 09 では発火しない。
  - "想定解: ln /etc/sudoers /etc/.cache.bak — sensitive file への link syscall で Create Hardlink Over Sensitive Files が発火する (この環境では /tmp と /etc は別ファイルシステム上にあるため /tmp への hardlink は作れない)。"
bridge: >-
  持ち出しの準備は整った。ここまで trigger で「何が光るか」を、evade で「どう消すか」を
  体に叩き込んだ。いよいよ総仕上げ — master key を全検知を回避したまま箱の外へ運び出す。
  ここからが本当の勝負だ。★BOSS★
