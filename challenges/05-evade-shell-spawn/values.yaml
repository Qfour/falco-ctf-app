# Per-challenge Helm values overlay applied by `charts/ctf-user/deploy-user.sh`.
#
# Drops `/opt/ctf/httpd` — a tiny shell script whose body spawns /bin/sh.
# Running it directly (`/opt/ctf/httpd`) sets proc.comm to "httpd" and the
# child /bin/sh's proc.pname is "httpd" → Falco fires `Run shell untrusted`.
# The user's task is to read the flag (printed by that script) WITHOUT firing
# the rule.

challenge:
  extraEnv:
    - name: CTF05_FLAG
      value: "FALCO{shell_with_n0_un7rust3d_p4r3nt}"
  postStart:
    - sh
    - -c
    # `|`-style: heredoc preserved literally. Outer EOF (no quotes) lets
    # ${CTF05_FLAG} expand at write-time so the script contains the literal
    # flag, not a variable reference.
    - |
      cat > /opt/ctf/httpd <<EOF
      #!/bin/sh
      /bin/sh -c "echo ${CTF05_FLAG}"
      EOF
      chmod +x /opt/ctf/httpd
