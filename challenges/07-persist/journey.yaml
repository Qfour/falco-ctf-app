challengeId: 07-persist
title: 永続化 — バイナリの設置
tagline: イメージに無いバイナリを drop して実行し、検知を発火させろ
briefing: >-
  シェルは取れたが Pod はいつ再起動されるか分からない。そこで永続化だ。backdoor を
  書き込んで実行可能な場所に置き、そこから RCE を生やす。コンテナイメージは build 時に
  固まるので、runtime に書いた binary は overlayfs の upper layer に積まれる。Falco は
  exec 時にこの layer 情報を見て「base image に無い場所からの実行」を検知する。drop (書く) と
  execute (実行する) の両方で Drop and execute new binary in container を発火させれば CLEARED。
steps:
  - label: イメージに無いものは見抜かれると知る
    detail: 元から在る /bin/ls の実行では発火しない。自分で書いた binary の実行が条件だ。
  - label: バイナリを drop してから実行する
    detail: |
      cp /bin/sleep /usr/local/bin/backdoor    # drop (upper layer に書く)
      /usr/local/bin/backdoor 1                # execute
      中身は何でもよい (/bin/sleep のコピーで可)。配置先は image に元々無い場所なら /tmp/x でも可。
  - label: スコアボードで CLEARED を確認
    detail: 発火が scoreboard に届くと、このミッションが自動で CLEARED になる。
hints:
  - runtime に書いた binary を実行すると、Falco は「base image に無かった場所からの実行」として捕捉する。永続化したい攻撃者の典型挙動だ。
  - 「書いてから実行」の両方が要る。元から在る /bin/ls の実行では発火しない。busybox 系は argv[0] チェックがあるので /bin/sleep が最も素直に動く。
  - "想定解: cp /bin/sleep /usr/local/bin/backdoor && /usr/local/bin/backdoor 1 — 自前ツールの drop+実行は必ず発火する、という教訓が Mission 10 で効く。"
bridge: >-
  backdoor は据えた。あとは「好きな時に戻ってくる」ための通り道が要る。
  古典の reverse shell を貼って、こちらの C2 サーバへビーコンを飛ばす。
