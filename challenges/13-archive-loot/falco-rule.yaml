# archive/compression utility (tar/gzip/gunzip/bzip2/bunzip2/xz/unxz/zip/
# unzip/7z/7za/cpio). That is exactly "archive/compress the collected files
# with a CLI utility" — T1560.001 (Archive Collected Data: Archive via
# Utility), not the broader parent T1560 (which also covers T1560.002
# Archive via Library and T1560.003 Archive via Custom Method — neither of
# which this detection technique distinguishes). Same remapping discipline
# as 02-credential-files / 12-cover-tracks (upstream's coarser tag ->
# honest sub-technique based on the actual condition, ADR-0017 Decision (2)).
attack:
  tactic: "Collection"
  techniqueId: "T1560.001"
  techniqueName: "Archive Collected Data: Archive via Utility"
