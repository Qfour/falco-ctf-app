# P19-2b (single origin): docs-admin (運営: 想定解・解説込み) is served under
# a PATH on the shared single-origin host (e.g. app.<suffix>/docs-admin/)
# instead of its own docs-admin.<suffix> subdomain. The Ingress
# (charts/docs/templates/ingress-admin.yaml) additionally gates this path at
# auth-policy /check-admin, so reaching it requires an admin login regardless
# of this mapping.
#
# The participant-facing docroot (/usr/share/nginx/html, brief-only build)
# and its Ingress were already removed in P23-5 — that content now lives in
# the unified portal's Home tab (internal/scoreboard/view/home.go). This
# image still builds BOTH docroots (images/docs/Dockerfile) because removing
# the participant `mkdocs build` step is an image-build change outside this
# task's scope; this nginx config simply never routes to it.
#
# `alias` (not `root`) is load-bearing here: `location /docs-admin/` matches
# a path prefix that must be STRIPPED before hitting the filesystem (the
# built site's own index.html lives at the docroot's OWN root, not under a
# docs-admin/ subdirectory) — `root` would instead APPEND the full request
# path (looking for .../html-admin/docs-admin/index.html, which does not
# exist). MkDocs (use_directory_urls, no site_url set — see
# docs-site/mkdocs.yml) emits relative links/asset URLs, so every generated
# page and asset resolves correctly under the /docs-admin/ prefix as long as
# the browser's current URL keeps the trailing slash (the bare, no-slash
# `location = /docs-admin` redirect below guarantees that).
server {
    listen 8080;
    server_name _;
    index index.html;

    # Redirect the no-trailing-slash form so relative asset/link resolution
    # inside the mkdocs-material site is always anchored at /docs-admin/
    # (browsers resolve "assets/extra.css" against the CURRENT URL's
    # directory — without the slash that would incorrectly resolve to /assets/).
    location = /docs-admin {
        return 301 /docs-admin/;
    }

    location /docs-admin/ {
        alias /usr/share/nginx/html-admin/;
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
