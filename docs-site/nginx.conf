server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # MkDocs uses directory URLs (/missions/01-.../ -> index.html).
    location / {
        try_files $uri $uri/ =404;
    }

    # Per-mission PDFs.
    location /pdf/ {
        types { application/pdf pdf; }
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
