# Two doc roots in one image, selected by Host (env-agnostic prefix match):
#   docs-admin.<suffix> → /usr/share/nginx/html-admin  (運営: 想定解・解説込み)
#   anything else        → /usr/share/nginx/html        (参加者: ブリーフのみ)
# The admin host is additionally gated at the ingress by auth-policy /check-admin,
# so reaching the admin root requires an admin login regardless of this mapping.
map $host $docroot {
    ~^docs-admin\.  /usr/share/nginx/html-admin;
    default         /usr/share/nginx/html;
}

server {
    listen 8080;
    server_name _;
    root $docroot;
    index index.html;

    # MkDocs directory URLs.
    location / {
        try_files $uri $uri/ =404;
    }

    # Hint state lives in the scoreboard. Proxy same-origin so the participant
    # JS needs no CORS; the in-cluster call bypasses the scoreboard's own
    # admin ingress, so writes are gated by THIS host's ingress (/check-admin
    # on docs-admin) + the scoreboard's server-side isAdmin (X-Auth-Request-Email).
    location /api/ {
        proxy_pass http://scoreboard.scoreboard.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
        proxy_set_header X-Auth-Request-User  $http_x_auth_request_user;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
