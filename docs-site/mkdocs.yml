site_name: !ENV [DOCS_SITE_NAME, "Falco CTF — 課題ドキュメント"]
site_description: CTF Company — 課題ごとのミッションブリーフ
docs_dir: docs
use_directory_urls: true

# Explicit nav so はじめに / ストーリー / 参考資料 are top-level siblings, with the
# missions under their own section. All pages must be listed (mkdocs --strict).
# missions/*.md are generated by gen-pages.py before the build (10 fixed missions).
nav:
  - はじめに: index.md
  - ストーリー: story.md
  - 参考資料: references.md
  - ミッション:
      - missions/index.md
      - missions/01-initial-recon.md
      - missions/02-credential-files.md
      - missions/03-stealth-read.md
      - missions/04-key-search.md
      - missions/05-silent-search.md
      - missions/06-web-rce-shell.md
      - missions/07-persist.md
      - missions/08-c2-beacon.md
      - missions/09-hidden-cache.md
      - missions/10-final-exfil.md

theme:
  name: material
  language: ja
  palette:
    scheme: slate
    primary: black
    accent: cyan
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/hints.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details

exclude_docs: |
  assets/missions/README.md

plugins:
  - search:
      lang: ja
