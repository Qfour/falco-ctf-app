site_name: !ENV [DOCS_SITE_NAME, "Falco CTF — 課題ドキュメント"]
site_description: CTF Company — 課題ごとのミッションブリーフ
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  language: ja
  palette:
    scheme: slate
    primary: black
    accent: cyan
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/hints.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details

exclude_docs: |
  assets/missions/README.md

plugins:
  - search:
      lang: ja
