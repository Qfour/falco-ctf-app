openapi: 3.1.0
info:
  title: falco-ctf collector
  version: "1"
  description: |
    The collector binary's COMPLETE HTTP surface (ADR-0005). New document —
    before ADR-0005 this service had NO spec at all, which meant the ONE
    participant-facing contract a workspace can actually reach
    (`POST /api/challenges/{cid}/exfil`) was written down nowhere but the
    mission brief.

    What this service is
    --------------------
    The participant-facing front for a CTF workspace (P11.5 "full one-pipe").
    Once ctf-user egress lockdown is on, a workspace pod can reach ONLY the
    collector — never the scoreboard directly. The collector holds NO CTF state
    (no catalog, no flags, no DB): it is an allowlisted forwarder that checks one
    thing itself, the challenge-id grammar (a `{cid}` outside it is answered 404
    and not forwarded, ADR-0041). Solve
    truth stays in the scoreboard.

    Default-deny routing is part of the contract
    --------------------------------------------
    Only the two participant routes below are forwarded (`exfil` and `submit`). Everything else
    (`/falco/events`, `/internal/*`, `/api/admin/*`, `/api/state`, and
    deliberately `GET /api/users/{user}/me`) 404s at the mux. `me` is excluded
    on purpose: an anonymous, client-chosen `{user}` read through the collector
    would be a self-scope bypass (P18) — progress is read only on the
    authenticated portal origin. **Adding a route here widens the participant
    attack surface; it requires an ADR (see ADR-0005 Consequences) and, for a
    destructive route, is forbidden — `reset-dirty` must never be fronted.**

    A request no route matches (the 404 / 405 above) has a per-IP budget of its
    own, the same 1 req/s burst 10 keyed on `RemoteAddr` as submit/exfil but a
    separate bucket: past it the answer is `429` (`{"error": ...}`), so probing
    the wrong URL neither spends nor is spent by the submit budget (app#485).
    This budget covers ONLY those unmatched requests: `/healthz`, `/metrics` and
    the redirect net/http answers for a path it cleans are outside it, so it is
    not a cap on the collector's total request volume.

    `POST /api/users/{user}/display-name` is NOT fronted any more (ADR-0034
    D12, S1). It used to be the third forward, reached by the workspace's
    `setname`; both are removed. A participant now sets display name and
    avatar on the authenticated portal origin (profile route), and a request
    for the old path through the collector 404s like any other unlisted route.

    Header hygiene
    --------------
    Inbound `X-Forwarded-For` / `X-Real-IP` are STRIPPED before forwarding: the
    workspace connects directly (no trusted ingress in front), so those headers
    are attacker-chosen, and the scoreboard's limiter trusts XFF's leftmost
    entry. The collector's own limiter therefore keys on `r.RemoteAddr`.

    EVERY inbound header whose name starts with `X-Auth-Request-` (any case:
    `-Email`, `-User`, `-Preferred-Username`, `-Groups`, and any future one) is
    also STRIPPED, unconditionally, on every forwarded route (ADR-0034 D6).
    Those headers are how auth-policy tells the scoreboard who a request is; a
    workspace sends them directly, so they are forged. Stripping them keeps the
    scoreboard's header-absent branch ("claimed identity", NetworkPolicy-isolated)
    the only way a collector request is seen, and keeps a forged admin email from
    ever being compared against `ADMIN_EMAILS`.

    Per-operation extensions carry the same meaning as in
    docs/openapi-scoreboard.yaml, plus one that is specific to this document:

      x-ctf-forward-target  the scoreboard operation this route forwards to,
                            as "<METHOD> <path>". Set on exactly the operations
                            with `x-ctf-collector-forward: true`. The parity gate
                            asserts a bijection: every target must name a real
                            scoreboard operation carrying
                            `x-ctf-collector-forward: true`, and every such
                            scoreboard operation must be named by exactly one
                            collector operation. That is what turns "the
                            collector fronts exactly two routes" from prose
                            repeated in four files into a checked contract.

    Every `type: string` Schema Object carries `x-ctf-text-origin` (vocabulary
    and meaning: docs/openapi-scoreboard.yaml, ADR-0039).

servers:
  - url: http://collector.collector.svc.cluster.local
    description: in-cluster Service — the only endpoint a locked-down workspace can reach
  - url: http://localhost:8000
    description: local dev (LISTEN_ADDR default)

tags:
  - name: participant
    description: reachable from a ctf-user workspace pod
  - name: infra
    description: probes and metrics (never forwarded)

paths:
  /api/challenges/{cid}/exfil:
    post:
      summary: Exfil drop — deliver a flag over HTTP to the collector
      operationId: exfilDrop
      tags: [participant]
      x-ctf-audience: participant
      x-ctf-authz: claimed-identity
      x-ctf-origin-guard: false
      x-ctf-collector-forward: true
      x-ctf-forward-target: "POST /internal/exfil/{cid}"
      x-ctf-rate-limit: per-IP (RemoteAddr) 1 req/s burst 10
      description: |
        The boss capstone's participant contract (the `curl` target in the
        Mission 10 brief) and the ONLY public face of the exfil path. The
        collector rewrites the path to the scoreboard's
        `POST /internal/exfil/{cid}` and forwards the body UNCHANGED — it never
        parses or validates the payload; the scoreboard owns the receipt.

        This URL is what forces the quiet-exfil lesson: a reverse shell cannot
        reach an HTTP collector, and dropping a custom exfil tool trips
        Drop-and-execute. **The path is participant-visible content — renaming
        it is a coordinated change across this spec, the mission brief and the
        docs site.**

        `{cid}` is checked here against the challenge-id grammar (the `Cid`
        parameter's `pattern`; one definition, ADR-0041) so a crafted path
        cannot be reflected into the upstream URL. Outside the grammar the
        collector answers `404 {"error":"unknown challenge"}` itself and
        forwards nothing; `submit` answers the same way.

        The scoreboard sink is collector-only (`internal-claimed-identity`
        there): the collector adds no `X-Auth-Request-*` header and passes
        `Content-Type` through, so the `Content-Type: application/json` the
        mission brief's `curl` sets is REQUIRED (`415` otherwise), and a
        client-supplied `X-Auth-Request-*` header is refused `403`.
      parameters:
        - $ref: "#/components/parameters/Cid"
      requestBody:
        required: true
        description: forwarded verbatim — see the scoreboard spec's `ExfilRequest`
        content:
          application/json:
            schema:
              type: object
              required: [user, flag]
              properties:
                user:
                  type: string
                  x-ctf-text-origin: token
                  pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
                  maxLength: 63
                flag: { type: string, x-ctf-text-origin: participant-opaque }
      responses:
        "200":
          description: |
            the scoreboard's response, relayed unchanged (see
            docs/openapi-scoreboard.yaml `POST /internal/exfil/{cid}`).
          content:
            application/json: {}
        "400":
          description: "relayed scoreboard 400 (not an exfil challenge, malformed body, missing `user`/`flag`, or `user` not a username slug — the scoreboard checks it and does not echo the input; see `POST /internal/exfil/{cid}`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            `{cid}` is outside the challenge-id grammar: the collector answers
            `{"error":"unknown challenge"}` itself and does not forward (was
            `400 invalid challenge id` before ADR-0041), or a relayed scoreboard
            404 (an id inside the grammar that is not a challenge).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: relayed scoreboard refusal — the request carried an `X-Auth-Request-*` header
          content:
            application/json: {}
        "415":
          description: relayed scoreboard refusal — body is not `application/json`
          content:
            application/json: {}
        "429":
          description: rate limited by the collector
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: |
            upstream forward failed. Fail-closed body — never the Go default 502
            page and never the upstream address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/challenges/{cid}/submit:
    post:
      summary: Flag submission (forward to the scoreboard)
      operationId: forwardSubmit
      tags: [participant]
      x-ctf-audience: participant
      x-ctf-authz: claimed-identity
      x-ctf-origin-guard: false
      x-ctf-collector-forward: true
      x-ctf-forward-target: "POST /api/challenges/{cid}/submit"
      x-ctf-rate-limit: per-IP (RemoteAddr) 1 req/s burst 10
      description: |
        Reverse-proxy of the scoreboard's identically-named route
        (docs/openapi-scoreboard.yaml owns the request/response contract),
        forwarded VERBATIM once `{cid}` is inside the challenge-id grammar (the
        `Cid` parameter's `pattern`). A `{cid}` outside the grammar is answered
        by the collector itself with `404 {"error":"unknown challenge"}` and is
        not forwarded. A `{cid}` inside the grammar is forwarded whether or not
        it names a challenge: the collector holds no catalog, so for an id that
        is not a challenge the 404 is the scoreboard's. The platform's verify
        probe `99-verify-probe` is inside the grammar and not a challenge, so it
        reaches the scoreboard and reads that 404 (ADR-0041). Under
        egress lockdown this is the PRIMARY flag-submission path, which is
        exactly why the scoreboard's copy of this route must stay
        `x-ctf-origin-guard: false`: a workspace `curl` sends no Origin.
      parameters:
        - $ref: "#/components/parameters/Cid"
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        "200":
          description: relayed scoreboard response (`SubmitFlagVerdict`)
          content:
            application/json: {}
        "400":
          description: relayed scoreboard error
          content:
            application/json: {}
        "404":
          description: |
            unknown challenge: the collector's own answer for a `{cid}` outside
            the grammar (not forwarded), or the relayed scoreboard 404 for an id
            inside it that is not a challenge. Both are
            `{"error":"unknown challenge"}`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: rate limited by the collector, or relayed from the scoreboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: relayed scoreboard error
          content:
            application/json: {}
        "502":
          description: upstream forward failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /healthz:
    get:
      summary: Collector liveness (local — never forwarded)
      operationId: collectorHealthz
      tags: [infra]
      x-ctf-audience: infra
      x-ctf-authz: none
      x-ctf-origin-guard: false
      x-ctf-collector-forward: false
      x-ctf-rate-limit: none
      responses:
        "200":
          description: alive
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }

  /metrics:
    get:
      summary: Collector Prometheus exposition (local — never forwarded)
      operationId: collectorMetrics
      tags: [infra]
      x-ctf-audience: infra
      x-ctf-authz: none
      x-ctf-origin-guard: false
      x-ctf-collector-forward: false
      x-ctf-rate-limit: none
      description: |
        Series:
          - `collector_request_duration_seconds{route, method, status}`
              route = the matched ServeMux pattern; an unrouted request records
              the empty pattern, so a spike there means somebody is probing the
              default-deny surface. method = the method the matched route
              declares (plus `HEAD` on a `GET` route), else `other`: the label
              is a closed set, a request's own method is never a label value
              (app#485).
        Plus the default Go runtime metrics.
      responses:
        "200":
          description: Prometheus exposition
          content:
            text/plain: {}

components:
  parameters:
    Cid:
      in: path
      name: cid
      required: true
      schema:
        type: string
        x-ctf-text-origin: token
        pattern: "^[0-9]{2}-[a-z0-9-]{1,60}$"
      description: |
        challenge id (`NN-slug`). In Go the grammar is ONE definition,
        `challengeid.Pattern`; this `pattern` and the scoreboard spec's are held
        equal to it by `internal/apispec/specparity` (identifier_patterns_test).
        The platform holds no copy: that its verify probe id is inside the
        grammar and not a catalog key is held by this repo's tests (ADR-0041
        V2, V3, V5). Shell copies are not yet pinned (app#472). Outside the
        grammar the collector answers 404 and does not forward.

  schemas:
    Error:
      type: object
      description: same contract as the scoreboard's `Error` — non-2xx JSON is always this shape
      required: [error]
      properties:
        error: { type: string, x-ctf-text-origin: operator }
