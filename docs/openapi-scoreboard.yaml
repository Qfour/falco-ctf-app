      x-ctf-audience: operator
      x-ctf-authz: admin
      x-ctf-origin-guard: false
      x-ctf-collector-forward: false
      x-ctf-rate-limit: none
      description: |
        The operator dashboard's data source: the whole field's leaderboard,
        per-challenge solver lists and event counters.

        Admin-only at the app layer as well as at ingress (P18-1): a participant
        must use the self-scoped `/api/users/{user}/{me,journey}` reads. Empty
