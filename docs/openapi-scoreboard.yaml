      x-ctf-audience: operator
      x-ctf-authz: admin
      x-ctf-origin-guard: true
      x-ctf-collector-forward: false
      x-ctf-rate-limit: none
      description: |
        Wipes all solves and the in-memory event / rule-fire counters. Display
        names are preserved. Used to clear a demo run before the real event.

        The most destructive route in this service — it is the origin guard's
