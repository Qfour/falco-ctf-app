        "400":
          description: invalid user or invalid name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: origin guard denied, or caller is not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: could not store the name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

