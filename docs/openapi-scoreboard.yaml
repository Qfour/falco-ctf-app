      x-ctf-collector-forward: false
      x-ctf-rate-limit: none
      description: |
        Which mission hints the operator has released, as
        `{mission: [hintIdx, ...]}`. Deliberately unauthenticated: it carries no
        per-user data and no hint TEXT — only indices — and it replaced a
        client-side timer that could not be coordinated fairly. Distinct
        mechanism from the per-user progressive reveal
        (`POST /api/users/{user}/challenges/{cid}/hints/{idx}`), which is what
        returns text and costs points.
      responses:
        "200":
          description: released hint indices per mission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleasedHints" }

  /api/state:
    get:
      summary: Full-event dashboard JSON (admin only)
