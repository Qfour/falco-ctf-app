            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: origin guard denied, or caller is not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: could not persist the release state
