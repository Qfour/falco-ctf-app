  /api/admin/questions:
    get:
      summary: List every P25 QA ticket, every participant (summary)
      operationId: adminListQuestions
      tags: [operator]
      x-ctf-audience: operator
      x-ctf-authz: admin
      x-ctf-origin-guard: false
      x-ctf-collector-forward: false
      x-ctf-rate-limit: none
      description: |
        ADR-0006 (P25). No `{user}` in this route — it is a standalone admin
        route, not a self-scoped one (Decision 1). Each summary carries
        `user` (unlike the participant listing's summaries, which omit it —
        the caller already knows it is their own).
      responses:
        "200":
          description: ticket summaries across every participant, most-recently-active first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionList" }
        "403":
          description: caller is not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: could not list questions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/admin/questions/{qid}:
    get:
      summary: Read any P25 QA ticket by id (full thread)
      operationId: adminGetQuestion
      tags: [operator]
      x-ctf-audience: operator
      x-ctf-authz: admin
      x-ctf-origin-guard: false
      x-ctf-collector-forward: false
      x-ctf-rate-limit: none
      description: |
        No `{user}` path segment, so no composite-key ownership check
        applies — `admin` alone is the intended gate for this route
        (ADR-0006 Decision 2).
      parameters:
        - $ref: "#/components/parameters/Qid"
      responses:
        "200":
          description: the ticket's full thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionThread" }
        "403":
          description: caller is not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: unknown ticket id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: could not load the ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/admin/questions/{qid}/reply:
    post:
      summary: Reply to a P25 QA ticket as the operator
      operationId: adminReplyQuestion
      tags: [operator]
      x-ctf-audience: operator
      x-ctf-authz: admin
      x-ctf-origin-guard: true
      x-ctf-collector-forward: false
      x-ctf-rate-limit: none
      description: |
        THE only legitimate operator reply path (ADR-0006 Decision 1,
        security-engineer finding 5, LOW). `author_role` is always `admin`
        and `author` is always the caller's OWN proven identity
        (`X-Auth-Request-Email`) — never request-body input. A ticket's
        derived `answered` flips to true only via a message this route
        writes.

        `self-or-admin-write`'s admin branch would technically also let an
        admin identity through the PARTICIPANT follow-up route
        (`POST /api/users/{user}/questions/{qid}/messages`) — this codebase
        does not add a technical block against that misuse (no new gate
        primitive); it is self-detecting instead, since that route
        hardcodes `author_role: participant` unconditionally, so a reply
        posted through it would never contribute to `answered`. Operator
        UI/runbook guidance points exclusively at this route.

        Origin-guarded like the operator dashboard's other admin writes
        (reset / hints / display-name); never rate-limited, matching that
        same trusted-actor precedent.
      parameters:
        - $ref: "#/components/parameters/Qid"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReplyRequest" }
      responses:
        "200":
          description: reply appended; the full, updated thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionThread" }
        "400":
          description: malformed body, or body empty or over the length cap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: origin guard denied, or caller is not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: unknown ticket id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: could not append the reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  parameters:
    User:
      in: path
      name: user
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
      description: |
        auth-derived username slug — the same shape auth-policy enforces on
        `/check?host=`, so the two boundaries agree (conventions I8). A blank
        segment (`/api/users//...`) is answered 400 before routing, never
        silently redirected.
    Cid:
      in: path
      name: cid
      required: true
      schema: { type: string }
      description: challenge id / catalog key (e.g. `03-stealth-read`)
    Qid:
      in: path
      name: qid
      required: true
      schema: { type: string }
      description: |
        P25 QA ticket id (ADR-0006) — a 32-hex-char, server-generated,
        non-enumerable value (`internal/qa.Store`'s newID). Not a
        capability token: participant routes still enforce the composite
        (id, user) ownership check server-side; this value's randomness is
        defense-in-depth on top of that check, not a substitute for it.

  schemas:
    Error:
      type: object
      description: |
        The ONLY body shape for a non-2xx JSON response. `error` is meant to be
        a stable, operator-facing message; the implementation still leaks
        decoder / SQLite driver text on some paths (Issue #113) — that is a
        defect against this schema, not an alternative contract.
      required: [error]
      properties:
        error: { type: string }

    Health:
      type: object
      required: [ok, challenges, db, solved_loaded]
      properties:
        ok: { type: boolean, const: true }
        challenges:
          type: array
          items: { type: string }
          description: catalog ids (sorted)
        db:
          type: string
          description: path to the SQLite file inside the pod
        solved_loaded:
          type: integer
          description: solves loaded from disk at startup

    FalcoEvent:
      type: object
      description: falcosidekick customWebhook payload (the subset we consume)
      required: [rule, output_fields]
      properties:
        rule:
          type: string
          description: Falco rule name (matched against catalog `expectedRules` / `forbiddenRules`)
        priority:
          type: string
          description: |
            Falco priority (e.g. Notice, Warning, Critical). Optional. Events
            explicitly at Debug/Informational/Info are ignored; a
            missing/unknown priority passes through for compatibility.
        time:
          type: string
          format: date-time
          description: |
            Falco-side detection time. Optional; retained as a LOG FIELD only —
            no solve, taint or window decision ever reads it (a forged value
            must not be able to bury a forbidden rule fire).
        output_fields:
          type: object
          description: |
            Arbitrary Falco output fields map. `k8s.ns.name` (must be
            `ctf-<username>`), `k8s.pod.name` (must be `workspace`) and
            `container.image.repository` (must contain `falco-ctf/challenge` or
            `falco-ctf-challenge`) drive the routing filter. Non-matching events
            are answered 200 ignored.
          additionalProperties: {}
          properties:
            k8s.ns.name: { type: string }
            k8s.pod.name: { type: string }
            container.image.repository: { type: string }

    IngestAccepted:
      type: object
      required: [accepted, user, rule]
      properties:
        accepted: { type: boolean, const: true }
        user: { type: string }
        rule: { type: string }

    IngestIgnored:
      type: object
      required: [ignored, reason]
      properties:
        ignored: { type: boolean, const: true }
        reason:
          type: string
          enum:
            - not a ctf workspace event
            - not a challenge container
            - below minimum priority

    SubmitFlagRequest:
      type: object
      required: [user, flag]
      properties:
        user:
          type: string
          description: CLAIMED identity — never proven on this route
        flag: { type: string }

    SubmitFlagVerdict:
      type: object
      description: |
        200 verdict for `POST /api/challenges/{cid}/submit`. Which keys appear
        depends on how far the submission got, so only `correct` is always
        present:

          wrong flag       -> correct=false, reason
          forbidden fired  -> correct=true, evaded=false, reason
          exfil required   -> correct=true, evaded=true, exfiltrated=false, reason
          solved           -> correct=true, evaded=true, solved=true, user,
                              display_name

        `reason` is display prose (currently server-side Japanese copy; the
        ownership of that copy is an open question — Issue #113). Clients MUST
        branch on the booleans only.
      required: [correct]
      properties:
        correct: { type: boolean }
        evaded: { type: boolean }
        exfiltrated: { type: boolean }
        solved: { type: boolean, const: true }
        user: { type: string }
        display_name: { type: string }
        reason: { type: string }

    SubmitDetectRequest:
      type: object
      required: [user, condition]
      properties:
        user: { type: string }
        condition:
          type: string
          description: the Falco condition to grade (<= 4 KiB)

    SubmitDetectVerdict:
      type: object
      description: |
        200 verdict for `POST /api/challenges/{cid}/submit-detect`. `status` is
        the branch key; `user` / `display_name` appear only on `solved`, and the
        fire counts are absent on `invalid` (the condition never compiled).
        `reason` appears on `invalid`/`missed`/`false-positive` but NOT on
        `solved` (the solved branch has nothing to explain).
      required: [status, solved]
      properties:
        status:
          type: string
          enum: [invalid, missed, false-positive, solved]
        solved: { type: boolean }
        evasion_fires: { type: integer }
        benign_fires: { type: integer }
        user: { type: string }
        display_name: { type: string }
        reason: { type: string }

    ExfilRequest:
      type: object
      required: [user, flag]
      properties:
        user: { type: string }
        flag: { type: string }

    ExfilReceipt:
      type: object
      required: [received, user, note]
      properties:
        received: { type: boolean, const: true }
        user: { type: string }
        note:
          type: string
          description: display prose — do not parse

    StepCheckRequest:
      type: object
      required: [checked]
      properties:
        checked: { type: boolean }

    StepCheckResult:
      type: object
      required: [ok, user, cid, idx, checked]
      properties:
        ok: { type: boolean, const: true }
        user: { type: string }
        cid: { type: string }
        idx: { type: integer }
        checked: { type: boolean }

    OpenHintResult:
      type: object
      required: [ok, user, cid, idx, hint, total, newly]
      properties:
        ok: { type: boolean, const: true }
        user: { type: string }
        cid: { type: string }
        idx: { type: integer, description: 1-based }
        hint: { type: string, description: hint copy from journey.yaml }
        total: { type: integer, description: hint count for this mission }
        newly:
          type: boolean
          description: false when the hint was already open (idempotent re-open)

    ResetDirtyResult:
      type: object
      required: [ok, user, cid, dirty]
      properties:
        ok: { type: boolean, const: true }
        user: { type: string }
        cid: { type: string }
        dirty: { type: boolean, const: false }

    DisplayNameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: "1..32 runes after trimming; no <>&\"' and no control characters (UI / shell safety)"

    DisplayNameResult:
      type: object
      required: [ok, user, display_name]
      properties:
        ok: { type: boolean, const: true }
        user: { type: string }
        display_name: { type: string }

    ReleasedHints:
      type: object
      required: [released]
      properties:
        released:
          type: object
          description: mission slug -> released hint indices (1-based, ascending)
          additionalProperties:
            type: array
            items: { type: integer }

    ReleaseHintRequest:
      type: object
      required: [mission, hint, released]
      properties:
        mission:
          type: string
          pattern: "^[0-9]{2}-[a-z0-9-]{1,60}$"
          description: mission directory slug (e.g. `01-initial-recon`)
        hint: { type: integer, minimum: 1, maximum: 20 }
        released: { type: boolean }

    ReleaseHintResult:
      type: object
      required: [ok, mission, hint, released]
      properties:
        ok: { type: boolean, const: true }
        mission: { type: string }
        hint: { type: integer }
        released: { type: boolean }

    AdminResetResult:
      type: object
      required: [ok, cleared_solves]
      properties:
        ok: { type: boolean, const: true }
        cleared_solves: { type: integer }

    RuleFire:
      type: object
      required: [rule, at]
      properties:
        rule: { type: string }
        at:
          type: number
          description: unix seconds as a FLOAT (not RFC3339 — this feed differs from every other `at`)

    SolveEntry:
      type: object
      required: [challenge, at]
      properties:
        challenge: { type: string }
        at: { type: string, format: date-time }

    Me:
      type: object
      description: |
        `GET /api/users/{user}/me`. Self-scoped: `rank`/`score` are the caller's
        OWN row out of a field-wide computation — no other participant's data is
        serialized (P23-ME-1).
      required:
        [user, display_name, solved, solved_count, total_challenges,
         next_unsolved, recent_rule_fires, events, score, rank, hint_penalty, now]
      properties:
        user: { type: string }
        display_name:
          type: string
          description: falls back to `user` when unset
        solved:
          type: array
          description: this user's solves in solve order, filtered to catalog membership
          items: { $ref: "#/components/schemas/SolveEntry" }
        solved_count: { type: integer }
        total_challenges: { type: integer }
        next_unsolved:
          type: string
          nullable: true
          description: |
            next unsolved challenge id by catalog order. **null** when
            everything is solved (the key is always present).
        recent_rule_fires:
          type: array
          description: rule fires for this user in the last 60s, in arrival order
          items: { $ref: "#/components/schemas/RuleFire" }
        events:
          type: integer
          description: total Falco events attributed to this user
        score:
          type: integer
          description: Grader arithmetic (base award per solve minus hint penalties, clamped at 0)
        rank:
          type: integer
          description: 1-based; 0 means "no rank yet" (zero solves) and renders as "-"
        hint_penalty:
          type: integer
          description: |
            representative figure = the cost of revealing HINT1. The portal uses
            the per-mission `Journey.detail.hints.penalty` instead; this field is
            kept for API back-compat.
        now: { type: string, format: date-time }

    MissionSummary:
      type: object
      description: one row of the journey mission map
      required: [id, title, tagline, type, status, hasJourney, bridge, docsUrl]
      properties:
        id: { type: string }
        title:
          type: string
          description: journey.yaml title, falling back to the challenge id
        tagline: { type: string }
        type:
          type: string
          enum: [trigger, evade, detect]
        status:
          type: string
          enum: [solved, current, locked]
          description: |
            guided progression: everything after `current` is locked. Locked
            missions are still readable (free browsing) but their hints and step
            ticks are suppressed.
        hasJourney:
          type: boolean
          description: false = no journey.yaml; the UI shows "ブリーフィング準備中" (fail-soft)
        bridge:
          type: string
          description: narrative teaser toward the next mission, shown in the CLEARED overlay (#47)
        docsUrl:
          type: string
          description: absolutised against the docs origin when one is configured

    Step:
      type: object
      required: [idx, label, detail, checked]
      properties:
        idx: { type: integer, description: 0-based }
        label: { type: string }
        detail: { type: string }
        checked:
          type: boolean
          description: always false for a locked mission (store state is ignored there)

    OpenedHint:
      type: object
      required: [idx, text]
      properties:
        idx: { type: integer, description: 1-based }
        text: { type: string }

    HintsBlock:
      type: object
      description: |
        The ONE fairness-gated part of a mission detail. For a locked mission
        this block reports `lockedCount == total`, `opened == []` and
        `nextIndex == 0` regardless of what the store holds (defensive
        fail-closed — the handler does not trust the UI to hide the reveal
        button).
      required: [total, opened, lockedCount, nextIndex, penalty]
      properties:
        total: { type: integer }
        opened:
          type: array
          items: { $ref: "#/components/schemas/OpenedHint" }
        lockedCount: { type: integer }
        nextIndex:
          type: integer
          description: 1-based index of the next unopened hint; 0 = nothing left to reveal (or locked)
        penalty:
          type: integer
          description: points forfeited by revealing hint `nextIndex` (0 when nextIndex is 0)

    FalcoListItem:
      type: object
      required: [name, items]
      properties:
        name: { type: string }
        items:
          type: array
          items: { type: string }

    FalcoMacroItem:
      type: object
      required: [name, condition]
      properties:
        name: { type: string }
        condition: { type: string }

    FalcoRuleItem:
      type: object
      required: [name, desc, condition, output, priority, tags]
      properties:
        name: { type: string }
        desc: { type: string }
        condition: { type: string }
        output: { type: string }
        priority: { type: string }
        tags:
          type: array
          items: { type: string }

    FalcoRuleExcerpt:
      type: object
      description: |
        Display-only List/Macro/Rule excerpt from
        `challenges/<NN>-<slug>/rule.yaml` (P23 Story-as-docs). Identical for
        every viewer, so it is returned for ANY status. A mission without a
        rule.yaml yields three empty arrays and `hasFalcoRule: false`.
      required: [lists, macros, rules]
      properties:
        lists:
          type: array
          items: { $ref: "#/components/schemas/FalcoListItem" }
        macros:
          type: array
          items: { $ref: "#/components/schemas/FalcoMacroItem" }
        rules:
          type: array
          items: { $ref: "#/components/schemas/FalcoRuleItem" }

    MissionDetail:
      type: object
      description: |
        The selected mission's detail block (`Journey.detail`). Static content
        (brief / steps / Falco rule excerpt) is returned for any status; only
        `hints` — and step tick state — are gated to the unlocked prefix.
      required:
        [id, status, title, tagline, briefing, leadIn, type, docsUrl,
         hasJourney, requireExfil, exfilReceived, expectedRules, detectedRules,
         dirty, dirtyRules, steps, falcoRule, hasFalcoRule, hints]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [solved, current, locked]
        title: { type: string }
        tagline: { type: string }
        briefing: { type: string }
        leadIn:
          type: string
          description: previous mission's `bridge`; empty for the first mission (#47)
        type:
          type: string
          enum: [trigger, evade, detect]
        docsUrl: { type: string }
        hasJourney: { type: boolean }
        requireExfil:
          type: boolean
          description: evade challenge that also requires a collector exfil receipt
        exfilReceived:
          type: boolean
          description: |
            the collector holds ANY receipt for this (user, challenge). Drives
            the auto-solve status card. Never exposes the flag value and has no
            bearing on the verdict (submit re-checks the exact flag).
        expectedRules:
          type: array
          description: |
            trigger missions only (empty array otherwise) — the Falco rules
            whose fire auto-solves this mission. Rule NAMES only, already public
            in the operator view and the docs excerpts.
          items: { type: string }
        detectedRules:
          type: array
          description: |
            expectedRules intersected with this user's rule fires in the last
            60s. UI-display-only live cue; the solve itself is recorded by
            ingest the instant the rule fires, independent of this window.
          items: { type: string }
        dirty:
          type: boolean
          description: |
            `len(dirtyRules) > 0` (ADR-0003 A3). PERSISTENT — no time window;
            only reset-dirty clears it. Always false for trigger/detect.
        dirtyRules:
          type: array
          description: forbidden Falco rule names that tainted this attempt (names only, never a flag)
          items: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/Step" }
        falcoRule: { $ref: "#/components/schemas/FalcoRuleExcerpt" }
        hasFalcoRule:
          type: boolean
          description: false = no rule.yaml authored; the UI omits the panel
        hints: { $ref: "#/components/schemas/HintsBlock" }

    Journey:
      type: object
      description: |
        `GET /api/users/{user}/journey` — the participant portal's main
        projection (polled every 2s). Display-only.
      required: [user, display_name, solved_count, total, current, missions, detail, score, hint_penalty, now]
      properties:
        user: { type: string }
        display_name: { type: string }
        solved_count: { type: integer }
        total:
          type: integer
          description: missions in this run's order (catalog-filtered)
        current:
          type: string
          nullable: true
          description: |
            first unsolved mission id. **null** when every mission is solved
            (the key is always present).
        missions:
          type: array
          items: { $ref: "#/components/schemas/MissionSummary" }
        detail:
          description: |
            detail for `?mission=` when valid, else for `current`. **null** when
            there is no mission to show at all (everything solved and no valid
            override) — the key is always present.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MissionDetail"
        score: { type: integer }
        hint_penalty:
          type: integer
          description: representative HINT1 cost; the per-mission figure is `detail.hints.penalty`
        now: { type: string, format: date-time }

    LeaderboardEntry:
      type: object
      required: [user, display_name, solved, score, earliest, events, rank]
      properties:
        user: { type: string }
        display_name: { type: string }
        solved: { type: integer }
        score:
          type: integer
          description: base award per solve minus hint penalties, clamped at 0
        earliest:
          type: string
          description: RFC3339 first-solve time; the sentinel `"9999"` when solved == 0
        events: { type: integer }
        rank:
          type: integer
          description: |
            1-based, ranked by score desc with earliest first-solve as the
            tiebreak. 0 for participants with no solves (renders "-").

    ChallengeSolver:
      type: object
      required: [user, display_name, at]
      properties:
        user: { type: string }
        display_name: { type: string }
        at: { type: string, format: date-time }

    ChallengeStat:
      type: object
      required: [id, type, expectedRules, forbiddenRules, solved_count, solvers, solver_details, first_solver]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [trigger, evade, detect]
        expectedRules:
          type: array
          items: { type: string }
        forbiddenRules:
          type: array
          items: { type: string }
        solved_count: { type: integer }
        solvers:
          type: array
          description: solver usernames ranked by solve time
          items: { type: string }
        solver_details:
          type: array
          description: solvers ranked by solve time — powers the per-challenge leaderboard
          items: { $ref: "#/components/schemas/ChallengeSolver" }
        first_solver:
          type: string
          nullable: true
          description: first solver's username; **null** when nobody solved it (key always present)

    SolveRecord:
      type: object
      required: [user, display_name, challenge, at]
      properties:
        user: { type: string }
        display_name: { type: string }
        challenge: { type: string }
        at: { type: string, format: date-time }

    State:
      type: object
      description: |
        `GET /api/state` — admin-only, whole-field snapshot. Every solve list is
        filtered to catalog membership so a retired challenge id cannot inflate
        counts ("SOLVED 15/10").
      required: [stats, leaderboard, challenges, recent_solves, solved, events_per_user, now]
      properties:
        stats:
          type: object
          required: [users, challenges, solves, events]
          properties:
            users: { type: integer }
            challenges: { type: integer }
            solves: { type: integer }
            events: { type: integer }
        leaderboard:
          type: array
          items: { $ref: "#/components/schemas/LeaderboardEntry" }
        challenges:
          type: array
          items: { $ref: "#/components/schemas/ChallengeStat" }
        recent_solves:
          type: array
          maxItems: 15
          description: newest first
          items: { $ref: "#/components/schemas/SolveRecord" }
        solved:
          type: array
          description: back-compat — same shape as recent_solves but unbounded
          items: { $ref: "#/components/schemas/SolveRecord" }
        events_per_user:
          type: object
          additionalProperties: { type: integer }
        now: { type: string, format: date-time }

    QuestionMessage:
      type: object
      description: |
        One message in a P25 QA ticket thread (ADR-0006). `author_role` /
        `author` are always server-set per the ROUTE the message was
        written through (`participant`+`{user}` on the participant write
        routes, `admin`+the caller's own proven email on the operator reply
        route) — never accepted from request-body input on any write route.
      required: [author_role, author, body, created_at]
      properties:
        author_role:
          type: string
          enum: [participant, admin]
        author: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }

    QuestionThread:
      type: object
      description: |
        A full P25 QA ticket ("1 ticket = 1 thread", ADR-0006): the opening
        subject plus every message, oldest first. Returned by
        createQuestion, getQuestion, postQuestionMessage, adminGetQuestion
        and adminReplyQuestion alike, so a client can use ONE shape for
        "here is the ticket after my action" everywhere.
      required: [id, user, subject, created_at, messages]
      properties:
        id: { type: string }
        user: { type: string }
        subject: { type: string }
        created_at: { type: string, format: date-time }
        messages:
          type: array
          items: { $ref: "#/components/schemas/QuestionMessage" }

    QuestionSummary:
      type: object
      description: |
        One row of a P25 QA ticket LISTING — never the message bodies.
        `answered` is DERIVED (at least one message has `author_role:
        admin`), not a stored status column (ADR-0006 Decision 1) — it can
        never drift out of sync with the messages that justify it.
      required: [id, subject, created_at, updated_at, answered, message_count]
      properties:
        id: { type: string }
        subject: { type: string }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: the latest message's created_at (or created_at itself, for a ticket with only its opening message)
        answered: { type: boolean }
        message_count: { type: integer }
        user:
          type: string
          description: only present in the ADMIN listing (`GET /api/admin/questions`) — the participant's own listing omits it (the caller already knows it is their own)

    QuestionList:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items: { $ref: "#/components/schemas/QuestionSummary" }

    CreateQuestionRequest:
      type: object
      description: |
        Deliberately has NO `author` / `author_role` property — there is
        nothing here for a participant to smuggle a role claim through
        (security-engineer finding 1, HIGH). Any such keys present in a raw
        request body are silently ignored.
      required: [subject, body]
      properties:
        subject:
          type: string
          description: "1..120 runes after trimming"
        body:
          type: string
          description: "1..4096 bytes after trimming"

    PostQuestionMessageRequest:
      type: object
      description: same "no author/author_role" discipline as CreateQuestionRequest.
      required: [body]
      properties:
        body:
          type: string
          description: "1..4096 bytes after trimming"

    AdminReplyRequest:
      type: object
      description: same "no author/author_role" discipline as CreateQuestionRequest — the operator's own identity comes from X-Auth-Request-Email, never the body.
      required: [body]
      properties:
        body:
          type: string
          description: "1..4096 bytes after trimming"
