openapi: 3.1.0
info:
  title: falco-ctf scoreboard
  version: "2"
  description: |
    The scoreboard binary's COMPLETE HTTP surface (ADR-0005).

    Subject of this document
    ------------------------
    **Every route `cmd/scoreboard`'s mux registers — not "the JSON API".**
    That includes the HTML shells (`GET /`, `GET /portal`), the vendored
    stylesheet, `/healthz` and `/metrics`. Non-JSON routes get a thin entry
    (summary + statuses + audience, no schema); they are here so the
    documented route set can be compared to the registered route set as an
    EXACT SET (ADR-0005 Verification). A spec whose scope is "the API only"
    needs a maintained exclusion list, and the exclusion list is exactly how
    this document decayed to 50% coverage before ADR-0005.

    One spec per service, audience per operation
    --------------------------------------------
    Participant and operator routes live in ONE document because they are
    served by ONE binary off ONE mux, and OpenAPI expresses authorization
    per-operation. Splitting by audience would spread one route set over two
    files, where a route can go missing from both. Read the audience off
    `x-ctf-audience` / `x-ctf-authz` on each operation, never off the URL
    prefix.

    Per-operation extensions (ALL are mandatory on every operation)
    --------------------------------------------------------------
      x-ctf-audience          participant | operator | internal | infra
      x-ctf-authz             none | admin | self-or-admin |
                              self-or-admin-write | claimed-identity
      x-ctf-origin-guard      true | false — whether the route is wrapped by
                              api.Handler.og (internal/scoreboard/originguard,
                              ALLOWED_ORIGINS, P23-2). MUST be stated
                              explicitly; an absent key is a parity failure,
                              not a default of false.
      x-ctf-collector-forward true | false — whether the collector
                              (internal/collector) can reach this route on a
                              participant's behalf. Exactly three routes are
                              true; see docs/openapi-collector.yaml.
      x-ctf-rate-limit        the bucket applied, or "none".

    Why origin-guard is a spec field and not a comment: the guard's presence is
    ASYMMETRIC on purpose (submit / display-name / internal-exfil are excluded
    because the collector forwards them with no browser Origin), and that
    asymmetry is security-relevant in BOTH directions — adding a guard breaks
    flag submission, removing the one on reset-dirty opens an unauthenticated
    cross-user destructive action. OpenAPI has no standard field for CSRF
    middleware, so it is declared here and machine-compared to the code's
    route table (ADR-0005).

    Error contract (ADR-0005 Decision 5)
    ------------------------------------
      * non-2xx  -> `{"error": "<message>"}` (`#/components/schemas/Error`).
        The `error` key NEVER appears in a 2xx body.
      * 200 with a graded verdict (`submit`, `submit-detect`) -> domain outcome
        fields (`correct` / `evaded` / `solved` / `status`) plus `reason`. A
        wrong flag is NOT an HTTP error. `reason` is human-facing prose, is not
        stable, and MUST NOT be parsed by clients — branch on the booleans /
        `status` only.
      * Two former deviations from "non-2xx is JSON" — the rate limiter's 429
        and `GET /portal`'s 500, both previously `http.Error`'s `text/plain`
        — were unified onto `httpx.WriteJSON` (Issue #159 / ADR-0005
        Consequences follow-up F1). Every non-2xx response is now JSON with
        no exceptions.
      * Several 4xx/5xx bodies currently carry `err.Error()` text (decoder /
        SQLite driver strings). That leak is Issue #113, not a contract:
        `Error.error` is specified as a stable operator-facing message and
        #113 is the work to make the implementation match.

    Cross-repo
    ----------
    This contract is load-bearing across **falco-ctf-platform** (falcosidekick
    customWebhook output, helmfile-supplied `ALLOWED_ORIGINS` / `ADMIN_EMAILS`
    / `DETECT_GRADER_*`). Changing a URL, a path parameter, the webhook payload
    keys, or an origin-guard flag requires coordinated PRs on both sides (app
    conventions "Cross-repo 契約" table).

    Generated code
    --------------
    `internal/scoreboard/oapi/types.gen.go` is generated from this file
    (`make gen`, api/cfg-scoreboard.yaml). **Never hand-edit the generated
    file; edit this spec and regenerate.**

servers:
  - url: http://localhost:8000
    description: local dev (docker compose)
  - url: http://scoreboard.scoreboard.svc.cluster.local
    description: in-cluster Service (no auth headers are injected on this path)
  - url: https://app.{dnsSuffix}
    description: |
      single participant+operator origin (P19-2b). oauth2-proxy / auth-policy
      inject `X-Auth-Request-Email` here.
    variables:
      dnsSuffix:
        default: example.invalid

tags:
  - name: participant
    description: reached by the portal shell's browser fetches, or by the collector
  - name: operator
    description: admin-only (ADMIN_EMAILS)
  - name: internal
    description: server-to-server; unreachable from a participant network path
  - name: infra
    description: probes, metrics, static assets, HTML shells

paths:
  /healthz:
    get:
      summary: Liveness + readiness probe
      operationId: healthz
      tags: [infra]
      x-ctf-audience: infra
      x-ctf-authz: none
      x-ctf-origin-guard: false
      x-ctf-collector-forward: false
      x-ctf-rate-limit: none
      responses:
        "200":
          description: process alive, store opened, catalog loaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /metrics:
    get:
      summary: Prometheus metrics exposition
      operationId: metrics
      tags: [infra]
      x-ctf-audience: infra
      x-ctf-authz: none
      x-ctf-origin-guard: false
      x-ctf-collector-forward: false
      x-ctf-rate-limit: none
      description: |
        Standard Prometheus text format, plus the default Go runtime metrics.
        Series (internal/scoreboard/metrics/metrics.go owns the label sets):

          - `scoreboard_ingest_falco_events_received_total{outcome}`
              outcome in {accepted, ignored, decode_error, store_error,
                          taint_error}
              `taint_error` (ADR-0003 A5) = event otherwise accepted but the
              persistent evade-taint write failed; the request 500s.
          - `scoreboard_solves_total{challenge_id, kind}`
              kind in {trigger, evade, detect}
          - `scoreboard_api_submissions_total{challenge_id, outcome}`
              outcome in {solved, wrong_flag, not_evaded, not_exfiltrated,
                          unknown_challenge, not_evade, not_detect,
                          detect_invalid, detect_missed,
                          detect_false_positive, bad_request, rate_limited}
          - `scoreboard_http_request_duration_seconds{route, method, status}`
              route = the Go 1.22 ServeMux pattern that matched.
      responses:
        "200":
          description: Prometheus exposition
          content:
            text/plain: {}

  /:
    get:
      summary: Operator dashboard HTML shell (polls /api/state)
      operationId: dashboard
      tags: [infra, operator]
      x-ctf-audience: operator
      x-ctf-authz: admin
      x-ctf-origin-guard: false
      x-ctf-collector-forward: false
      x-ctf-rate-limit: none
      description: |
        Admin-gated at the app layer as well as at ingress (P18-1
        defense-in-depth): a non-admin identity — including a blank
        `X-Auth-Request-Email`, or any identity when `ADMIN_EMAILS` is empty —
        gets a 403 HTML stub instead of the shell.

        `GET /` in Go 1.22+ matches every unrouted path, so this operation is
        also the 404 for unknown paths.
      responses:
        "200":
          description: dashboard HTML (admin)
          content:
            text/html: {}
        "403":
          description: caller is not an admin (HTML stub, not JSON)
          content:
            text/html: {}
        "404":
          description: served for any path other than "/" (catch-all)
          content:
            text/plain: {}

  /portal:
    get:
      summary: Participant portal shell (Home / Story / Terminal / Me tabs)
      operationId: portal
      tags: [infra, participant]
      x-ctf-audience: participant
      x-ctf-authz: none
      x-ctf-origin-guard: false
      x-ctf-collector-forward: false
      x-ctf-rate-limit: none
      description: |
        Static single-template shell (P23-1). Served to ANY authenticated
        caller and deliberately NOT admin-gated: it embeds no per-user data.
        The admin flag and the derived username are display hints only
        (api.NewAdminGate / api.DeriveUsername); every pane's actual data fetch
        is independently gated in the API handlers, so the shell cannot leak
        another participant's state.

        The Terminal tab's iframe src is built from `PORTAL_TTYD_SUFFIX`;
        empty = a "not configured" placeholder instead of an iframe.
      responses:
        "200":
          description: portal HTML
          content:
            text/html: {}
        "500":
          description: template render failure (JSON Error schema, Issue #159)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /vendor/cybercore.min.css:
    get:
      summary: Vendored cybercore-css stylesheet (self-hosted, never a CDN)
      operationId: vendorCybercoreCSS
      tags: [infra]
      x-ctf-audience: participant
      x-ctf-authz: none
      x-ctf-origin-guard: false
      x-ctf-collector-forward: false
      x-ctf-rate-limit: none
      description: |
        P23-6. Embedded in the binary and served same-origin so the portal
        never fetches a third-party asset (supply chain, P12). Immutable +
        ETag. The path is pinned by internal/scoreboard/view/vendorassets.go
        and linked from the portal template, so renaming it is a template +
        spec change.
      responses:
        "200":
          description: stylesheet
          content:
            text/css: {}
        "304":
          description: If-None-Match matched the embedded ETag

  /falco/events:
    post:
      summary: Receive a falcosidekick event
      operationId: receiveFalcoEvent
      tags: [internal]
      x-ctf-audience: internal
      x-ctf-authz: none
      x-ctf-origin-guard: false
      x-ctf-collector-forward: false
      x-ctf-rate-limit: per-IP 100 req/s burst 200 (falcosidekick batches)
      description: |
        Ingest endpoint. Isolation is NetworkPolicy's job (only falcosidekick
        reaches it); the handler adds no auth but re-checks the event shape.

        Events outside the `ctf-<username>` / `workspace` ns+pod pair, events
        whose `container.image.repository` does not contain the challenge image
        substring, and events explicitly at Debug/Informational/Info are
        answered 200 `{"ignored": true, ...}`.

        For trigger-type challenges a matching rule fire records a solve. The
        visible `at` uses the scoreboard's RECEIPT time, never Falco's `time`
        (buffered events would retro-date the board, and a forged `time` must
        not be able to bury a fire).

        For evade-type challenges a forbidden rule taints the participant's
        CURRENT mission only (ADR-0003 attempt scope) — a persistent flag with
        no time window; `POST /api/users/{user}/challenges/{cid}/reset-dirty`
        is the only way back to clean.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FalcoEvent" }
      responses:
        "200":
          description: event accepted, or ignored by the routing filter
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/IngestAccepted"
                  - $ref: "#/components/schemas/IngestIgnored"
        "400":
          description: malformed JSON body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: rate limited (internal/scoreboard/ratelimit)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: rule-fire persistence failed, or the evade taint write failed (fail-closed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/challenges/{cid}/submit:
    post:
      summary: Submit a flag for an evade-type challenge
      operationId: submitFlag
      tags: [participant]
      x-ctf-audience: participant
      x-ctf-authz: claimed-identity
      x-ctf-origin-guard: false
      x-ctf-collector-forward: true
      x-ctf-rate-limit: per-IP 1 req/s burst 10 (shared with submit-detect)
      description: |
        TWO callers: the portal's browser fetch AND the collector's verbatim
        forward of the participant's `curl` (internal/collector). Identity is
        CLAIMED in the body and never proven — the collector path carries no
        auth header at all.

        NOT origin-guarded, deliberately (`x-ctf-origin-guard: false`): under
        egress lockdown the collector-forwarded curl is the PRIMARY submission
        path and sends no Origin/Referer, so a fail-closed gate here would 403
        every legitimate submission. The CSRF this would mitigate (riding a
        session to credit a flag the attacker chose) has no destructive blast
        radius comparable to `/api/admin/reset`. Accepted residual risk —
        revisit only if submit gains a destructive side effect.
      parameters:
        - $ref: "#/components/parameters/Cid"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitFlagRequest" }
      responses:
        "200":
          description: |
            Submission graded. Branch on `correct` / `evaded` / `exfiltrated` /
            `solved`; `reason` is display prose. Four distinguishable outcomes:
            wrong flag, forbidden rule fired (persistently dirty), exfil still
            required, solved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitFlagVerdict" }
        "400":
          description: "`{cid}` is not an evade challenge, malformed body, or missing `user`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: unknown challenge id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: rate limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: could not record the solve (fail-closed — never a silent empty 200)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/challenges/{cid}/submit-detect:
    post:
      summary: Submit a Falco condition for a detect-type challenge
      operationId: submitDetect
      tags: [participant]
      x-ctf-audience: participant
      x-ctf-authz: self-or-admin-write
      x-ctf-origin-guard: true
      x-ctf-collector-forward: false
      x-ctf-rate-limit: per-IP 1 req/s burst 10 + global in-flight grader cap (5)
      description: |
        Grade a participant-authored Falco `condition:`. It is wrapped into a
        fixed rule and replayed against the mission's evasion + benign
        captures; `pass = fires on evasion AND no fire on benign`. The reference
        condition and the capture contents are NEVER returned — only fire
        counts.

        ONE caller (the portal's Grade button), so the origin guard is safe to
        apply here: the collector does not forward this route. On an
        auth-proxied host the claimed body `user` must be the proven identity
        (or an admin). Past the global in-flight cap the request is REJECTED
        with 429, never queued (a per-submission grader Job is the net-new DoS
        lever). With no runner configured the route answers 503 (feature off),
        not 404/500.
      parameters:
        - $ref: "#/components/parameters/Cid"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitDetectRequest" }
      responses:
        "200":
          description: graded — branch on `status`, use the fire counts as feedback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitDetectVerdict" }
        "400":
          description: not a detect challenge, missing/invalid `user`, missing `condition`, or condition too large
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: origin guard denied, or caller is neither `{user}` nor an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: unknown challenge id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: |
            per-IP rate limit OR the global in-flight grader cap — two
            different writers (internal/scoreboard/ratelimit and this
            handler), both JSON since Issue #159 unified ratelimit onto
            httpx.WriteJSON.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: grader infra error (fail-closed — never a silent solve)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: detect grading is not enabled (no runner wired)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /internal/exfil/{cid}:
    post:
      summary: Record a collector exfil receipt (collector-only sink)
      operationId: recordExfil
      tags: [internal]
      x-ctf-audience: internal
      x-ctf-authz: claimed-identity
      x-ctf-origin-guard: false
      x-ctf-collector-forward: true
      x-ctf-rate-limit: none (the limit lives on the collector front)
      description: |
        **Not participant-reachable.** The participant-facing contract is
        `POST /api/challenges/{cid}/exfil` on the COLLECTOR
        (docs/openapi-collector.yaml), which rewrites the path to this sink and
        forwards the body unchanged. Isolation is NetworkPolicy (scoreboard
        ingress admits the collector, not ctf-user); this handler adds no auth
        of its own and identity is claimed.

        Documented here — rather than omitted to avoid being mistaken for a
        participant entry point — because it is a two-service contract, and
        because an undocumented route forces the parity gate to carry an
        exclusion list (ADR-0005 rejects exclusion lists: they are how this
        document decayed). Audience is carried by `x-ctf-audience: internal`,
        not by hoping readers infer it from the path.

        Recording a wrong value is harmless: the flag is matched at submit time
        (`RequireExfil` via `HasExfil`), so a bad receipt simply fails the
        eventual submit.
      parameters:
        - $ref: "#/components/parameters/Cid"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExfilRequest" }
      responses:
        "200":
          description: receipt recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExfilReceipt" }
        "400":
          description: "`{cid}` does not accept exfil, malformed body, or missing `user`/`flag`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: unknown challenge id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: could not record the receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/users/{user}/me:
    get:
      summary: Participant self-service progress projection
      operationId: getUserMe
      tags: [participant]
      x-ctf-audience: participant
      x-ctf-authz: self-or-admin
      x-ctf-origin-guard: false
      x-ctf-collector-forward: false
      x-ctf-rate-limit: none
      description: |
        Self-scoped read (P18): the caller may only read their OWN progress.
        Identity comes from `X-Auth-Request-Email`; a missing or blank header is
        DENIED (403, fail-closed) — the `{user}` path parameter is never trusted
        on its own. Admins (`ADMIN_EMAILS`) may read any user.

        `rank` / `score` are computed over the WHOLE field
        (`computeLeaderboard`) but only the caller's own row is serialized
        (P23-ME-1, CEO decision 案① 完全プライベート). No other participant's
        rank, score or name appears in this response.

        Not fronted by the collector (an anonymous client-chosen `{user}` read
        through the collector would be a self-scope bypass), which is why the
        collector's mux default-denies it -> 404 there.
      parameters:
        - $ref: "#/components/parameters/User"
      responses:
        "200":
          description: the caller's own progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400":
          description: invalid `{user}` slug (or a blank segment — `/api/users//me`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: no proven identity, or caller is neither `{user}` nor an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/users/{user}/journey:
    get:
      summary: Participant mission-progression projection (the portal's main view)
      operationId: getUserJourney
      tags: [participant]
      x-ctf-audience: participant
      x-ctf-authz: self-or-admin
      x-ctf-origin-guard: false
      x-ctf-collector-forward: false
      x-ctf-rate-limit: none
      description: |
        The portal's Story pane polls this every 2s. Returns the ordered mission
        map (solved / current / locked) plus ONE mission's `detail` block.
        Display-only: nothing here decides a solve (trigger challenges
        auto-solve via Falco ingest; evade solves come from submit).

        `current` = the first unsolved mission in the progression order,
        resolved by `scoring.CurrentMission` — the SAME function the Grader's
        attempt-scope taint gate uses (ADR-0003 A1: one definition of
        "current").

        Free mission browsing (CEO decision, P23 Story-as-docs): `?mission=`
        selects ANY mission present in `missions[]` — solved, current or
        locked — because brief / steps / Falco rule excerpt are static content
        identical for every viewer. An unknown value falls back to `current`
        rather than erroring (display convenience, not a contract clients may
        depend on). The ONE thing gated to the unlocked prefix is hints: for a
        locked mission the handler reports `lockedCount == total`, an empty
        `opened`, `nextIndex == 0` and ignores the store's opened set entirely;
        step tick state is likewise suppressed.

        Authorization is identical to `/api/users/{user}/me` (self-or-admin,
        fail-closed on a missing header).
      parameters:
        - $ref: "#/components/parameters/User"
        - in: query
          name: mission
          required: false
          schema: { type: string }
          description: |
            mission id whose `detail` to return instead of `current`. Any id in
            `missions[]` is valid; unknown/blank values fall back to `current`.
      responses:
        "200":
          description: the caller's own journey projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journey" }
        "400":
          description: invalid `{user}` slug
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: no proven identity, or caller is neither `{user}` nor an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/users/{user}/challenges/{cid}/steps/{idx}/check:
    post:
      summary: Tick or clear one journey step (self-check)
      operationId: setStepCheck
      tags: [participant]
      x-ctf-audience: participant
      x-ctf-authz: self-or-admin-write
      x-ctf-origin-guard: true
      x-ctf-collector-forward: false
      x-ctf-rate-limit: per-IP 1 req/s burst 10
      description: |
        Purely presentational: journey `steps` are an info-only checklist with
        no auto-detection, so a tick never affects a solve verdict — it lets a
        participant track progress across reloads.

        Origin-guarded: reached ONLY from the portal's browser fetch and NOT in
        the collector's forward allowlist, so there is no server-to-server
        caller a fail-closed gate would break.
      parameters:
        - $ref: "#/components/parameters/User"
        - $ref: "#/components/parameters/Cid"
        - in: path
          name: idx
          required: true
          schema: { type: integer, minimum: 0 }
          description: 0-based step index, bounded by the mission's step count
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepCheckRequest" }
      responses:
        "200":
          description: state recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepCheckResult" }
        "400":
          description: invalid user, malformed body, or step index out of range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: origin guard denied, or caller is neither `{user}` nor an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: unknown challenge id, or no journey content for it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: rate limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: could not record the step check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/users/{user}/challenges/{cid}/hints/{idx}:
    post:
      summary: Reveal one progressive hint (in order, idempotent)
      operationId: openHint
      tags: [participant]
      x-ctf-audience: participant
      x-ctf-authz: self-or-admin-write
      x-ctf-origin-guard: true
      x-ctf-collector-forward: false
      x-ctf-rate-limit: per-IP 1 req/s burst 10
      description: |
        Hints open in order: opening `idx` N requires N-1 already open (409
        otherwise), so participants approach the answer progressively instead of
        jumping to the last hint. Idempotent — re-opening returns the text again
        with `newly: false`.

        Revealing costs points (the per-index schedule lives in the scoring
        layer; `Journey.detail.hints.penalty` prices the NEXT reveal). Hint copy
        comes from `journey.yaml` and by convention carries no flag values
        (conventions I10).

        Origin-guarded for the same reason as steps/check, plus a second one:
        the 409/200 distinction is a cross-user oracle if an unauthenticated
        caller can drive it.
      parameters:
        - $ref: "#/components/parameters/User"
        - $ref: "#/components/parameters/Cid"
        - in: path
          name: idx
          required: true
          schema: { type: integer, minimum: 1 }
          description: 1-based hint index, bounded by the mission's hint count
      responses:
        "200":
          description: hint revealed (or already open)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenHintResult" }
        "400":
          description: invalid user or hint index out of range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: origin guard denied, or caller is neither `{user}` nor an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: unknown challenge id, or the mission has no hints
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: previous hint not open yet (in-order reveal)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: rate limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: could not record the hint view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/users/{user}/challenges/{cid}/reset-dirty:
    post:
      summary: Clear the persistent evade forbidden-rule taint for one (user, challenge) pair
      operationId: resetDirty
      tags: [participant]
      x-ctf-audience: participant
      x-ctf-authz: self-or-admin-write
      x-ctf-origin-guard: true
      x-ctf-collector-forward: false
      x-ctf-rate-limit: per-IP 1 req/s burst 10
      description: |
        The ONLY way an evade challenge returns to clean once a forbidden Falco
        rule fired while it was the participant's current mission (ADR-0003
        attempt scope) — there is no time-based path; waiting never clears it.
        Restarts the WHOLE attempt: also deletes the SAME pair's collector exfil
        receipt (ADR-0003 A2-2, CEO enforce decision 2026-08-18), so "fire a
        forbidden rule -> reset -> auto-solve off the stale receipt" is not a
        shortcut back to solved.

        Idempotent (resetting a clean pair is a no-op). Rejects a non-evade
        challenge, because a taint can only ever exist for an evade one.

        **Do not remove the origin guard from this route and do not add it to
        the collector's forward allowlist.** A2-2 made this endpoint able to
        delete another participant's exfil receipt, and the header-less
        claimed-identity fallback in the write gate carries no proof the caller
        IS `{user}`. The guard 403s exactly the shape a header-less
        cluster-internal caller sends, BEFORE the self-or-admin check runs —
        that is what keeps A2-2's destructive reset from becoming an
        unauthenticated cross-user action (app#124 5x, R1 C3).

        Reachability consequence for participant copy: a workspace `curl` of
        this path CANNOT work. Participant-facing text must point at the
        portal's "このミッションをやり直す" button, never at this URL (app#125).
      parameters:
        - $ref: "#/components/parameters/User"
        - $ref: "#/components/parameters/Cid"
      responses:
        "200":
          description: taint (and exfil receipt, if any) cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetDirtyResult" }
        "400":
          description: invalid user, or `{cid}` is not an evade challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: origin guard denied, or caller is neither `{user}` nor an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: unknown challenge id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: rate limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: could not reset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/users/{user}/display-name:
    post:
      summary: Set the caller's own scoreboard display name
      operationId: setDisplayName
      tags: [participant]
      x-ctf-audience: participant
      x-ctf-authz: self-or-admin-write
      x-ctf-origin-guard: false
      x-ctf-collector-forward: true
      x-ctf-rate-limit: per-IP 1 req / 5s burst 5
      description: |
        Cosmetic only — identity stays anchored to the auth-derived slug.
        Upsert; re-runnable.

        NOT origin-guarded (`x-ctf-origin-guard: false`) because its ONLY caller
        is the collector's verbatim forward of the participant's `curl` (no
        browser template in this repo fetches this path; the portal's rename
        button uses the ADMIN route). A fail-closed gate here would 403 every
        legitimate call while protecting no browser-CSRF surface.

        Dual-path authorization keyed off the PRESENCE of
        `X-Auth-Request-Email`: header present (auth-proxied host) -> full
        self-or-admin; header absent (cluster-internal / collector) -> legacy
        claimed-identity model, where NetworkPolicy is the isolation control.
      parameters:
        - $ref: "#/components/parameters/User"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisplayNameRequest" }
      responses:
        "200":
          description: name set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisplayNameResult" }
        "400":
          description: invalid user, or invalid name (empty, >32 runes, or forbidden characters)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: caller is neither `{user}` nor an admin (auth-proxied host only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: rate limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: could not store the name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/users/{user}/questions:
    get:
      summary: List the caller's own P25 QA tickets (summary)
      operationId: listQuestions
      tags: [participant]
      x-ctf-audience: participant
      x-ctf-authz: self-or-admin
      x-ctf-origin-guard: false
      x-ctf-collector-forward: false
      x-ctf-rate-limit: none
      description: |
        ADR-0006 (P25): one-way participant -> operator QA ticket chat. "1
        ticket = 1 thread" — a participant may open several tickets; each is
        listed here as a summary (never the message bodies). Self-scoped
        read, same posture as `/me` / `/journey`; an admin may read any
        user's list.
      parameters:
        - $ref: "#/components/parameters/User"
      responses:
        "200":
          description: ticket summaries, most-recently-active first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionList" }
        "400":
          description: invalid user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: caller is neither `{user}` nor an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: could not list questions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      summary: Open a new P25 QA ticket
      operationId: createQuestion
      tags: [participant]
      x-ctf-audience: participant
      x-ctf-authz: self-or-admin-write
      x-ctf-origin-guard: true
      x-ctf-collector-forward: false
      x-ctf-rate-limit: per-IP 1 req/10s burst 3 (shared with postQuestionMessage)
      description: |
        ADR-0006 (P25). `author` / `author_role` are ALWAYS server-set
        (`participant` / `{user}`) — the request schema below has no such
        fields at all, so there is nothing for a participant to smuggle a
        role claim through; any such keys in a raw request body are
        silently ignored (security-engineer finding 1, HIGH).

        Origin-guarded + self-or-admin-write, the SAME two-gate stack
        `steps/{idx}/check` and `hints/{idx}` use above: reached ONLY from
        the portal's browser fetch. NOT added to the collector's forward
        allowlist (`docs/openapi-collector.yaml`) — a participant's QA send
        has no legitimate workspace/curl caller, so adding one would only
        widen the attack surface (ADR-0006 explicitly declines this).
      parameters:
        - $ref: "#/components/parameters/User"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateQuestionRequest" }
      responses:
        "200":
          description: ticket created (its one message is the participant's own opening body)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionThread" }
        "400":
          description: invalid user, malformed body, or subject/body empty or over the length cap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: origin guard denied, or caller is neither `{user}` nor an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: rate limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: could not create the ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/users/{user}/questions/{qid}:
    get:
      summary: Read one of the caller's own P25 QA tickets (full thread)
      operationId: getQuestion
      tags: [participant]
      x-ctf-audience: participant
      x-ctf-authz: self-or-admin
      x-ctf-origin-guard: false
      x-ctf-collector-forward: false
      x-ctf-rate-limit: none
      description: |
        ADR-0006 Decision 2: the composite (id,user) ownership check happens
        inside the store call this handler makes, under one lock hold —
        `self-or-admin` only proves the caller MAY act as `{user}`, it says
        nothing about whether `{qid}` belongs to `{user}`. An unknown id and
        a cross-user id both produce the SAME 404 (no existence oracle for
        another participant's ticket).
      parameters:
        - $ref: "#/components/parameters/User"
        - $ref: "#/components/parameters/Qid"
      responses:
        "200":
          description: the ticket's full thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionThread" }
        "400":
          description: invalid user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: caller is neither `{user}` nor an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: unknown ticket id, or it does not belong to `{user}`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: could not load the ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/users/{user}/questions/{qid}/messages:
    post:
      summary: Post a follow-up message on the caller's own P25 QA ticket
      operationId: postQuestionMessage
      tags: [participant]
      x-ctf-audience: participant
      x-ctf-authz: self-or-admin-write
      x-ctf-origin-guard: true
      x-ctf-collector-forward: false
      x-ctf-rate-limit: per-IP 1 req/10s burst 3 (shared with createQuestion)
      description: |
        Same origin-guard + self-or-admin-write + shared rate-limit bucket as
        `POST /api/users/{user}/questions`. `author` / `author_role` are
        ALWAYS server-set (`participant` / `{user}`) — never read from the
        request body.

        IDOR discipline (ADR-0006 Decision 2 / security-engineer finding 4):
        the composite-key ownership check and the message insert happen
        inside ONE store call, under one lock hold — never a separate
        "check ownership" round trip followed by a separate "now write"
        round trip. A cross-user `{qid}` (one that exists but belongs to a
        DIFFERENT participant) 404s exactly like an unknown one.
      parameters:
        - $ref: "#/components/parameters/User"
        - $ref: "#/components/parameters/Qid"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostQuestionMessageRequest" }
      responses:
        "200":
          description: message appended; the full, updated thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionThread" }
        "400":
          description: invalid user, malformed body, or body empty or over the length cap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: origin guard denied, or caller is neither `{user}` nor an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: unknown ticket id, or it does not belong to `{user}`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: rate limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: could not append the message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/hints:
