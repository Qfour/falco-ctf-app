# 両リポ共通のラベル分類 (falco-ctf-app / falco-ctf-platform)。
# これは「定義ファイル」であり、この YAML を置くだけでは GitHub 側にラベルは作られない。
# 実作成 (label sync) は CEO 承認のうえ別途行う (例: gh label create / github-label-sync)。
#
# 分類軸:
#   type:*     — 変更の種別。release.yml のリリースノート分類キーと一致させること。
#   area:*     — 影響領域。triage で手動付与する参照軸 (Issue Form の dropdown はラベルを自動付与しない)。
#   priority:* — トリアージ優先度。
#   status:*   — ワークフロー状態。Issue Forms は起票時に status:triage を付与。

# ---- type: 変更種別 (release.yml のカテゴリと 1:1) --------------------------
- name: "type:feature"
  color: "1d76db"
  description: "新機能・機能追加"
- name: "type:bug"
  color: "d73a4a"
  description: "バグ・想定外挙動の修正"
- name: "type:ux"
  color: "fbca04"
  description: "体験・操作性・見た目の改善"
- name: "type:security"
  color: "b60205"
  description: "セキュリティ修正・強化"
- name: "type:docs"
  color: "0075ca"
  description: "ドキュメント・runbook のみの変更"
- name: "type:infra"
  color: "5319e7"
  description: "基盤・CI・ビルドの変更"

# ---- area: 影響領域 (triage で手動付与する参照軸; Issue Form の dropdown はラベルを自動付与しない) ----
- name: "area:scoreboard"
  color: "1d76db"
  description: "scoreboard サービス / 採点ロジック"
- name: "area:auth-policy"
  color: "1d76db"
  description: "auth-policy サービス / 認証境界"
- name: "area:journey-ui"
  color: "1d76db"
  description: "Journey 進行 UI"
- name: "area:challenges"
  color: "1d76db"
  description: "challenges/ コンテンツ・falco-rule"
- name: "area:deploy"
  color: "1d76db"
  description: "charts / helm / デプロイ"
- name: "area:docs-site"
  color: "1d76db"
  description: "docs-site / MkDocs ミッションページ"

# ---- priority: トリアージ優先度 --------------------------------------------
- name: "priority:P0"
  color: "b60205"
  description: "P0 — 即対応 (イベント阻害)"
- name: "priority:P1"
  color: "d93f0b"
  description: "P1 — 次リリースで対応"
- name: "priority:P2"
  color: "fbca04"
  description: "P2 — 計画的に対応"
- name: "priority:P3"
  color: "c2e0c6"
  description: "P3 — nice to have / いつか"

# ---- status: ワークフロー状態 ----------------------------------------------
- name: "status:triage"
  color: "ededed"
  description: "未仕分け (受付直後)"
- name: "status:accepted"
  color: "0e8a16"
  description: "採用・対応予定"
- name: "status:in-progress"
  color: "fbca04"
  description: "対応中"
- name: "status:blocked"
  color: "d73a4a"
  description: "ブロック中"

# ---- release.yml exclude 用 (両リポ共通) -----------------------------------
- name: "skip-changelog"
  color: "ededed"
  description: "リリースノート/CHANGELOG から除外"
- name: "dependencies"
  color: "0366d6"
  description: "依存更新 (Dependabot 等)"
