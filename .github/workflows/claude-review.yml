name: Claude Code Review

# サプライチェーン pin ポリシー (P12) — 正典: .claude/rules/falco-ctf-app-conventions.md
#   actions/checkout@v7 と anthropics/claude-code-action@v1 は @vN メジャータグの
#   許容例外 (信頼済み提供元 + Dependabot 運用)。conventions の例外表を参照。

on:
  pull_request:
    types: [opened, synchronize]

# G5-1: PR 連打で古いレビュー run を止める。この workflow は PR 専用のため
# cancel-in-progress を無条件 true にできる (release/build を守る必要がない)。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # #130: ANTHROPIC_API_KEY 未設定だとレビュー内容と無関係に毎 PR 赤くなり signal
    # integrity を損なう (本物の赤と区別不能に)。key があれば動き、無ければ下記 step を
    # skip して job を green にする。fail-open ではない — レビューの有無は /review-5x +
    # Lead レビューで別途 gate 済み。key 登録 (課金) や workflow 削除は CEO 判断 (選択肢 1/2)。
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Claude review (skipped when ANTHROPIC_API_KEY is not configured — #130)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request against the repo's conventions in CLAUDE.md,
            AGENTS.md, and .claude/rules/. Focus on: the Hard Invariants
            (scoreboard replicas=1, UID 65532, image tag != latest, placeholder
            chart defaults, auth-policy prefix-exact email match), no real flags
            or secrets committed, and cross-repo contract drift. Post inline
            comments on issues.
          claude_args: "--max-turns 6"
