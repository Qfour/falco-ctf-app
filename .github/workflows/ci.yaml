name: CI

# サプライチェーン pin ポリシー (P12) — 正典: .claude/rules/falco-ctf-app-conventions.md
#   - reusable workflow `@main` は禁止 → commit SHA pin (下記 uses: の @<sha> # main as of ...)
#   - サードパーティ action の `@vN` メジャータグは許容例外 (信頼済み提供元 + Dependabot 運用)。
#     例外リスト: actions/checkout@v7 / azure/setup-helm@v5 /
#     aws-actions/configure-aws-credentials@v6 / anthropics/claude-code-action@v1
#     (claude-review.yml)。これ以外を足すときは SHA pin するか conventions の例外表に追記。

# Trigger は main への push と PR のみ (Issue #37)。
#   v* タグ push は「GitHub Release 生成」だけが反応すべき事象で、image build/publish
#   を伴わない (CI-free prod 恒久方針: images=手動 build/push, charts=local clone)。
#   タグに CI を発火させると 7-image build+scan matrix + lint 群が無駄に走り、publish は
#   どのみち ECR_REGISTRY placeholder で skip される。build/scan の網羅は main push + PR で維持。
#   Release ノートの分類は .github/release.yml (gh release create --generate-notes が消費) が担う。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# G5-1: PR 連打での重複起動を止める (7-image build のコスト削減)。
# cancel-in-progress は PR run のみ true。main push / v* タグの run は
# release/build (image push・chart publish) を守るため途中キャンセルしない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ------------------------------------------------------------------
  # Go test (go vet + go test ./...)
  # Branch protection check: "test"
  # ------------------------------------------------------------------
  test:
    uses: Qfour/homelab-workflows/.github/workflows/go-test.yaml@10583360d619601e225803d236a00d0fa014b1f8 # main as of 2026-05-12
    with:
      dockerfile: Dockerfile.test

  # ------------------------------------------------------------------
  # Helm chart lint + template (replaces the old kustomize-lint).
  # Branch protection check: "chart-lint"
  # NOTE: update branch protection — remove required "lint-kustomize",
  # add required "chart-lint".
  # ------------------------------------------------------------------
  chart-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: helm lint + template all charts
        run: |
          set -euo pipefail
          for c in charts/*; do
            echo "== $c =="
            helm lint "$c"
            helm template "$c" >/dev/null
          done
      - name: seccomp Hard Invariant (fail-closed)
        run: python3 scripts/check-seccomp.py
      - name: flag isolation Hard Invariant (ADR-0001 Verification 1, fail-closed)
        run: ./scripts/check-flag-isolation.sh

  # ------------------------------------------------------------------
  # Flag hygiene: no real flags in the public repo + generated values in sync.
  # Branch protection check: "flag-guard"
  # ------------------------------------------------------------------
  flag-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check flags & generated values
        run: ./scripts/check-flags.sh

  # ------------------------------------------------------------------
  # Shell hygiene: shellcheck (-S warning) over every shell script in the repo.
  #
  # G5-3: local reusable workflow (./.github/workflows/shellcheck.yaml) を呼ぶ caller。
  # plant.sh の 2-pass (challenges/<id>/plant.sh は -s sh、それ以外は shebang 準拠) は
  # reusable 側で plant-sh-mode=true として実装。閾値 -S warning・`sort -z | xargs -0 -r`
  # も reusable に保存。同一リポ参照ゆえ相対パス (SHA pin 不要)。
  #
  # 必須チェック context 名の移行 (footgun):
  #   旧 required "shellcheck" は reusable 化で "shellcheck / shellcheck" に変わる
  #   (caller job id "shellcheck" / reusable job id "shellcheck")。merge 後に CEO が
  #   branch protection の required 集合から旧 "shellcheck" を外し "shellcheck / shellcheck"
  #   を追加する (setup-rulesets.sh の app CHECKS も同名に更新)。それまで旧名を required の
  #   ままにすると PR が永久 pending になる。
  # ------------------------------------------------------------------
  shellcheck:
    uses: ./.github/workflows/shellcheck.yaml
    with:
      plant-sh-mode: true

  # ------------------------------------------------------------------
  # Challenge rule eval: every expected/forbidden rule exists in the Falco
  # ruleset (typo'd names silently never fire).
  # Branch protection check: "challenge-rules"
  # ------------------------------------------------------------------
  challenge-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check challenge rule names
        run: ./scripts/check-challenge-rules.sh

  # ------------------------------------------------------------------
  # Image pipeline (build → scan → push) per service
  # Branch protection checks: "build (scoreboard)", "build (auth-policy)", etc.
  # Push: main branch only (v* タグは CI 非トリガ — Issue #37)。PRs run build+scan only.
  #
  # Publish gating (CI-free prod, 2026-06-15 決定): image push / chart publish
  # は vars.ECR_REGISTRY が実値のときのみ実行 (未設定 or PLACEHOLDER = skip)。
  # prod は charts=local clone / images=手動 build+push で運用中。
  # publish を復活させる手順:
  #   1. GitHub repo vars: ECR_REGISTRY=<account>.dkr.ecr.<region>.amazonaws.com,
  #      AWS_REGION=<region>
  #   2. GitHub repo secret: AWS_ROLE_ARN (GitHub OIDC trust を持つ IAM role)
  #   3. AWS 側: OIDC identity provider + ECR push 権限の role を作成
  # 注意: 再利用 workflow は `falco-ctf-<name>` (ハイフン) に push するが、platform
  # helmfile は `falco-ctf/<name>` (スラッシュ) を期待。復活時は naming を両リポ同時 PR で整合させること。
  #
  # Dependabot PR と secrets (Issue #168):
  #   GitHub の仕様上、actor が `dependabot[bot]` の workflow run には repository
  #   secrets (`SYSDIG_SECURE_TOKEN` 含む) が渡らない (依存性 PR からの secrets 窃取を
  #   防ぐ既定の保護。トグルでは解除しない — 空にした場合、compromised な依存の
  #   `go build`/`docker build` から token を盗める経路になり、CVE ゲートより重い
  #   supply-chain リスクを新設するため)。結果、scan ステップは
  #   "Sysdig Secure Token is required..." で毎回落ち、`build (scoreboard)/scan` と
  #   `build (auth-policy)/scan` (必須チェック) を Dependabot PR が構造的に pass
  #   できない。
  #
  #   対処: reusable workflow (image-pipeline.yaml) が既に持つ
  #   `scan-continue-on-error` input を、actor が `dependabot[bot]` のときだけ
  #   true に強制する (下記 `with:` 参照)。これはジョブ単位の continue-on-error
  #   なので、scan ステップ自体は変わらず実行を試みる (token が無い run では
  #   相変わらず落ちるが non-blocking になる) — required check を required 集合
  #   から外す・常時 pass にする、のどちらでもない。他 actor (通常の human PR) の
  #   挙動はビット単位で不変 (matrix の `scan-continue-on-error: false` のまま)。
  #   secrets 抑止は job 単位ではなく actor 単位で GitHub が行うため、この一律
  #   適用は scoreboard/auth-policy (必須チェック) だけでなく matrix の全 8 image
  #   (ttyd/collector/challenge/docs/detect-grader/ttyd-proxy 含む) に及ぶ —
  #   これらも元々同じ理由で token 無しで落ちるはずだった対象であり、範囲の
  #   拡大ではない。
  #
  #   実効的な CVE ゲートは 2 段: (1) は **detective** (post-merge alert)、
  #   (2) が唯一の **preventive** ゲート:
  #     1. merge 後の `push: branches: [main]` トリガで同じ build job が
  #        secrets 付きで再実行され、実スキャンが走る (このワークフロー内で
  #        既に成立している経路 — 新設ではない)。ただしこの時点で merge は
  #        既に完了しているため、ここでの scan 失敗は当該 commit が main に
  #        載ることを止められない (detective のみ)
  #     2. dev-flow.md の既定どおり `make scan TAG=local` が prod deploy 前の
  #        **唯一の preventive ゲート** (CI-free prod 方針。CI scan は「安全網」
  #        と明記済み)
  #   残余リスク: merge 直後〜(1) 完了までの短い窓で、未スキャンの commit が
  #   main に載る。security-engineer レビュー済み (2026-08-21, PASS with
  #   conditions)。
  #
  #   **恒久対応として承認 (VP, 2026-08-21)**: この緩和は Dependabot secrets
  #   抑止という GitHub 側の構造的仕様への対処であり、期限付きの暫定バイパスでは
  #   ない。解除条件: (a) GitHub が Dependabot secrets 供給の仕様を変更した場合、
  #   または (b) "Allow GitHub Actions to request secrets from Dependabot" の
  #   有効化判断が別途下された場合 (却下済み、再検討する場合は新規 ADR/Issue で)。
  #   いずれかが発生したら本ブロックを見直すこと。
  # ------------------------------------------------------------------
  build:
    name: build (${{ matrix.name }})
    permissions:
      contents: read
      security-events: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: scoreboard
            context: .
            dockerfile: scoreboard/Dockerfile
            scan-continue-on-error: false
          - name: auth-policy
            context: .
            dockerfile: auth-policy/Dockerfile
            scan-continue-on-error: false
          - name: collector
            context: .
            dockerfile: collector/Dockerfile
            scan-continue-on-error: false
          - name: ttyd
            context: images/ttyd
            dockerfile: images/ttyd/Dockerfile
            scan-continue-on-error: false
          # 8th image (I5, extended for P23-3): CSP frame-ancestors reverse
          # proxy in front of ttyd (clickjacking mitigation for the P23
          # unified portal). Go build, context = repo root (shares
          # internal/serverutil like collector). build (ttyd-proxy)/scan
          # run in CI like every other per-image job, but — per the live
          # branch-protection required-check set (chart-lint, flag-guard,
          # test/go-test, challenge-rules, build (scoreboard)/scan, build
          # (auth-policy)/scan) — per-image builds other than
          # scoreboard/auth-policy are NOT required (ttyd/collector/
          # challenge/docs/detect-grader aren't either). Making it required
          # is optional hardening the CEO could add later via a ruleset
          # update; it is not needed for this PR to merge.
          - name: ttyd-proxy
            context: .
            dockerfile: images/ttyd-proxy/Dockerfile
            scan-continue-on-error: false
          - name: challenge
            context: .
            dockerfile: images/challenge/Dockerfile
            scan-continue-on-error: false
          - name: docs
            context: .
            dockerfile: images/docs/Dockerfile
            scan-continue-on-error: false
          # 7th image (I5): falco + capture-replay grader for `type: detect`.
          # build (detect-grader)/scan runs in CI but, like the other
          # non-scoreboard/auth-policy per-image jobs, is not in the live
          # branch-protection required-check set (see the ttyd-proxy job's
          # comment above for the actual required-check set).
          - name: detect-grader
            context: images/detect-grader
            dockerfile: images/detect-grader/Dockerfile
            scan-continue-on-error: false
    uses: Qfour/homelab-workflows/.github/workflows/image-pipeline.yaml@10583360d619601e225803d236a00d0fa014b1f8 # main as of 2026-05-12
    with:
      name: ${{ matrix.name }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      push: ${{ github.event_name == 'push' && vars.ECR_REGISTRY != '' && !contains(vars.ECR_REGISTRY, 'PLACEHOLDER') }}
      registry: ${{ vars.ECR_REGISTRY }}
      aws-region: ${{ vars.AWS_REGION }}
      # dependabot[bot] は secrets を受け取れない run なので scan は non-blocking
      # (advisory) にする。github.actor は GitHub 側が確定する値で PR 作者が
      # 詐称できない (Dependabot service account のみがこの actor になれる)。
      # 他 actor は matrix 値 (現状すべて false) のまま — 挙動は不変。
      scan-continue-on-error: ${{ github.actor == 'dependabot[bot]' || matrix.scan-continue-on-error }}
      sysdig-secure-url: https://app.au1.sysdig.com
    secrets:
      sysdig-token: ${{ secrets.SYSDIG_SECURE_TOKEN }}
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

  # ------------------------------------------------------------------
  # Issue #168: visible, auditable trail for the advisory-scan override
  # above. Not required, never blocks — purely a job-summary annotation so
  # a reviewer merging a Dependabot PR sees *why* build/scan is green
  # without a real scan, and knows the post-merge push-to-main run is the
  # real gate for that dependency bump.
  # ------------------------------------------------------------------
  dependabot-scan-notice:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: annotate
        run: |
          echo "::notice::This PR is authored by dependabot[bot], which does not receive repository secrets (SYSDIG_SECURE_TOKEN). build (scoreboard)/scan and build (auth-policy)/scan ran with scan-continue-on-error=true (advisory) for this run only — see Issue #168. The real CVE scan for the resulting merge commit runs automatically on push to main (with secrets); make scan TAG=local remains the authoritative pre-deploy gate per dev-flow.md."

  # ------------------------------------------------------------------
  # ADR-0001 Verification 2-8 / DoD 15: re-verify the challenge image's
  # /opt/ctf/plant-seed/ build-time snapshot (no hash/flag material, mode
  # +owner+content match, no hardlinked files under /etc). This is a CI
  # safety net alongside `make check-image-hygiene`'s fail-closed call from
  # `make build` (F2-shaped gap: prod is CI-free, an operator runs
  # `make build` by hand, so the *primary* gate has to live there — see
  # scripts/check-image-hygiene.sh's header comment). Builds the challenge
  # image itself (not via the `build` matrix's reusable image-pipeline
  # workflow, which we don't own/can't easily hook a post-build step into)
  # so this job is self-contained and independent of publish gating.
  # Branch protection check: not required (see the `build` job's ttyd-proxy
  # comment for the same "adding it is optional CEO hardening" note).
  # ------------------------------------------------------------------
  image-hygiene:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: build challenge image (local — for hygiene inspection only, not published)
        run: docker build -t falco-ctf/challenge:ci-hygiene-check -f images/challenge/Dockerfile .
      - name: check image hygiene (fail-closed)
        run: ./scripts/check-image-hygiene.sh falco-ctf/challenge:ci-hygiene-check

  # ------------------------------------------------------------------
  # Publish Helm charts to ECR (OCI). Same git SHA as the images
  # (Invariant I5). Push only on main branch (v* タグは CI 非トリガ — Issue #37). Chart version is a SemVer
  # prerelease pinned to the SHA so prod can pin an immutable artifact.
  # ------------------------------------------------------------------
  # Skipped while vars.ECR_REGISTRY is unset/placeholder (CI-free prod) —
  # 復活手順は build job のコメント参照。
  publish-charts:
    if: github.event_name == 'push' && vars.ECR_REGISTRY != '' && !contains(vars.ECR_REGISTRY, 'PLACEHOLDER')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: ECR login (helm OCI)
        run: |
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | helm registry login --username AWS --password-stdin "${{ vars.ECR_REGISTRY }}"
      - name: Package & push charts
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short HEAD)"
          VERSION="0.1.0-${SHA}"
          REG="${{ vars.ECR_REGISTRY }}"
          for c in scoreboard auth-policy collector ctf-user docs; do
            # ECR repositories are not auto-created; ensure charts/<c> exists.
            aws ecr describe-repositories --repository-names "charts/${c}" --region "${{ vars.AWS_REGION }}" >/dev/null 2>&1 \
              || aws ecr create-repository --repository-name "charts/${c}" --region "${{ vars.AWS_REGION }}" >/dev/null
            helm package "charts/${c}" --version "${VERSION}" --app-version "${SHA}"
            helm push "${c}-${VERSION}.tgz" "oci://${REG}/charts"
          done
          echo "published charts at version ${VERSION} → oci://${REG}/charts/{scoreboard,auth-policy,collector,ctf-user,docs}"
