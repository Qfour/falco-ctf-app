name: build-push

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  SYSDIG_SECURE_URL: https://app.au1.sysdig.com
  SEVERITY_AT_LEAST: high

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Go vet + test
        run: docker build -f Dockerfile.test --progress=plain .

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: scoreboard
            context: .
            dockerfile: scoreboard/Dockerfile
          - name: auth-policy
            context: .
            dockerfile: auth-policy/Dockerfile
          - name: ttyd
            context: images/ttyd
            dockerfile: images/ttyd/Dockerfile
          - name: challenge
            context: images/challenge
            dockerfile: images/challenge/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Compute tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: falco-ctf-${{ matrix.name }}:${{ steps.tag.outputs.tag }}

      - name: Save image for scan
        run: |
          docker save falco-ctf-${{ matrix.name }}:${{ steps.tag.outputs.tag }} \
            -o ${{ matrix.name }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ matrix.name }}
          path: ${{ matrix.name }}.tar
          retention-days: 1

  scan:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [scoreboard, auth-policy, ttyd, challenge]
    steps:
      - uses: actions/checkout@v6

      - name: Compute tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image-${{ matrix.image }}

      - name: Load Docker image
        run: docker load -i ${{ matrix.image }}.tar

      - name: Sysdig CLI Scanner
        id: scan
        continue-on-error: true
        uses: sysdiglabs/scan-action@v6
        with:
          image-tag: falco-ctf-${{ matrix.image }}:${{ steps.tag.outputs.tag }}
          sysdig-secure-token: ${{ secrets.SYSDIG_SECURE_TOKEN }}
          sysdig-secure-url: ${{ env.SYSDIG_SECURE_URL }}
          stop-on-failed-policy-eval: true
          severity-at-least: ${{ env.SEVERITY_AT_LEAST }}

      - name: Retry Sysdig CLI Scanner (on MainDB download failure)
        id: scan_retry
        if: steps.scan.outcome == 'failure' && hashFiles('sarif.json') == ''
        continue-on-error: true
        uses: sysdiglabs/scan-action@v6
        with:
          image-tag: falco-ctf-${{ matrix.image }}:${{ steps.tag.outputs.tag }}
          sysdig-secure-token: ${{ secrets.SYSDIG_SECURE_TOKEN }}
          sysdig-secure-url: ${{ env.SYSDIG_SECURE_URL }}
          stop-on-failed-policy-eval: true
          severity-at-least: ${{ env.SEVERITY_AT_LEAST }}

      - name: Upload SARIF report
        if: hashFiles('sarif.json') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ github.workspace }}/sarif.json
          category: sysdig-${{ matrix.image }}

      - name: Fail on policy violation
        if: hashFiles('sarif.json') != '' && (steps.scan.outcome == 'failure' || steps.scan_retry.outcome == 'failure')
        run: |
          echo "::error::Policy violations found. See the Security tab for details."
          exit 1

      - name: Warn on persistent scan infrastructure error
        if: hashFiles('sarif.json') == '' && steps.scan.outcome == 'failure' && steps.scan_retry.outcome != 'success'
        run: |
          echo "::warning::Sysdig scan failed after retry (MainDB unreachable). Results unavailable for this run."

  lint-kustomize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: imranismail/setup-kustomize@v3
      - run: |
          for d in deploy/*/overlays/*; do
            echo "== $d =="
            kustomize build "$d" >/dev/null
          done
