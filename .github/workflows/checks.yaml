name: Checks

# G5-2: 検査カバレッジ拡充 (advisory)。
#
# advisory の定義 (GITHUB-OPS.md G5 共通): branch protection の required 集合に
# **意図的に登録しない**ことで非ブロック化する。`continue-on-error` は使わない —
# 常時緑は finding を隠し「observed green が N 週続くまで required に足さない」という
# 昇格の観測基準を壊すため。ここでは真の赤/緑をそのまま出す (advisory = non-required で
# 実現し、常時 pass では実現しない)。
#
# ここに集約する PR トリガの静的検査 (既存 ci.yaml の required job には足さない):
#   - actionlint     : workflow YAML の静的検査 + mutable action ref (P12 違反) 検出
#   - go-vulncheck   : go.sum 依存 / stdlib の既知脆弱性 (image CVE scan がカバーしない層)
#   - gen-diff-check : make gen (oapi) / make tidy / make gen-attack 後の git diff
#                      (spec↔code / 依存 / ATT&CK 生成物 drift)
#
# base image EOL 検知 (check-freshness) は network 必須ゆえ freshness.yaml の
# scheduled cron に分離した (PR 毎には回さない)。
#
# サプライチェーン (P12): 新規サードパーティ action は増やさない。ツールは
# golang container 内で `go install <module>@<version>` する (module version pin =
# reproducible)。使う action は既存例外表の actions/checkout@v7 のみ。
# 正典: .claude/rules/falco-ctf-app-conventions.md「CI workflow / action 参照の pin」。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ------------------------------------------------------------------
  # actionlint — workflow YAML の静的検査 (mutable action ref = P12 違反も -shellcheck
  # 併用の run ブロック検査で拾う)。
  #
  # G5-3: local reusable workflow (./.github/workflows/actionlint.yaml) を呼ぶ caller。
  # 同一リポ参照ゆえ相対パス (SHA pin 不要)。platform は同 reusable を SHA pin で consume。
  # install (go install ...@v1.7.12) と shellcheck 同梱は reusable 側で統一。
  #
  # actionlint は現状 非 required (G5-2)。reusable 化で context 名は
  # "actionlint / actionlint" (caller job id / reusable job id) になる。
  # required 昇格 (N 週 green 後) 時は setup-rulesets.sh の CHECKS にこの新名を足す。
  # ------------------------------------------------------------------
  actionlint:
    uses: ./.github/workflows/actionlint.yaml

  # ------------------------------------------------------------------
  # go-vulncheck — go.sum 依存 / Go stdlib の既知脆弱性 (govulncheck)。
  # image CVE scan (PR CI build job) がカバーしないソース依存レイヤ。
  # CodeQL (G3) とは別レイヤ (CodeQL=コードパターン、govulncheck=既知 CVE の到達性)。
  # golang container 内で実行 (Colima 同様 host repo は checkout でコンテナに入る)。
  # ------------------------------------------------------------------
  go-vulncheck:
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-alpine@sha256:0178a641fbb4858c5f1b48e34bdaabe0350a330a1b1149aabd498d0699ff5fb2
    steps:
      # govulncheck は go.mod 起点で module graph / source を解析するだけで git を要さない
      # (gen-diff-check は git diff を使うため git 必須で対照的)。checkout は git 非在時に
      # GitHub REST tarball へ fallback するので apk add git は不要。git 前提はこの job から落とす。
      - uses: actions/checkout@v7
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: govulncheck ./...
        run: |
          set -eu
          GOBIN="$(go env GOPATH)/bin"
          export PATH="$PATH:$GOBIN"
          govulncheck ./...

  # ------------------------------------------------------------------
  # gen-diff-check — 生成物 drift 検知。
  #   1. oapi 生成 (make gen 相当) 後の内部 oapi types が spec と一致するか
  #   2. go mod tidy (make tidy 相当) 後の go.mod / go.sum が最新か
  #   3. ATT&CK Navigator layer / coverage table (make gen-attack 相当) が
  #      challenges/*/falco-rule.yaml の attack: ブロックと一致するか
  # どれも `git diff --exit-code` で drift を検出する (手書き/更新漏れを block)。
  # golang container 内で完結させ、生成コマンドは Dockerfile.gen / Dockerfile.tidy と
  # 同じツール version に揃える (oapi-codegen@v2.3.0)。gen-attack は python3 script
  # (stdlib のみ) なので同一 container に apk add python3 して倣う。
  # ------------------------------------------------------------------
  gen-diff-check:
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-alpine@sha256:0178a641fbb4858c5f1b48e34bdaabe0350a330a1b1149aabd498d0699ff5fb2
    steps:
      - name: install git + python3 (checkout / diff / gen-attack 前提)
        run: apk add --no-cache git python3
      - uses: actions/checkout@v7
      - name: mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.3.0
      - name: regenerate oapi types (make gen)
        run: |
          set -eu
          GOBIN="$(go env GOPATH)/bin"
          export PATH="$PATH:$GOBIN"
          mkdir -p internal/scoreboard/oapi internal/authpolicy/oapi
          oapi-codegen --config api/cfg-scoreboard.yaml  docs/openapi-scoreboard.yaml
          oapi-codegen --config api/cfg-auth-policy.yaml docs/openapi-auth-policy.yaml
      - name: go mod tidy (make tidy)
        run: go mod tidy
      - name: regenerate attack coverage (make gen-attack)
        run: python3 scripts/gen-attack-layer.py
      - name: fail on drift
        run: |
          set -eu
          if ! git diff --exit-code -- internal/ go.mod go.sum challenges/attack-navigator-layer.json challenges/ATTACK-COVERAGE.md; then
            echo "::error::generated artifacts are stale. Run 'make gen', 'make tidy', and 'make gen-attack', then commit." >&2
            exit 1
          fi
