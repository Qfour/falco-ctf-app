name: Add issues to project

# 新規 Issue を org/user Projects v2 ボードへ確実に追加する caller。
# 実体 (SHA pin + project-url + step ロジック) は reusable workflow に集約済み:
#   .github/workflows/add-to-project-reusable.yml   (Issue #33 — 二重管理の解消)
# platform 側 caller もこの reusable を Qfour/falco-ctf-app/...@<SHA> で参照する。
#
# 【重要】ADD_TO_PROJECT_PAT は依然この repo の repo-secret のまま。
#   Qfour は user アカウントで org secret を持てないため、reusable 化しても
#   PAT の二重登録は解消しない (単一ソース化は SHA/URL/ロジックのみ)。
#   PAT の登録は別作業・CEO。

on:
  issues:
    types: [opened, reopened, transferred]

jobs:
  add-to-project:
    permissions: {}
    uses: ./.github/workflows/add-to-project-reusable.yml
    secrets:
      ADD_TO_PROJECT_PAT: ${{ secrets.ADD_TO_PROJECT_PAT }}
