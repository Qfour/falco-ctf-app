apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: { kind: Deployment, name: auth-policy }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auth-policy
      spec:
        template:
          spec:
            containers:
              - name: auth-policy
                env:
                  - name: EXPECTED_EMAIL_DOMAIN
                    value: "ctf.local"
images:
  - name: docker.io/falco-ctf/auth-policy
    newTag: dev
