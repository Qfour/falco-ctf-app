apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: { kind: Deployment, name: auth-policy }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "ctf.local"
images:
  - name: docker.io/falco-ctf/auth-policy
    newTag: dev
