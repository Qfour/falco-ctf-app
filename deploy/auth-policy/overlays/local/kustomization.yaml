apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: { kind: Deployment, name: auth-policy }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auth-policy
      spec:
        template:
          spec:
            containers:
              - name: auth-policy
                env:
                  - name: EXPECTED_EMAIL_DOMAIN
                    value: "ctf.local"
                  # Local: reuse user1 (one of the Dex static users) as the
                  # local admin so verify-auth can test the gate without
                  # additional accounts. Production overlays its own list.
                  - name: ADMIN_EMAILS
                    value: "user1@ctf.local"
images:
  - name: docker.io/falco-ctf/auth-policy
    newTag: dev
