# auth-policy — production overlay (EKS).
#
# auth-policy sits on the auth hot path of every workspace request, so this
# overlay scales it to 2 with anti-affinity + PDB. Replace
# REPLACE_WITH_GIT_SHA at deploy time with the actual image tag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- poddisruptionbudget.yaml
- servicemonitor.yaml
- prometheusrule.yaml

images:
- name: docker.io/falco-ctf/auth-policy
  newName: REPLACE_WITH_ECR_REGISTRY/falco-ctf-auth-policy
  newTag: REPLACE_WITH_GIT_SHA

  # Production: real OAuth provider host and (eventual) corporate email
  # domain. Update EXPECTED_EMAIL_DOMAIN to match the IdP narrowed in
  # oauth2-proxy's `email_domains`.
                  # ADMIN_EMAILS gates the scoreboard host. Populate with the
                  # ops team mailbox(es) — comma-separated, case-insensitive.
                  # Empty = nobody (fail-closed). TODO: source from
                  # ExternalSecrets once Phase 6 lands.
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: auth-policy
    spec:
      replicas: 2
      template:
        spec:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: auth-policy
          containers:
            - name: auth-policy
              env:
                - name: EXPECTED_EMAIL_DOMAIN
                  value: "ctf.local"
                - name: ADMIN_EMAILS
                  value: "admin@ctf.local"
  target:
    kind: Deployment
    name: auth-policy
