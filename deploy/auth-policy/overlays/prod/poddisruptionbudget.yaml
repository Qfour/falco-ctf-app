# auth-policy is on the auth hot path of every workspace request. With
# replicas=2 in prod, allow exactly one to be unavailable at any time so
# voluntary node drains stay non-disruptive.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-policy
  namespace: auth-policy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-policy
