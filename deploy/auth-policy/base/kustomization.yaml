apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
labels:
  # `includeSelectors: false` — see scoreboard/base/kustomization.yaml for why.
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: auth-policy
      app.kubernetes.io/part-of: falco-ctf
      app.kubernetes.io/managed-by: kustomize
# Intentionally no `images:` here — `base/` is environment-neutral
# (Invariant I4: image tags must be set per-overlay; never default to a
# floating tag in base).
