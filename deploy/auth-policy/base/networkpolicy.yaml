# auth-policy NetworkPolicies — default-deny + ingress only from ingress-nginx
# (auth-url subrequest) and egress only to kube-dns + oauth2-proxy.
#
# auth-policy is the host↔email enforcement point. Anyone able to bypass
# this service ↔ ingress-nginx coupling could reach other users' workspaces;
# locking down the network plane is part of the defense.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-policy-default-deny
  namespace: auth-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-policy-allow
  namespace: auth-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-policy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # ingress-nginx subrequest → /check
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # oauth2-proxy /oauth2/auth subrequest. Egress NP filters on the actual
    # destination pod port post-DNAT, so we need both 4180 (oauth2-proxy
    # container) and 80 (Service port — used by some CNIs / kube-proxy
    # modes that filter pre-DNAT).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: oauth2-proxy
      ports:
        - protocol: TCP
          port: 4180
        - protocol: TCP
          port: 80
