# scoreboard NetworkPolicies — default-deny + scoped ingress for the two
# audiences that legitimately reach this Pod.
#
# /falco/events:   only falco namespace (where falcosidekick runs)
# /api/state, /healthz, /metrics, dashboard HTML:  only ingress-nginx ns
#
# Without this, any cluster pod (including the participant's challenge
# container running as root) can POST forged events to /falco/events and
# attribute solves to other users. See AGENTS.md threat model — Falco
# webhook authenticity.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scoreboard-default-deny
  namespace: scoreboard
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scoreboard-allow
  namespace: scoreboard
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: scoreboard
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # falcosidekick webhook → /falco/events
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: falco
      ports:
        - protocol: TCP
          port: 8000
    # dashboard / API / metrics from ingress-nginx
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    # ctf-user workspaces → /api/users/{user}/me + /api/users/{user}/display-name +
    # /api/challenges/{cid}/submit. NP can't restrict by path, so this opens
    # port 8000 wholesale; the scoreboard's App-H2 ingest filter
    # (container.image.repository must contain "falco-ctf/challenge",
    # priority >= Notice) prevents the workspace from forging /falco/events.
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: ctf-user
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # kube-dns only — the scoreboard never originates outbound traffic.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
