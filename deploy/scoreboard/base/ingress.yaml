apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scoreboard
  namespace: scoreboard
spec:
  ingressClassName: nginx
  rules:
    - host: scoreboard.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scoreboard
                port:
                  number: 80
