apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scoreboard
  namespace: scoreboard
  annotations:
    # Operator-only gate. auth-policy /check-admin returns 200 only when
    # the logged-in oauth2-proxy email is in the ADMIN_EMAILS allowlist
    # of the auth-policy Deployment. Without this any logged-in user
    # could reach the scoreboard / /me dashboards.
    nginx.ingress.kubernetes.io/auth-url: "http://auth-policy.auth-policy.svc.cluster.local:80/check-admin"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Preferred-Username"
    # auth-signin is per-environment (different oauth2-proxy host). Set in
    # overlays/{local,prod}/.
spec:
  ingressClassName: nginx
  rules:
    - host: scoreboard.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scoreboard
                port:
                  number: 80
