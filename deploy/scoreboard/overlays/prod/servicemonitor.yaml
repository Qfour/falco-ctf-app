# Prometheus Operator ServiceMonitor — requires kube-prometheus-stack
# (or equivalent CRDs) installed on the cluster. If the CRDs aren't present
# this resource is created but inert; once they are, scraping starts.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: scoreboard
  namespace: scoreboard
  labels:
    app.kubernetes.io/name: scoreboard
    # match kube-prometheus-stack's default `release` selector. Override the
    # value below to whichever Helm release name the operator is installed
    # under in your cluster.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: scoreboard
  namespaceSelector:
    matchNames:
      - scoreboard
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
