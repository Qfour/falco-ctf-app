# Prometheus Operator alerts for the scoreboard.
#
# Requires kube-prometheus-stack (or equivalent) installed on the cluster.
# The `release: kube-prometheus-stack` label matches the operator's default
# RuleSelector — override the value if your install uses a different name.
#
# Severity convention:
#   - critical: scoreboard is down / scoring is paused (page someone)
#   - warning:  scoring is degraded but the dashboard still works
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: scoreboard
  namespace: scoreboard
  labels:
    app.kubernetes.io/name: scoreboard
    release: kube-prometheus-stack
spec:
  groups:
    - name: scoreboard.rules
      interval: 30s
      rules:
        - alert: ScoreboardPodDown
          # replicas=1 + Recreate is a Hard Invariant (SQLite single-writer).
          # Any pod gap is a complete scoring outage, not a partial one.
          expr: |
            kube_deployment_status_replicas_available{namespace="scoreboard",deployment="scoreboard"} == 0
          for: 1m
          labels:
            severity: critical
            component: scoreboard
          annotations:
            summary: "scoreboard pod down — scoring is paused"
            description: "The scoreboard Deployment has 0 available replicas for >1m. CTF scoring is offline. Check pod logs and PVC mount status."

        - alert: ScoreboardIngestErrorRate
          # /falco/events should almost never 5xx. >1% over 5m means the
          # SQLite path is broken (lock contention, disk full).
          expr: |
            sum(rate(scoreboard_ingest_falco_events_received_total{result="store_error"}[5m]))
              / sum(rate(scoreboard_ingest_falco_events_received_total[5m])) > 0.01
          for: 5m
          labels:
            severity: warning
            component: scoreboard
          annotations:
            summary: "scoreboard /falco/events store-error rate >1%"
            description: "Falco events are reaching the scoreboard but the SQLite write is failing. Check PVC free space and WAL state."

        - alert: ScoreboardSubmitErrorRate
          # /submit 500s mean MarkSolved failed. Less critical than ingest
          # because participants will retry, but worth investigating.
          expr: |
            sum(rate(scoreboard_submissions_total{result=~"5.."}[5m]))
              / sum(rate(scoreboard_submissions_total[5m])) > 0.01
          for: 5m
          labels:
            severity: warning
            component: scoreboard
          annotations:
            summary: "scoreboard /submit 5xx rate >1%"
            description: "Participants are seeing failed submits. Inspect scoreboard pod logs and SQLite write health."

        - alert: ScoreboardNoFalcoEvents
          # During the event, /falco/events should see continuous traffic.
          # 5 minutes of silence usually means the Falco → falcosidekick →
          # scoreboard pipeline is broken upstream of us.
          expr: |
            sum(increase(scoreboard_ingest_falco_events_received_total{result="accepted"}[5m])) == 0
          for: 5m
          labels:
            severity: warning
            component: scoreboard
          annotations:
            summary: "no Falco events accepted by scoreboard in 5m"
            description: "Either no challenges are firing rules (very quiet event), or the Falco→falcosidekick→scoreboard path is broken. Run scripts/verify.sh."
