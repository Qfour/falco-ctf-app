# auth-policy chart values. Env-specific values (image tag, email domain, admin
# allowlist) are supplied by falco-ctf-platform's helmfile per environment.

replicas: 1

image:
  repository: docker.io/falco-ctf/auth-policy
  tag: ""
  pullPolicy: IfNotPresent

env:
  oauth2ProxyAuthUrl: "http://oauth2-proxy.oauth2-proxy.svc.cluster.local:80/oauth2/auth"
  # Invariant I8 (ADR-0034): the canonical identity downstream is
  # <seat>@<expectedEmailDomain>. The LAST label MUST be a reserved name
  # (local, test, invalid, example, localhost) — auth-policy refuses to start
  # otherwise, so an external IdP can never hold a verified email in this domain.
  expectedEmailDomain: "example.invalid"
  # Operator allowlist (comma-separated): /check-admin, and the admin override on
  # /check-participant. NOT /check-workspace: an operator's request is never
  # handed to a seat's Pod (ADR-0050). Empty = nobody (fail-closed). Every
  # entry must be a reserved-domain static account and must NOT also be a roster
  # seat's canonical email or an `external` (checked at startup).
  adminEmails: ""

# The identity roster (ADR-0034 D2) — the ONE table mapping an authenticated
# identity to a seat. Rendered by the platform (it holds the external emails,
# which are personal data and never live in this public repo) into a Secret in
# the auth-policy namespace; this chart only mounts it at
# /etc/auth-policy/roster/roster.yaml (ROSTER_FILE). File shape:
#
#   seats:
#     - seat: user1
#     - seat: user2
#       external: someone@partner.example   # optional, at most one
#
# There is no "no roster" mode: a missing Secret keeps the pod from starting.
roster:
  # Name of the Secret (key `roster.yaml`) in the release namespace.
  secretName: "auth-policy-roster"
  # Optional digest of the Secret's content. auth-policy reads the roster once,
  # so a changed roster must roll the pods; the platform passes e.g. the
  # sha256 here and a new value changes the pod template. Empty = no annotation
  # (then roll with `kubectl rollout restart`).
  checksum: ""

# Prod runs 2 replicas with zone spread (auth hot path). Local leaves false.
highAvailability: false

# P20 node-tier pinning (fixed service). Empty = no scheduling constraint.
# When populated the values match the scoreboard's vm-prod pin (see
# charts/scoreboard/values.yaml for the canonical block):
#   nodeSelector:
#     node-role.kubernetes.io/control-plane: "true"   # label k3s server auto-applies
#   tolerations:
#     - key: "ctf.falco/fixed-only"
#       operator: "Equal"
#       value: "true"
#       effect: "NoSchedule"
# Key names MUST match platform's vm-prod values. Scheduling only — orthogonal
# to highAvailability's topologySpreadConstraints above.
# NOTE: in the current PoC the platform overlay pins ONLY scoreboard + ingress;
# it does NOT yet pass values here. This is a receiver kept ready for P20-2,
# which collapses all fixed services onto the server tier.
nodeSelector: {}
tolerations: []

resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits:   { cpu: 200m, memory: 128Mi }

# Prod hardening — off by default (local), enabled via helmfile prod env.
podDisruptionBudget:
  enabled: false   # minAvailable: 1 (prod replicas=2)

monitoring:
  enabled: false   # needs Prometheus Operator CRDs
  prometheusReleaseLabel: kube-prometheus-stack
