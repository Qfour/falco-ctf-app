# auth-policy chart values. Env-specific values (image tag, email domain, admin
# allowlist) are supplied by falco-ctf-platform's helmfile per environment.

replicas: 1

image:
  repository: docker.io/falco-ctf/auth-policy
  tag: ""
  pullPolicy: IfNotPresent

env:
  oauth2ProxyAuthUrl: "http://oauth2-proxy.oauth2-proxy.svc.cluster.local:80/oauth2/auth"
  # Invariant I8: prefix-exact <username>@ match. Must match oauth2-proxy email_domains.
  expectedEmailDomain: "example.invalid"
  # /check-admin allowlist (comma-separated). Empty = nobody (fail-closed).
  adminEmails: ""

# Prod runs 2 replicas with zone spread (auth hot path). Local leaves false.
highAvailability: false

# P20 node-tier pinning (fixed service). Empty = no scheduling constraint.
# When populated the values match the scoreboard's vm-prod pin (see
# charts/scoreboard/values.yaml for the canonical block):
#   nodeSelector:
#     node-role.kubernetes.io/control-plane: "true"   # label k3s server auto-applies
#   tolerations:
#     - key: "ctf.falco/fixed-only"
#       operator: "Equal"
#       value: "true"
#       effect: "NoSchedule"
# Key names MUST match platform's vm-prod values. Scheduling only — orthogonal
# to highAvailability's topologySpreadConstraints above.
# NOTE: in the current PoC the platform overlay pins ONLY scoreboard + ingress;
# it does NOT yet pass values here. This is a receiver kept ready for P20-2,
# which collapses all fixed services onto the server tier.
nodeSelector: {}
tolerations: []

resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits:   { cpu: 200m, memory: 128Mi }

# Prod hardening — off by default (local), enabled via helmfile prod env.
podDisruptionBudget:
  enabled: false   # minAvailable: 1 (prod replicas=2)

monitoring:
  enabled: false   # needs Prometheus Operator CRDs
  prometheusReleaseLabel: kube-prometheus-stack
