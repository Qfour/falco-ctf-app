# auth-policy NetworkPolicies — default-deny + ingress only from ingress-nginx
# (auth-url subrequest) and egress only to kube-dns + oauth2-proxy. auth-policy
# is the host↔email enforcement point; locking the network plane is part of the
# defense.
{{ include "falco-ctf-common.networkPolicy.defaultDeny" (dict "name" "auth-policy" "namespace" "auth-policy") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-policy-allow
  namespace: auth-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-policy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # ingress-nginx subrequest → /check, /check-admin
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # oauth2-proxy /oauth2/auth subrequest. Egress NP filters post-DNAT, so we
    # need both 4180 (container) and 80 (Service port for pre-DNAT CNIs).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: oauth2-proxy
      ports:
        - protocol: TCP
          port: 4180
        - protocol: TCP
          port: 80
