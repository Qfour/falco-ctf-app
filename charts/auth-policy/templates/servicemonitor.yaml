{{- if .Values.monitoring.enabled }}
# Requires Prometheus Operator CRDs (kube-prometheus-stack). Inert until present.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth-policy
  namespace: auth-policy
  labels:
    app.kubernetes.io/name: auth-policy
    release: {{ .Values.monitoring.prometheusReleaseLabel }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-policy
  namespaceSelector:
    matchNames:
      - auth-policy
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
{{- end }}
