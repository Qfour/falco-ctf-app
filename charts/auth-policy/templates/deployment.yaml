apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-policy
  namespace: auth-policy
  labels:
    {{- include "falco-ctf-common.labels" (dict "name" "auth-policy" "managedBy" .Release.Service) | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-policy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-policy
        app.kubernetes.io/part-of: falco-ctf
      {{- with .Values.roster.checksum }}
      annotations:
        # The roster is read once at startup (ADR-0034 D2: no hot reload), so a
        # changed Secret must roll the pods. The platform renders the Secret
        # (this chart does not own it) and passes a digest of its content here;
        # a different digest is a different pod template = a rolling restart.
        checksum/roster: {{ . | quote }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "falco-ctf-common.podSecurityContext" (dict) | nindent 8 }}
      {{- if .Values.highAvailability }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: auth-policy
      {{- end }}
      {{- /* P20 node-tier pinning (fixed service). Empty defaults render nothing —
             unset = identical to prior render. See values.yaml for the vm-prod keys. */}}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: auth-policy
          image: {{ include "falco-ctf-common.image" (dict "repository" .Values.image.repository "tag" .Values.image.tag "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "falco-ctf-common.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OAUTH2_PROXY_AUTH_URL
              value: {{ .Values.env.oauth2ProxyAuthUrl | quote }}
            - name: EXPECTED_EMAIL_DOMAIN
              value: {{ .Values.env.expectedEmailDomain | quote }}
            # ADMIN_EMAILS: allowlist consulted by /check-admin (scoreboard host
            # gate). Empty default = nobody is admin (fail-closed).
            - name: ADMIN_EMAILS
              value: {{ .Values.env.adminEmails | quote }}
            # ROSTER_FILE (ADR-0034 D2): the identity roster. REQUIRED — the
            # process refuses to start without a readable, valid file, and the
            # Secret volume below is not optional, so a missing Secret leaves
            # the pod in ContainerCreating (closed) rather than serving.
            - name: ROSTER_FILE
              value: "/etc/auth-policy/roster/roster.yaml"
          volumeMounts:
            - name: roster
              mountPath: /etc/auth-policy/roster
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: roster
          secret:
            secretName: {{ required "roster.secretName is required (ADR-0034 D2: auth-policy cannot start without a roster)" .Values.roster.secretName | quote }}
            # World-readable inside the pod only: the container runs as 65532
            # with no fsGroup, so a root-owned 0400/0440 file would be
            # unreadable. The pod has exactly one process and a read-only root.
            defaultMode: 0444
