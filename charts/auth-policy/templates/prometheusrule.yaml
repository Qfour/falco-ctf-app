{{- if .Values.monitoring.enabled }}
# Prometheus Operator alerts. Requires kube-prometheus-stack CRDs.
# Metric names match the actual exposition (internal/authpolicy/metrics.go):
# namespace `auth_policy`, counters `auth_policy_checks_total{result}`,
# histogram `auth_policy_upstream_duration_seconds`.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: auth-policy
  namespace: auth-policy
  labels:
    app.kubernetes.io/name: auth-policy
    release: {{ .Values.monitoring.prometheusReleaseLabel }}
spec:
  groups:
    - name: auth-policy.rules
      interval: 30s
      rules:
        - alert: AuthPolicyAllDown
          expr: |
            kube_deployment_status_replicas_available{namespace="auth-policy",deployment="auth-policy"} == 0
          for: 1m
          labels:
            severity: critical
            component: auth-policy
          annotations:
            summary: "auth-policy has zero available replicas — workspaces are blocked"
            description: "All auth-policy pods unavailable. Every workspace ingress will 502. Check pod logs and oauth2-proxy reachability."

        - alert: AuthPolicyHighLatency
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(auth_policy_upstream_duration_seconds_bucket[5m]))
            ) > 0.2
          for: 5m
          labels:
            severity: warning
            component: auth-policy
          annotations:
            summary: "auth-policy p99 upstream latency >200ms"
            description: "oauth2-proxy /oauth2/auth subrequests are slow. Inspect oauth2-proxy / Dex health."

        - alert: AuthPolicyUpstreamErrors
          expr: |
            sum(rate(auth_policy_checks_total{result="upstream_error"}[5m]))
              / sum(rate(auth_policy_checks_total[5m])) > 0.01
          for: 5m
          labels:
            severity: warning
            component: auth-policy
          annotations:
            summary: "auth-policy upstream-error rate >1%"
            description: "auth-policy is masking upstream errors as 502. Workspaces intermittently inaccessible. Check oauth2-proxy / Dex / NetworkPolicy."
{{- end }}
