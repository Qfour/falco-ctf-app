# docs chart values. Env-specific values (image tag, host, sign-in URL, TLS)
# are supplied by falco-ctf-platform's helmfile per environment.

replicas: 1

image:
  repository: docker.io/falco-ctf/docs
  # tag MUST be a git SHA in real deploys. Empty → Chart.appVersion.
  tag: ""
  pullPolicy: IfNotPresent

resources:
  requests: { cpu: 10m, memory: 24Mi }
  limits:   { cpu: 200m, memory: 128Mi }

# P20 node-tier pinning (fixed service). Empty = no scheduling constraint.
# When populated the values match the scoreboard's vm-prod pin (see
# charts/scoreboard/values.yaml for the canonical block):
#   nodeSelector:
#     node-role.kubernetes.io/control-plane: "true"   # label k3s server auto-applies
#   tolerations:
#     - key: "ctf.falco/fixed-only"
#       operator: "Equal"
#       value: "true"
#       effect: "NoSchedule"
# Key names MUST match platform's vm-prod values. Scheduling only.
# NOTE: in the current PoC the platform overlay pins ONLY scoreboard + ingress;
# it does NOT yet pass values here. This is a receiver kept ready for P20-2,
# which collapses all fixed services onto the server tier.
nodeSelector: {}
tolerations: []

ingress:
  # P23-5 removed the participant-facing docs Ingress (brief-only root, ANY
  # authenticated participant, no host binding) — templates/ingress.yaml no
  # longer exists. That content (はじめに/ストーリー/コマンド集/なぜ発火するか) is
  # now folded into the unified portal's Home tab
  # (internal/scoreboard/view/home.go, docs-site/home-fragments.yaml).
  #
  # P19-2b (single origin, platform-coordinated follow-up this completes):
  # docs-admin moved from its OWN subdomain (docs-admin.<suffix>) to a PATH
  # (`/docs-admin`) on the shared single-origin host. `enabled` / `host` /
  # `authUrl` (the removed participant Ingress's leftover keys) are dropped
  # outright — templates/ingress-admin.yaml now gates on `adminHost` (the
  # single-origin host, e.g. app.<suffix>) alone, at the fixed
  # `/docs-admin` path (see docs-site/nginx.conf's matching path-prefix
  # rewrite via `alias`). Coordinate with platform's helmfile
  # (releases/docs/values*.gotmpl) — the removed `host`/`enabled`/`authUrl`
  # keys must be dropped there too, or Helm will silently ignore the
  # now-nonexistent keys (harmless, but stale).
  className: nginx
  tls: false
  # secretName for the TLS cert. Empty = rely on ingress-nginx's wildcard
  # default-ssl-certificate (local). Prod can set a name.
  tlsSecretName: ""
  authSignin: ""
  # Extra annotations merged in (e.g. ssl-redirect in prod). Still used by
  # ingress-admin.yaml.
  annotations: {}
  # 運営用ビュー: the docs chart's ONLY remaining Ingress (P23-5 / P19-2b).
  # Single-origin host (SAME value as the scoreboard chart's `ingress.host`,
  # e.g. app.<suffix>) — nginx now selects the admin root by PATH
  # (`/docs-admin`, see docs-site/nginx.conf), not by a `docs-admin.` host
  # prefix. The ingress additionally gates it with auth-policy /check-admin
  # (same ADMIN_EMAILS allowlist as the scoreboard reset). Empty adminHost
  # disables this ingress entirely (no ingress at all is then rendered by
  # this chart).
  adminHost: ""
  adminAuthUrl: "http://auth-policy.auth-policy.svc.cluster.local:80/check-admin"
