# docs chart values. Env-specific values (image tag, host, sign-in URL, TLS)
# are supplied by falco-ctf-platform's helmfile per environment.

replicas: 1

image:
  repository: docker.io/falco-ctf/docs
  # tag MUST be a git SHA in real deploys. Empty → Chart.appVersion.
  tag: ""
  pullPolicy: IfNotPresent

resources:
  requests: { cpu: 10m, memory: 24Mi }
  limits:   { cpu: 200m, memory: 128Mi }

# P20 node-tier pinning (fixed service). Empty = no scheduling constraint.
# When populated the values match the scoreboard's vm-prod pin (see
# charts/scoreboard/values.yaml for the canonical block):
#   nodeSelector:
#     node-role.kubernetes.io/control-plane: "true"   # label k3s server auto-applies
#   tolerations:
#     - key: "ctf.falco/fixed-only"
#       operator: "Equal"
#       value: "true"
#       effect: "NoSchedule"
# Key names MUST match platform's vm-prod values. Scheduling only.
# NOTE: in the current PoC the platform overlay pins ONLY scoreboard + ingress;
# it does NOT yet pass values here. This is a receiver kept ready for P20-2,
# which collapses all fixed services onto the server tier.
nodeSelector: {}
tolerations: []

ingress:
  # P23-5: the participant-facing docs Ingress (brief-only root, ANY
  # authenticated participant, no host binding) was REMOVED —
  # templates/ingress.yaml no longer exists. That content (はじめに/ストーリー/
  # コマンド集/なぜ発火するか) is now folded into the unified portal's Home tab
  # (internal/scoreboard/view/home.go, docs-site/home-fragments.yaml). `enabled`
  # is kept here for now (harmless if platform's helmfile still sets it — an
  # unused values key does not error) but no longer gates anything in this
  # chart's templates; templates/ingress-admin.yaml now gates on `adminHost`
  # alone. Removing this key outright, and the now-unused authUrl below, is a
  # platform-coordinated follow-up (P19-2b) — see that ingress-admin.yaml
  # comment and the P23-5 task's platform-follow-up note; not done in this PR
  # to avoid an uncoordinated cross-repo values-shape change.
  enabled: true
  className: nginx
  host: docs.example.invalid
  tls: false
  # secretName for the TLS cert. Empty = rely on ingress-nginx's wildcard
  # default-ssl-certificate (local). Prod can set a name.
  tlsSecretName: ""
  # UNUSED as of P23-5 (was the removed participant Ingress's auth-url).
  # Kept only so platform's helmfile.gotmpl doesn't need an immediate edit;
  # see the `enabled` comment above for the coordinated-removal follow-up.
  authUrl: "http://oauth2-proxy.oauth2-proxy.svc.cluster.local:80/oauth2/auth"
  authSignin: ""
  # Extra annotations merged in (e.g. ssl-redirect in prod). Still used by
  # ingress-admin.yaml.
  annotations: {}
  # 運営用ビュー: the docs chart's ONLY remaining Ingress (P23-5). nginx
  # selects the admin root by the `docs-admin.` host prefix; the ingress
  # gates it with auth-policy /check-admin (same ADMIN_EMAILS allowlist as the
  # scoreboard reset). Empty adminHost disables this ingress entirely (no
  # ingress at all is then rendered by this chart).
  adminHost: ""
  adminAuthUrl: "http://auth-policy.auth-policy.svc.cluster.local:80/check-admin"
