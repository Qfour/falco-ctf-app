# docs chart values. Env-specific values (image tag, host, sign-in URL, TLS)
# are supplied by falco-ctf-platform's helmfile per environment.

replicas: 1

image:
  repository: docker.io/falco-ctf/docs
  # tag MUST be a git SHA in real deploys. Empty → Chart.appVersion.
  tag: ""
  pullPolicy: IfNotPresent

resources:
  requests: { cpu: 10m, memory: 24Mi }
  limits:   { cpu: 200m, memory: 128Mi }

# P20 node-tier pinning (fixed service). Empty = no scheduling constraint.
# vm-prod overlay supplies nodeSelector { ctf.falco/tier: server } + tolerations
# [ { key: ctf.falco/fixed-only, operator: Exists, effect: NoSchedule } ].
# Key names MUST match platform's vm-prod values. Scheduling only.
nodeSelector: {}
tolerations: []

ingress:
  enabled: true
  className: nginx
  host: docs.example.invalid
  tls: false
  # secretName for the TLS cert. Empty = rely on ingress-nginx's wildcard
  # default-ssl-certificate (local). Prod can set a name.
  tlsSecretName: ""
  # auth-url: ANY authenticated participant (oauth2-proxy directly, no host
  # binding). The participant host serves the brief-only root (no 想定解/解説).
  authUrl: "http://oauth2-proxy.oauth2-proxy.svc.cluster.local:80/oauth2/auth"
  authSignin: ""
  # Extra annotations merged in (e.g. ssl-redirect in prod).
  annotations: {}
  # 運営用ビュー: a second host serving the full root (brief + 想定解 + 解説).
  # nginx selects the admin root by the `docs-admin.` host prefix; the ingress
  # gates it with auth-policy /check-admin (same ADMIN_EMAILS allowlist as the
  # scoreboard reset). Empty adminHost disables the admin ingress.
  adminHost: ""
  adminAuthUrl: "http://auth-policy.auth-policy.svc.cluster.local:80/check-admin"
