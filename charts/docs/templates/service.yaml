apiVersion: v1
kind: Service
metadata:
  name: docs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "falco-ctf-common.labels" (dict "name" "docs" "managedBy" .Release.Service) | nindent 4 }}
spec:
  selector:
    {{- include "docs.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
