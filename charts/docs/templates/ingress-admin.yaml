{{/*
P23-5 removed the participant-facing docs Ingress (templates/ingress.yaml,
gated on the now-deleted .Values.ingress.enabled) — the participant content
it served (はじめに/ストーリー/コマンド集/なぜ発火するか) is now folded into the
unified portal's Home tab (see internal/scoreboard/view/home.go +
docs-site/home-fragments.yaml). This admin Ingress is the docs chart's ONLY
remaining Ingress, gated on adminHost alone.

P19-2b (single origin): adminHost is now expected to be the SAME value as
the scoreboard chart's `ingress.host` (e.g. both = app.<suffix>) — this
Ingress moves docs-admin from its own docs-admin.<suffix> subdomain onto a
PATH (`/docs-admin`) on that shared host, alongside the scoreboard's admin
(`/`) and participant (`/portal` etc.) Ingress objects. The fixed
`/docs-admin` path below MUST match docs-site/nginx.conf's `location
/docs-admin/` rewrite (that file's `alias` strips the prefix before hitting
the built admin site's filesystem root) — a mismatch here 404s the whole
admin docs site. pathType Prefix (not Exact) because mkdocs emits sub-pages
(missions/, assets/, etc.) that must all fall under this one path.
*/}}
{{- if .Values.ingress.adminHost }}
{{- if hasKey .Values.ingress "adminAuthUrl" }}
{{- fail "ingress.adminAuthUrl was removed (ADR-0034 D4): the docs-admin Ingress's auth-url is fixed to auth-policy /check-admin; delete the value" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docs-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "falco-ctf-common.labels" (dict "name" "docs" "managedBy" .Release.Service) | nindent 4 }}
  annotations:
    # 運営ゲート: auth-policy /check-admin (ADMIN_EMAILS のみ通過)。未ログインは
    # auth-signin へ。nginx 側は /docs-admin path prefix で想定解・解説ルートを返す。
    # ADR-0034 D4: endpoint は template に固定 (値では差し替えられない)。
    nginx.ingress.kubernetes.io/auth-url: "http://auth-policy.auth-policy.svc.cluster.local:80/check-admin"
    {{- with .Values.ingress.authSignin }}
    nginx.ingress.kubernetes.io/auth-signin: {{ . | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Preferred-Username"
    {{- /* The passthrough must not replace or weaken the identity-stamping gate
         (ADR-0034 D4). The whole nginx.ingress.kubernetes.io/auth- namespace is
         refused, not just auth-url / auth-response-headers: auth-cache-key and
         auth-cache-duration would reuse one caller's 200 (with its canonical
         identity headers) for another, or keep a revoked seat admitted for the
         cache period; auth-snippet and auth-proxy-set-headers change what the
         auth subrequest carries. Without X-Auth-Request-* from auth-policy the
         browser path is indistinguishable from the collector / falcosidekick
         path, so the internal-only 403s stop firing. Refuse at render time. */ -}}
    {{- range $k, $_ := (default dict $.Values.ingress.annotations) }}
    {{- if hasPrefix "nginx.ingress.kubernetes.io/auth-" (toString $k) }}
    {{- fail (printf "ingress.annotations must not set %s (every nginx.ingress.kubernetes.io/auth-* annotation is fixed by this chart: the auth gate is not overridable)" $k) }}
    {{- end }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.adminHost | quote }}
      http:
        paths:
          - path: /docs-admin
            pathType: Prefix
            backend:
              service:
                name: docs
                port:
                  number: 80
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.adminHost | quote }}
      {{- with .Values.ingress.tlsSecretName }}
      secretName: {{ . | quote }}
      {{- end }}
  {{- end }}
{{- end }}
