apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: collector
  labels:
    {{- include "falco-ctf-common.labels" (dict "name" "collector" "managedBy" .Release.Service) | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collector
        app.kubernetes.io/part-of: falco-ctf
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "falco-ctf-common.podSecurityContext" (dict) | nindent 8 }}
      {{- /* P20 node-tier pinning (fixed service). Empty defaults render nothing —
             unset = identical to prior render. See values.yaml for the vm-prod keys. */}}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: collector
          image: {{ include "falco-ctf-common.image" (dict "repository" .Values.image.repository "tag" .Values.image.tag "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "falco-ctf-common.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          env:
            # In-cluster scoreboard base URL the collector forwards to.
            - name: SCOREBOARD_URL
              value: {{ .Values.env.scoreboardUrl | quote }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
