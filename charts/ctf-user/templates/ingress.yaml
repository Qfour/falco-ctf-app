{{- if .Values.ingress.enabled }}
{{- if hasKey .Values.auth "enabled" }}
{{- fail "auth.enabled was removed (ADR-0034 D4): the workspace Ingress always carries the auth-policy gate; delete the value" }}
{{- end }}
{{- if hasKey .Values.auth "authUrl" }}
{{- fail "auth.authUrl was removed (ADR-0034 D4): the workspace Ingress's auth-url is fixed to auth-policy /check-workspace?host=<username>; delete the value" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ttyd
  namespace: {{ include "ctf-user.namespace" . }}
  labels:
    {{- include "ctf-user.labels" . | nindent 4 }}
  annotations:
    # ttyd uses websockets — keep connections open long enough for interactive shells.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # ttyd (libwebsockets) doesn't tolerate nginx's pooled keepalive connections;
    # without these, the first GET after a session keepalive stalls 15 s on
    # `upstream prematurely closed connection`. Disable buffering and keepalive
    # at the upstream side, retry on 502 immediately.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/upstream-keepalive-connections: "0"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502 http_504"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
    nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "5"
    # auth-policy front door (ADR-0034 D4): oauth2-proxy auth + the identity
    # roster (seat == this workspace's username). ALWAYS rendered: there is no
    # switch that produces a workspace Ingress without an auth gate (the former
    # `auth.enabled: false` did), and the endpoint is fixed here, not a value.
    nginx.ingress.kubernetes.io/auth-url: "http://auth-policy.auth-policy.svc.cluster.local:80/check-workspace?host={{ .Values.username | urlquery }}"
    nginx.ingress.kubernetes.io/auth-signin: {{ tpl .Values.auth.authSignin . | quote }}
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Preferred-Username"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ include "ctf-user.ingressHost" . }}
      # No secretName → ingress-nginx falls back to its `default-ssl-certificate`
      # (the cert-manager-issued wildcard for *.192.168.64.2.nip.io).
  rules:
    - host: {{ include "ctf-user.ingressHost" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ttyd
                port:
                  number: 80
{{- end }}
