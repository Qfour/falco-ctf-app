# ADR-0001 (Option B, Accepted): the only place flag values render into a
# manifest. Consumed exclusively by the `plant` initContainer in pod.yaml via
# `envFrom.secretRef` — the `challenge` container never references this
# Secret (ADR-0001 提案 I12). Key names are CTF_FLAG_<ID> (ID = challengeId
# upper-cased, `-` → `_`) so `envFrom` produces exactly the env var names
# plant.sh scripts already expect (see challenges/<id>/plant.sh).
#
# .Values.challenge.flags default is the FALCO{dev-...} placeholder map (I7:
# chart values stay environment-agnostic); real per-event values arrive via
# `deploy-user.sh --flags-file` as `--set-string challenge.flags.<id>=...`.
#
# security-engineer A5: scoped to .Values.challengeId, same reasoning the
# pre-Option-B challenge env injection used ("avoid leaking other missions'
# answers") — a single-mission deploy's Secret now carries only that
# mission's flag, not all of them. `challengeId=all` (the deploy-user.sh
# "all" workspace) still gets every flag, since `plant`'s seed script for
# that scope runs every mission's plant.sh and needs all of them. This does
# NOT change what's reachable (ctf-user's Role has no `secrets get`, so this
# was never participant-reachable either way — not a regression fix), just
# the blast radius for whatever cluster-admin-level principal *can* read
# Secrets in this namespace.
#
# P27-1 (scenario-scope mode, challengeId="scenario:<name>"): same blast-
# radius scoping, extended — only the flags map entries whose id is in
# .Values.scenario.missions (this scenario's own challenges: list, GENERATED
# by challenges/gen-values.sh from scenarios/<name>/scenario.yaml) render
# into the Secret. A flag for a challenge OUTSIDE the scenario never reaches
# this Secret at all, so it never reaches the `plant` initContainer's env
# either — not just "never planted", but never transiently present in any
# process's environment for this deploy.
apiVersion: v1
kind: Secret
metadata:
  name: ctf-flags
  namespace: {{ include "ctf-user.namespace" . }}
  labels:
    {{- include "ctf-user.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq .Values.challengeId "all" }}
  {{- range $id, $flag := .Values.challenge.flags }}
  CTF_FLAG_{{ $id | upper | replace "-" "_" }}: {{ $flag | quote }}
  {{- end }}
  {{- else if hasPrefix "scenario:" .Values.challengeId }}
  {{- range $id, $flag := .Values.challenge.flags }}
  {{- if has $id $.Values.scenario.missions }}
  CTF_FLAG_{{ $id | upper | replace "-" "_" }}: {{ $flag | quote }}
  {{- end }}
  {{- end }}
  {{- else if hasKey .Values.challenge.flags .Values.challengeId }}
  CTF_FLAG_{{ .Values.challengeId | upper | replace "-" "_" }}: {{ get .Values.challenge.flags .Values.challengeId | quote }}
  {{- end }}
