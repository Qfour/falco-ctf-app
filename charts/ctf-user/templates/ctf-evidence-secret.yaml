{{- /* ADR-0056 D11 (A5b): the evidence bundles (the investigate challenges'
       trace files), ONE Secret per challenge, `ctf-evidence-<cid>`, built from
       .Values.evidence.challenges.<cid>.files (key = file name, value = the
       file's content). Consumed by the `plant` initContainer ONLY, mounted
       readOnly at /opt/ctf/evidence-src/<cid> (templates/pod.yaml); `challenge`,
       `ttyd`, `ttyd-proxy` and `missions-scope` never reference it (the static
       check in scripts/check-flag-isolation.sh holds the Pod to that). It is a
       separate object from `ctf-flags` and carries no answers table.

       The default .Values.evidence.challenges is {}: nothing is rendered, and
       the output of every existing values file is unchanged. A key set that is
       not the set of plant.mounts[evidence: true] challenges, a file name
       outside ADR-0056 B2's grammar, more than 64 files or more than 512 KiB
       for one challenge is refused by the `fail`s in the named template
       ctf-user.evidence.check (_helpers.tpl).

       `data` (base64) rather than `stringData`: the bytes the Secret holds are
       exactly the value's bytes, whatever they contain, so the file the plant
       initContainer copies is the one a digest was taken of (ADR-0056 D9 / D11).
       A file name that YAML would read as a number or a boolean (`123`,
       `true`) is quoted for the same reason. */}}
{{- include "ctf-user.evidence.check" . }}
{{- range $i, $cid := (keys .Values.evidence.challenges | sortAlpha) }}
{{- if $i }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: ctf-evidence-{{ $cid }}
  namespace: {{ include "ctf-user.namespace" $ }}
  labels:
    {{- include "ctf-user.labels" $ | nindent 4 }}
type: Opaque
data:
  {{- range $name, $content := (get (get $.Values.evidence.challenges $cid) "files") }}
  {{ $name | quote }}: {{ $content | b64enc | quote }}
  {{- end }}
{{- end }}
