# workspace Pod = ttyd container (public via Service) + challenge container (private).
# Containers share the Pod network namespace; ttyd reaches challenge via in-cluster
# `kubectl exec` (its SA only allows pods/exec on this Pod by name).
#
# We use a Pod (not Deployment) on purpose:
#   - Static name "workspace" is required by RBAC resourceNames.
#   - Per-user state is ephemeral — if the Pod dies, the user is reset (intentional).
#   - `spec.securityContext` (and other Pod-level fields) are IMMUTABLE —
#     `helm upgrade` alone cannot apply changes here; the API server rejects
#     the patch. `deploy-user.sh` works around this by running
#     `kubectl delete pod workspace --ignore-not-found --wait=true` right
#     before `helm upgrade --install` (deploy-user.sh:212), which resets the
#     workspace (per-user state is ephemeral anyway, see above). That means
#     changes to this file are a stand-up-time change, not a LIVE hotfix —
#     never apply them mid-event, since every participant's workspace would
#     be wiped.
#
# ADR-0001 (Option B, Accepted): flags never enter the `challenge` container.
# A `plant` initContainer (same image as `challenge` — no new image, I5)
# receives the flags via the `ctf-flags` Secret (envFrom, secretRef) and
# writes them into the `plant-seed` emptyDir. `challenge` only ever sees the
# ENCLOSING DIRECTORY of each declared plant-target, bind-mounted (subPath)
# back onto its real path — never the seed volume root (F5: that would be an
# undeclared path outside the `sensitive_files` Falco macro's `fd.name`
# match, i.e. a free win for mission 03) and never the plant-target FILE
# itself (ADR-0007, supersedes ADR-0001's original per-file `subPath` mount —
# a file-destination mount makes the container runtime's own mount-setup
# trigger `open_read`-family Falco rules on every deploy; mounting the
# enclosing directory instead is structurally immune, since those rules
# require `fd.typechar='f'`). See
# docs/adr/0001-flag-plant-initcontainer-not-challenge-env.md and
# docs/adr/0007-plant-mount-directory-granularity.md.
apiVersion: v1
kind: Pod
metadata:
  name: workspace
  namespace: {{ include "ctf-user.namespace" . }}
  labels:
    {{- include "ctf-user.labels" . | nindent 4 }}
spec:
  serviceAccountName: ttyd
  # ADR-0001: no container gets the default token volume. ttyd is the only
  # container that needs in-cluster API access (`kubectl exec` into
  # challenge) and gets it via the explicit projected volume below instead —
  # `plant` and `challenge` never see a token (closes read-path 3: API-server
  # access to the Pod spec / Secret contents from inside the workspace).
  automountServiceAccountToken: false
  restartPolicy: Always
  enableServiceLinks: false
  securityContext:
    # root is intentional (CTF realism for the challenge container, see below)
    # but seccomp unconfined is NOT part of that intent — RuntimeDefault still
    # blocks the syscalls that would let a compromised workspace escape the
    # Pod (this is inherited by all containers, including initContainers —
    # k8s inherits seccompProfile per-FIELD, not per-block, so `plant` gets
    # this automatically too; ttyd/ttyd-proxy already set it explicitly
    # below, so this is a no-op for them and closes the gap for
    # challenge/plant).
    runAsNonRoot: false   # challenge intentionally runs as root for CTF realism
    seccompProfile:
      type: RuntimeDefault
  # ADR-0001 1-15: neither of these is set (shareProcessNamespace defaults to
  # false, hostPID is unset/false). Setting either would let a process in one
  # container observe another container's /proc/<pid>/environ — combined
  # with 1-14 (below) that would resurrect read-path 2 for `plant`'s
  # short-lived flag-bearing env even though `challenge` itself never has it.
  initContainers:
    - name: plant
      image: "{{ .Values.challenge.image.repository }}:{{ .Values.challenge.image.tag }}"
      imagePullPolicy: {{ .Values.challenge.image.pullPolicy }}
      # GENERATED by challenges/gen-values.sh from every evade mission's
      # plant.sh (challenges/<id>/plant.sh) that applies to this deploy —
      # see .Values.plant.seedScript. It never touches the real /etc/shadow
      # etc.: base data (where required) comes only from the build-time
      # snapshot baked into the image at /opt/ctf/plant-seed/ (ADR-0001 S-a),
      # so this initContainer never reads a sensitive path at runtime — it
      # has nothing to do with the Falco `sensitive_files` macro either way.
      command:
        {{- toYaml .Values.plant.seedScript | nindent 8 }}
      # Flags ONLY reach this container, and only via the Secret (never a
      # plaintext `value:` — Verification 1-10). `challenge` below has no
      # envFrom, no secretKeyRef, and no CTF_FLAG_* env at all.
      envFrom:
        - secretRef:
            name: ctf-flags
      volumeMounts:
        - name: plant-seed
          mountPath: /plant-seed
      # ADR-0001 1-14: intentionally NO `restartPolicy` key here.
      # `restartPolicy: Always` on an initContainer makes it a native
      # sidecar that runs alongside `challenge` for the Pod's whole
      # lifetime — a flag-bearing process would then stay alive in the
      # session, resurrecting read-path 2 via /proc/<pid>/environ from a
      # neighboring container. A plain (non-sidecar) initContainer runs to
      # completion and exits before `challenge` even starts.
    {{- if .Values.scenario.missions }}
    - name: missions-scope
      # P27-1 (REFACTORING.md): scenario-scope content isolation, separate
      # from `plant` above on purpose — this container carries NO secret
      # (no envFrom/ctf-flags), only copies non-sensitive, already
      # image-baked mission docs/fixtures, so it does not need to satisfy
      # ADR-0001's flag-isolation allowlist (challenges/gen-values.sh's
      # check_2_7) at all. Same image as `challenge` (I5, no new image) —
      # it already has the FULL /opt/ctf/missions/ tree baked in
      # (images/challenge/Dockerfile), so it can read the scenario's own
      # mission directories out of its OWN filesystem and copy them into
      # the missions-seed emptyDir the challenge container mounts below.
      # Ids NOT in .Values.scenario.missions are simply never copied — no
      # denylist to keep in sync, nothing to forget.
      image: "{{ .Values.challenge.image.repository }}:{{ .Values.challenge.image.tag }}"
      imagePullPolicy: {{ .Values.challenge.image.pullPolicy }}
      command:
        - sh
        - -c
        - |
          set -eu
          {{- range .Values.scenario.missions }}
          mkdir -p "/missions-seed/{{ . }}"
          cp -a "/opt/ctf/missions/{{ . }}/." "/missions-seed/{{ . }}/"
          {{- end }}
      volumeMounts:
        - name: missions-seed
          mountPath: /missions-seed
      # No `restartPolicy` here either, same reasoning as `plant` (1-14) —
      # this must run to completion and exit before `challenge` starts, not
      # linger as a sidecar.
    {{- end }}
  containers:
    - name: ttyd
      image: "{{ .Values.ttyd.image.repository }}:{{ .Values.ttyd.image.tag }}"
      imagePullPolicy: {{ .Values.ttyd.image.pullPolicy }}
      # ttyd does not need root; harden against post-compromise escalation.
      # The challenge container intentionally keeps its CTF-realistic posture.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      ports:
        # P23-3: ttyd itself is loopback-only (TTYD_INTERFACE=127.0.0.1 below)
        # and no longer Ingress-reachable — the ttyd-proxy sidecar owns the
        # published port (see below). containerPort is declarative-only here
        # (no Service binds to it directly) but kept for documentation. Named
        # distinctly from the proxy's "http" port below — duplicate port
        # names across containers in one Pod trigger a k8s admission warning
        # and make name-based Service/probe port resolution ambiguous.
        - name: ttyd-upstream
          containerPort: {{ .Values.ttyd.upstreamPort }}
          protocol: TCP
      env:
        - name: TTYD_PORT
          value: "{{ .Values.ttyd.upstreamPort }}"
        - name: TTYD_INTERFACE
          value: "127.0.0.1"
        - name: TTYD_TARGET_CONTAINER
          value: "challenge"
        # Participant-facing front (P11.5). ttyd carries it so any helper run in
        # the ttyd container (or copied into the shell) resolves the same target.
        - name: FALCO_CTF_COLLECTOR
          value: "{{ .Values.collector.url }}"
      resources:
        {{- toYaml .Values.ttyd.resources | nindent 8 }}
      # P23-3: readinessProbe.tcpSocket/httpGet always dial the Pod IP, never
      # the container's own loopback — so a tcpSocket probe against
      # 127.0.0.1-bound ttyd would connect from outside the netns and fail
      # (kubelet's probe is not itself inside the container's network
      # namespace the way an exec probe is). Use an exec probe instead: curl
      # runs inside the ttyd container's netns, so 127.0.0.1 resolves to
      # ttyd's own loopback correctly. curl is already installed (see the
      # Dockerfile's apk add list).
      readinessProbe:
        exec:
          command:
            - curl
            - --fail
            - --silent
            - --output
            - /dev/null
            - http://127.0.0.1:{{ .Values.ttyd.upstreamPort }}/
        initialDelaySeconds: 2
        periodSeconds: 5
      # With readOnlyRootFilesystem above, kubectl can't write its discovery
      # cache to $HOME/.kube/cache and libwebsocket has nowhere to scratch.
      # Two tmpfs emptyDirs give ttyd the few scratch paths it needs.
      # ADR-0001: `automountServiceAccountToken: false` at the Pod level
      # means ttyd no longer gets a token volume for free — it needs
      # `kubectl exec` to reach the API server, so it gets an explicit
      # projected volume (below) at the exact path the in-cluster config
      # loader expects (images/ttyd/entrypoint.sh:16-17).
      volumeMounts:
        - name: ttyd-home
          mountPath: /home/ttyd
        - name: ttyd-tmp
          mountPath: /tmp
        - name: ttyd-sa-token
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true

    - name: ttyd-proxy
      # P23-3: CSP frame-ancestors reverse proxy in front of ttyd. This is the
      # container the Ingress/Service actually reach (port .Values.ttyd.port);
      # ttyd itself moved to a loopback-only port above. See
      # cmd/ttyd-proxy, internal/ttydproxy, and the cross-repo wiring contract
      # in .claude/rules/falco-ctf-app-conventions.md.
      image: "{{ .Values.ttyd.proxy.image.repository }}:{{ .Values.ttyd.proxy.image.tag }}"
      imagePullPolicy: {{ .Values.ttyd.proxy.image.pullPolicy }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      ports:
        - name: http
          containerPort: {{ .Values.ttyd.port }}
          protocol: TCP
      env:
        - name: LISTEN_ADDR
          value: ":{{ .Values.ttyd.port }}"
        - name: UPSTREAM_ADDR
          value: "http://127.0.0.1:{{ .Values.ttyd.upstreamPort }}"
        - name: FRAME_ANCESTORS
          value: "{{ .Values.ttyd.frameAncestors }}"
      resources:
        {{- toYaml .Values.ttyd.proxy.resources | nindent 8 }}
      readinessProbe:
        tcpSocket:
          port: http
        initialDelaySeconds: 2
        periodSeconds: 5

    - name: challenge
      image: "{{ .Values.challenge.image.repository }}:{{ .Values.challenge.image.tag }}"
      imagePullPolicy: {{ .Values.challenge.image.pullPolicy }}
      command: ["sleep", "infinity"]
      env:
        - name: FALCO_CTF_USER
          value: "{{ .Values.username }}"
        - name: FALCO_CTF_CHALLENGE
          value: "{{ .Values.challengeId }}"
        # P11.5 full one-pipe: the workspace reaches the scoreboard ONLY via the
        # collector. FALCO_CTF_COLLECTOR is the canonical target for submit / me /
        # display-name / exfil. FALCO_CTF_SCOREBOARD is kept for backward compat
        # with older helper scripts, but now points at the collector too — the
        # scoreboard Service is unreachable once egress lockdown is on.
        - name: FALCO_CTF_COLLECTOR
          value: "{{ .Values.collector.url }}"
        - name: FALCO_CTF_SCOREBOARD
          value: "{{ .Values.collector.url }}"
        - name: FALCO_CTF_DNS_SUFFIX
          value: "{{ .Values.dnsSuffix }}"
        {{- /* ADR-0001: no CTF_FLAG_* here — flags never reach this
               container (I12). Only the `plant` initContainer above sees
               them, via the ctf-flags Secret. */}}
        {{- /* Verification 1-12 (negative test): extraEnv is the one
               challenge-container field .Values controls directly, so it's
               also the one place a future values change could reintroduce
               a flag env var without touching this template. The allowlist
               static assert (scripts/check-flag-isolation.sh) catches this
               post-render, but failing at template time here is strictly
               fail-closed — `helm template`/`helm upgrade` itself refuses
               to produce the manifest at all. */}}
        {{- range .Values.challenge.extraEnv }}
        {{- if hasPrefix "CTF_FLAG_" (.name | default "") }}
        {{- fail (printf "ADR-0001 I12 violation: challenge.extraEnv[].name=%q starts with CTF_FLAG_ — flags must never reach the challenge container (Verification 1-12)" .name) }}
        {{- end }}
        {{- end }}
        {{- with .Values.challenge.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      resources:
        {{- toYaml .Values.challenge.resources | nindent 8 }}
      {{- with .Values.challenge.postStart }}
      # ADR-0001: retired as the flag-planting mechanism (that's `plant`
      # above now) — this hook is kept as a general-purpose extension point
      # (nothing in the generated values sets it anymore). Whatever ends up
      # here later is still deploy-path — the same "0 Falco events" bar (§F3′
      # in the ADR) applies to it as to `plant`'s seed script.
      lifecycle:
        postStart:
          exec:
            command:
              {{- toYaml . | nindent 14 }}
      {{- end }}
      # ADR-0001 + ADR-0007 (Option 1): only the declared plant-target
      # ENCLOSING DIRECTORIES are mounted (never a single file — a
      # file-destination bind mount makes the container runtime's own
      # mount-setup trigger open_read-family Falco rules on every deploy,
      # see docs/adr/0007-plant-mount-directory-granularity.md §C2), each
      # pinned to its own subPath on the shared `plant-seed` volume — never
      # the seed volume root (F5). `.Values.plant.mounts` is now a list of
      # {path, readOnly} objects (per-mount, not a single blanket flag) —
      # readOnly is false ONLY for the mount(s) a mission genuinely needs to
      # write into at runtime (currently /etc, for mission 09's
      # `ln .../etc/sudoers /etc/.cache.bak`; see
      # challenges/03-stealth-read/plant.sh's `plant-mount-readonly` header
      # and challenges/gen-values.sh). Mission 05's /root/.ssh mount stays
      # readOnly: true. Omitted entirely (no `volumeMounts:` key) when
      # .Values.plant.mounts is empty, e.g. a values file for a
      # trigger-only challenge that plants nothing.
      {{- if or .Values.plant.mounts .Values.scenario.missions }}
      volumeMounts:
        {{- range .Values.plant.mounts }}
        - name: plant-seed
          mountPath: {{ .path | quote }}
          subPath: {{ trimPrefix "/" .path | quote }}
          readOnly: {{ .readOnly }}
        {{- end }}
        {{- if .Values.scenario.missions }}
        # P27-1: replaces the image-baked /opt/ctf/missions/ tree (which has
        # ALL challenge ids, see images/challenge/Dockerfile) with the
        # `missions-scope` initContainer's filtered copy — mounting the
        # WHOLE directory (no subPath) intentionally shadows every id the
        # image baked in, not just the ones missions-scope wrote, so an
        # out-of-scenario id is absent, not merely overlaid. Writable
        # (no readOnly key, matches the pre-P27-1 baked-in directory's own
        # writability — participants could always edit fixtures in place).
        - name: missions-seed
          mountPath: /opt/ctf/missions
        {{- end }}
      {{- end }}

  volumes:
    - name: ttyd-home
      emptyDir:
        sizeLimit: 16Mi
    - name: ttyd-tmp
      emptyDir:
        sizeLimit: 32Mi
    # ADR-0001: seed volume `plant` writes into and `challenge` mounts
    # individual subPaths from. Never mounted whole into `challenge` (F5).
    - name: plant-seed
      emptyDir:
        sizeLimit: 4Mi
    {{- if .Values.scenario.missions }}
    # P27-1: scenario-scope copy target for `missions-scope` above — never
    # mounted whole into anywhere else, only at /opt/ctf/missions in
    # `challenge` (see that container's volumeMounts). Sized for a handful
    # of mission dirs' fixtures+README+falco-rule.yaml (a few hundred KB
    # each at most); bump if a future mission ships large fixtures.
    - name: missions-seed
      emptyDir:
        sizeLimit: 64Mi
    {{- end }}
    # ADR-0001: the SA token, scoped to ttyd only (see automountServiceAccountToken
    # above). Same 3 sources the API server would auto-project by default
    # (serviceAccountToken + the cluster's kube-root-ca.crt ConfigMap +
    # the namespace, via downwardAPI) — this chart just makes the mount
    # explicit and container-scoped instead of Pod-wide.
    - name: ttyd-sa-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3607
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
          - downwardAPI:
              items:
                - path: namespace
                  fieldRef:
                    fieldPath: metadata.namespace
