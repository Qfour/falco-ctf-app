apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "ctf-user.namespace" . }}
  labels:
    {{- include "ctf-user.labels" . | nindent 4 }}
    # Pod Security Admission — enforce `baseline` (the challenge container
    # intentionally runs as root for CTF realism, which `restricted` would
    # reject). audit/warn at `restricted` so operators see what extra
    # hardening would be possible if challenge changes its model.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
