{{- if .Values.networkPolicy.enabled }}
# Workspace NetworkPolicy.
#
# Ingress: only ingress-nginx may reach ttyd port. The challenge container
# exposes nothing externally; its only entry is in-Pod `kubectl exec` from
# the ttyd container.
#
# Egress (opt-in via networkPolicy.egress.enabled): kube-dns + the collector
# Service + the Kubernetes API server only (P11.5). The workspace reaches the
# scoreboard ONLY through the collector; scoreboard(:8000) is deliberately not
# allowed anywhere here, so a compromised challenge container cannot forge
# /falco/events or hit the scoreboard's internal endpoints directly.
# `apiServerCidr` must be set to the real apiserver endpoint CIDR or ttyd's
# `kubectl exec` to challenge will be blocked.
#
# `apiServerClusterIP` (ADR-WS-0005 enforcement fix, 2026-09-01 Bottlerocket
# PoC finding): in-cluster `kubectl` (what ttyd uses) always dials the
# `kubernetes.default` Service ClusterIP (`$KUBERNETES_SERVICE_HOST`), never
# the apiserver's real VPC/ENI address that `apiServerCidr` authorizes. Once
# VPC CNI NetworkPolicy agent enforcement is ON (ADR-WS-0005), egress is
# evaluated PRE-DNAT against that ClusterIP — which sits in the cluster's
# service CIDR, a separate non-routed range OUTSIDE the VPC CIDR — so
# `apiServerCidr` alone no longer covers `kubectl exec` traffic and it times
# out. This second ipBlock closes that gap without widening the lockdown to
# the whole service CIDR (deploy-user.sh derives and passes exactly the
# single ClusterIP /32).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-ingress
  namespace: {{ include "ctf-user.namespace" . }}
  labels:
    {{- include "ctf-user.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ctf-user.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.ttyd.port }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    # kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # collector Service (the ONLY path to the scoreboard). Selected by
    # namespace+pod label — no ipBlock (P11.5): the workspace fronts submit /
    # me / display-name / exfil here; scoreboard(:8000) is never reachable.
    # Egress NP filters post-DNAT, so target the collector Pod's container port.
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: collector
          podSelector:
            matchLabels:
              app.kubernetes.io/name: collector
      ports:
        - protocol: TCP
          port: 8000
    {{- with .Values.networkPolicy.egress.apiServerCidr }}
    # Kubernetes API server (required for ttyd's `kubectl exec`).
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    {{- end }}
    {{- with .Values.networkPolicy.egress.apiServerClusterIP }}
    # Kubernetes API service ClusterIP — see comment block above. Single
    # /32, port 443 only (the `kubernetes` Service in `default` always
    # listens on 443 regardless of the real apiserver port).
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
  {{- end }}
{{- end }}
