# ctf-user — per-user CTF workspace
# Namespace = ctf-<username>; Pod = workspace (containers: ttyd + ttyd-proxy + challenge)

username: user1
challengeId: "01-read-shadow"

# collector — the participant-facing front (P11.5 full one-pipe). The workspace
# reaches the scoreboard ONLY through this URL: submit / me / display-name are
# forwarded, the boss exfil drop is rewritten to the scoreboard's internal sink.
# Injected as FALCO_CTF_COLLECTOR into both workspace containers. Base URL of the
# collector Service (default = in-cluster ClusterIP:80). Platform helmfile
# overrides per environment if the Service name/namespace differs.
collector:
  url: "http://collector.collector.svc:80"

# DNS suffix used for the workspace host. Override per-environment via
# deploy-user.sh --dns-suffix (default falls back to colima nip.io label).
dnsSuffix: "ctf-event.dev"

ttyd:
  image:
    # Registry placeholder (public repo). Real registry (ECR) is supplied at
    # deploy time via helmfile / deploy-user.sh --set ttyd.image.repository=...
    # NOTE: repo path uses `/` not `-` so the scoreboard ingest substring
    # check (`falco-ctf/challenge`) on the challenge sibling image matches.
    repository: docker.io/falco-ctf/ttyd
    tag: dev
    pullPolicy: IfNotPresent
  # port = the Ingress/Service-reachable port. Since P23-3, this is where
  # ttyd-proxy listens (not ttyd itself — see upstreamPort below). Kept the
  # same name/value (7681) so Service.targetPort / NetworkPolicy wiring below
  # needs no change.
  port: 7681
  # upstreamPort = ttyd's own loopback-only port (P23-3 clickjacking
  # mitigation). ttyd binds 127.0.0.1:<upstreamPort> and is unreachable except
  # via the ttyd-proxy sidecar on .Values.ttyd.port.
  upstreamPort: 7682
  # frameAncestors = the CSP `frame-ancestors` source list ttyd-proxy stamps
  # on every ttyd response. Fail-safe default "'none'" (I7: env-agnostic
  # default). ctf-user is NOT a platform helmfile release (it's deployed via
  # deploy-user.sh, not helmfile), so there is no helmfile values layer to
  # supply the real portal origin. Override today via
  # `deploy-user.sh --frame-ancestors <value>`, set to the portal's OWN
  # origin (P23-4: the portal now iframes ttyd from its Terminal tab, so this
  # must be the origin the participant's browser sees /portal served from —
  # P19-2b: single origin, e.g. "https://app.<dnsSuffix>"). Platform's
  # deploy-event-workspaces.sh passes this through to deploy-user.sh
  # (P19-2a) so operators don't have to set it by hand per user.
  frameAncestors: "'none'"
  proxy:
    image:
      # Registry placeholder (public repo), same convention as ttyd/challenge
      # above. Real registry + git-SHA tag supplied at deploy time (I4/I7).
      repository: docker.io/falco-ctf/ttyd-proxy
      tag: dev
      pullPolicy: IfNotPresent
    # Minimal footprint — this sidecar runs once per participant workspace
    # (10+ pods resident during an event) and only proxies HTTP/WebSocket
    # bytes through, no CTF logic.
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits:   { cpu: 100m, memory: 64Mi }
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { cpu: 200m, memory: 128Mi }

challenge:
  image:
    # scoreboard ingest filters events whose container.image.repository does
    # NOT contain `falco-ctf/challenge` (defense-in-depth). Keep the `/`.
    # Registry supplied at deploy time (see ttyd note).
    repository: docker.io/falco-ctf/challenge
    tag: dev
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }
  # Mission briefs / fixtures are baked into the challenge image at
  # /opt/ctf/missions/<id>/ (challenge Dockerfile COPY challenges/) — no
  # per-deploy ConfigMap injection.
  # extraEnv: list of {name, value} injected into the challenge container.
  extraEnv: []
  # postStart: optional argv that runs once after container start.
  # ADR-0001 (Option B, Accepted): retired as the flag-planting mechanism —
  # flags are now delivered by the `plant` initContainer (see `plant:` below
  # and templates/pod.yaml). Kept as a general-purpose extension point; no
  # generated values set it anymore.
  postStart: []

  # flags: challengeId -> flag value. NEVER injected into this container
  # (ADR-0001 I12) — only the `plant` initContainer sees these, via the
  # `ctf-flags` Secret (templates/ctf-flags-secret.yaml), which is rendered
  # from this same map.
  #
  # Defaults below are the FALCO{dev-...} placeholders; they MUST match the
  # falco-ctf-app falco-rule.yaml placeholders so local end-to-end submit works.
  # Real per-event flags are passed at deploy via deploy-user.sh --flags-file
  # (rendered from events/<date>/flags.sops.yaml).
  flags:
    03-stealth-read: FALCO{dev-stealth-read}
    05-silent-search: FALCO{dev-silent-search}
    10-final-exfil: FALCO{dev-final-exfil}

# plant: the initContainer that seeds flags into planted files (ADR-0001
# Option B). GENERATED by challenges/gen-values.sh from every evade mission's
# plant.sh that applies to this deploy — see challenges/<id>/values.yaml
# (single-mission) and challenges/values-all.yaml (all-missions), passed via
# deploy-user.sh's `-f`. DO NOT hand-edit the two fields below; the defaults
# here are only reached when no per-challenge overlay is applied (e.g. a
# trigger-only challengeId with no plant.sh) — a no-op initContainer that
# mounts nothing.
plant:
  seedScript:
    - sh
    - -c
    - "true"
  # mounts: deduped list of {path, readOnly} — path is the ENCLOSING
  # DIRECTORY of each declared plant-target (ADR-0007; the plant-target
  # itself when it's already a directory, e.g. mission 05's /root/.ssh),
  # bind-mounted (subPath) from the `plant-seed` emptyDir onto the challenge
  # container's real path. NEVER the seed volume root (F5) and NEVER a bare
  # file (ADR-0007). readOnly is per-mount (false only where a mission
  # genuinely needs runtime writes, e.g. /etc for mission 09's hardlink
  # target — see challenges/gen-values.sh).
  mounts: []

# scenario: scenario-scope mode (P27-1, REFACTORING.md). GENERATED by
# challenges/gen-values.sh from scenarios/<name>/scenario.yaml — see
# challenges/values-scenario-<name>.yaml, passed via deploy-user.sh's `-f`
# for a `scenario:<name>` challenge-id.
#
# missions: the scenario's own ordered challenge-id list (INCLUDING
# trigger-only ids that have no plant.sh — everything the scenario lists).
# When non-empty, templates/pod.yaml adds a `missions-scope` initContainer
# that copies ONLY these ids' directories out of the image-baked
# /opt/ctf/missions/ tree into a fresh emptyDir, and mounts that emptyDir
# OVER /opt/ctf/missions in the challenge container — so a challenge id NOT
# in this list (its fixtures/README/falco-rule.yaml) is never reachable
# from inside the participant's shell, regardless of what the whole
# challenges/ tree the image bakes in (images/challenge/Dockerfile's
# guided-event "bake everything" decision, unchanged for "all"/single-
# challenge mode — see that Dockerfile's comment).
#
# Default empty list = "no scenario restriction": back-compat with the
# existing "all"/single-challenge deploy-user.sh modes, which must render
# byte-identical Pod specs to before this field existed (no missions-scope
# initContainer, no extra volume/volumeMount — see templates/pod.yaml's
# `{{- if .Values.scenario.missions }}` guards).
scenario:
  missions: []

ingress:
  enabled: true
  className: nginx
  # Default host pattern is `<username>.<dnsSuffix>`. Override per-user in CI
  # / ops by passing --set ingress.host=... or --set dnsSuffix=...
  host: "{{ .Values.username }}.{{ .Values.dnsSuffix }}"

# oauth2-proxy front-door + host↔email binding via the in-cluster auth-policy
# service. Each user's Ingress points auth-url at
# `auth-policy/check?host=<username>`; auth-policy forwards the cookie to
# oauth2-proxy /oauth2/auth, reads X-Auth-Request-Email, and returns 200 only
# if the email belongs to the matching user.
#
# Why not point auth-url straight at oauth2-proxy? Because that lets any
# logged-in Dex user reach any workspace.
auth:
  enabled: true
  authUrl: "http://auth-policy.auth-policy.svc.cluster.local:80/check?host={{ .Values.username }}"
  # appHost = the single-origin participant app host (P19-2b, e.g.
  # "app.<dnsSuffix>") that fronts oauth2-proxy's /oauth2/start sign-in page.
  # ctf-user is NOT a platform helmfile release (it's deployed via
  # deploy-user.sh, not helmfile), so there is no helmfile values layer to
  # supply this — override via `deploy-user.sh --app-host <host>` (same
  # passthrough shape as `--frame-ancestors` above / `PORTAL_TTYD_SUFFIX`:
  # platform's deploy-event-workspaces.sh forwards it per-user so operators
  # don't set it by hand — see falco-ctf-app-conventions.md's Cross-repo
  # 契約 table once wired). Empty default falls back to the legacy
  # `auth.<dnsSuffix>` compat-bridge host (app#99 follow-up target for
  # removal) so unconfigured/local deploys keep working unchanged — this is
  # fail-soft UX only (a stale sign-in redirect just 404s/misdirects), it
  # does NOT touch `authUrl`'s prefix-exact host↔email check above (I8
  # unaffected).
  appHost: ""
  authSignin: 'http://{{ .Values.auth.appHost | default (printf "auth.%s" .Values.dnsSuffix) }}/oauth2/start?rd=$scheme://$host$escaped_request_uri'

networkPolicy:
  enabled: true
  # When true, the chart also restricts egress to kube-dns + the Kubernetes
  # API server, preventing the challenge container from reaching cluster-
  # internal services like the scoreboard webhook endpoint.
  #
  # Opt-in because the apiServerCidr below must point at the real apiserver
  # endpoint; getting this wrong breaks ttyd's `kubectl exec` reachability.
  # In prod (EKS), Terraform should set apiServerCidr from the cluster's
  # endpoint CIDR.
  egress:
    enabled: false
    apiServerCidr: ""
