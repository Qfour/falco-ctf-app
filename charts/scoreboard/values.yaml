# scoreboard chart values. Env-specific values (image tag, host, storageClass,
# flags secret) are supplied by falco-ctf-platform's helmfile per environment.

# Invariant I1: scoreboard is single-writer (SQLite). Do not raise.
replicas: 1

image:
  repository: docker.io/falco-ctf/scoreboard
  # tag MUST be a git SHA in real deploys (Invariant I4). Empty → Chart.appVersion.
  tag: ""
  pullPolicy: IfNotPresent

env:
  challengesDir: /app/challenges
  dbPath: /var/lib/scoreboard/scoreboard.db
  # Restrict scoring + dashboard to one event composition. Path to a baked
  # scenario manifest, e.g. /app/scenarios/killchain-2h/scenario.yaml.
  # Empty = all challenges.
  scenarioFile: ""
  # Comma-separated admin emails — gates POST /api/admin/reset (verified
  # against the auth-policy-propagated X-Auth-Request-Email). Empty = nobody.
  # Use the same list as auth-policy's ADMIN_EMAILS.
  adminEmails: ""
  # P23-2 CSRF mitigation: comma-separated allowlist of browser origins
  # (exact scheme://host[:port], no path/trailing slash — e.g.
  # "https://scoreboard.ctf.example.com,https://journey.ctf.example.com")
  # permitted to call the browser-facing state-changing routes (POST
  # /api/admin/*, /api/challenges/{cid}/submit[-detect], /api/users/{user}/...
  # writes). Checked against the request's Origin (falling back to Referer's
  # origin); Host/X-Forwarded-Host are never trusted. See
  # internal/scoreboard/originguard.
  #   EMPTY (default here) = every guarded POST is DENIED (fail-closed). This
  #   is a brand-new control with no safe environment-agnostic default (I7 —
  #   a real domain cannot be hardcoded in this chart), so the placeholder
  #   deliberately fails closed rather than guessing a permissive default that
  #   could silently under-protect a real deployment. The platform helmfile
  #   MUST set this to the real scoreboard/journey host(s) before go-live;
  #   local dev (docker-compose, not this chart) sets it to
  #   http://localhost:8000 so the bundled dashboard keeps working.
  allowedOrigins: ""
  # Origin of the participant docs site (a separate host). When set, the
  # /journey API rewrites each mission's relative docsUrl into an absolute URL
  # so the "詳細ブリーフィング (docs)" link resolves off-origin. Format:
  # https://docs.<suffix> (no trailing slash required — normalised either way).
  # Empty = keep the relative path (local dev). Supplied by platform helmfile.
  docsBaseUrl: ""
  # P23-4: DNS suffix the portal's Terminal pane uses to build each caller's
  # OWN ttyd iframe src (`https://<derived-username>.<portalTtydSuffix>` —
  # see internal/scoreboard/view/portal.go's ttydURLFor). MUST equal
  # charts/ctf-user's `dnsSuffix` value (that chart's per-user ttyd Ingress
  # host is `<username>.<dnsSuffix>` too) or the iframe points at the wrong
  # host. Empty (default) = the Terminal pane renders its fail-safe "not
  # configured" placeholder instead of an iframe (I7: no environment-agnostic
  # default to guess). Real value is P19-dependent:
  #   - local/PoC (colima): the same "<ip>.nip.io"-style suffix passed to
  #     `charts/ctf-user/deploy-user.sh --dns-suffix`.
  #   - prod: once P19 lands a single participant-facing origin, this becomes
  #     that origin's wildcard suffix. Until then, operators wire this by
  #     hand alongside `deploy-user.sh --dns-suffix` / `--frame-ancestors`
  #     (see charts/ctf-user/values.yaml's ttyd.frameAncestors — the portal's
  #     OWN origin must also be passed there so the ttyd-proxy CSP allows the
  #     iframe).
  portalTtydSuffix: ""
  # Points policy (#40 self-service hints with a leaderboard-affecting score).
  # SCORE_POINTS_PER_SOLVE = base award per solved challenge;
  # SCORE_HINT_PENALTY = points forfeited per self-revealed Journey hint.
  # Both are event-tuning knobs (content-lead / CEO decision).
  #   Empty string ("") = env omitted → the code placeholder defaults (100 / 10).
  #   0 (or "0")        = env emitted as "0" → the value is honoured verbatim
  #                       (e.g. scoreHintPenalty: 0 for a hints-free event).
  # The template gates on `ne (toString ...) ""` precisely so an integer 0 is NOT
  # dropped as falsy (a `with` block would). A negative penalty is floored to 0
  # inside the scoring layer (fail-closed: a hint reveal can never raise a score).
  # Real per-event values are supplied by the platform helmfile.
  scorePointsPerSolve: ""
  scoreHintPenalty: ""

  # #44.1 detect-challenge grading (type: detect). The scoreboard image is
  # distroless + falco-free, so grading is delegated to a runner:
  #   * detectRunner=off (default) → detect submissions return 503 (the prod
  #     image cannot run Falco in-process). Local dev may set "local".
  #   * detectRunner=k8s → the scoreboard creates a per-submission Kubernetes
  #     Job in the grader namespace (needs its SA token; the deployment mounts
  #     the token only in this case). Requires the two keys below to be set.
  # detectGraderNamespace = the dedicated grader ns the platform creates (Job +
  # condition Secret live only there). MUST equal the platform detect-grader
  # release namespace or the runner's strict authenticity check silently no-solves.
  # detectGraderImage = digest-pinned grader image ref. Left EMPTY here (I7:
  # env-specific registry/digest); the platform helmfile supplies the real
  # ..../falco-ctf/detect-grader@sha256:<digest>. Key names match the platform
  # helmfile keys (detectRunner/detectGraderNamespace/detectGraderImage).
  detectRunner: ""
  detectGraderNamespace: ""
  detectGraderImage: ""

persistence:
  size: 1Gi
  # local: local-path, prod (EKS): gp3. Unset → cluster default.
  storageClassName: ""

# Real per-event flags. When enabled, mount a Secret as FLAGS_FILE so
# ApplyFlagOverrides replaces the FALCO{dev-...} placeholders baked into the
# image. The Secret is created by the platform from events/<date>/flags.sops.yaml
# (key: flags.yaml). Disabled = use the dev placeholders (local).
flagsSecret:
  enabled: false
  name: scoreboard-flags
  key: flags.yaml

ingress:
  enabled: true
  className: nginx
  host: scoreboard.example.invalid
  tls: false
  # secretName for the TLS cert. Empty = rely on ingress-nginx's wildcard
  # default-ssl-certificate (local). Prod sets a name (e.g. scoreboard-tls)
  # paired with a cert-manager issuer annotation below.
  tlsSecretName: ""
  # Per-environment oauth2-proxy sign-in URL for the admin gate. Empty = omit.
  authSignin: ""
  # Extra annotations merged in (e.g. cert-manager issuer, ssl-redirect in prod).
  annotations: {}

  # P18 participant journey host (a SECOND ingress off the same scoreboard
  # Service), gated by ANY authenticated login (not /check-admin). The
  # scoreboard self-scopes reads off the forwarded X-Auth-Request-Email.
  # Empty journeyHost = the journey ingress is not rendered (local dev / any env
  # that does not stand up a participant host). Real values are supplied by the
  # platform helmfile (key names MUST match platform feat/p18-journey-host:
  # journeyHost / journeyAuthUrl / journeyAnnotations).
  journeyHost: ""
  # oauth2-proxy any-login auth subrequest (e.g. https://<suffix>/oauth2/auth).
  journeyAuthUrl: "http://oauth2-proxy.example.invalid/oauth2/auth"
  # Extra annotations for the journey ingress ONLY. Kept separate from
  # `annotations` on purpose: the shared block may carry a cert-manager issuer /
  # per-host secretName which would make the journey host issue a redundant
  # Let's Encrypt cert instead of riding the wildcard default-ssl-certificate.
  journeyAnnotations: {}

# P20 node-tier pinning. Empty = no scheduling constraint (EKS / local render
# unchanged). On the VM k3s substrate the platform vm-prod overlay supplies:
#   nodeSelector:
#     node-role.kubernetes.io/control-plane: "true"   # label k3s server auto-applies
#   tolerations:
#     - key: "ctf.falco/fixed-only"
#       operator: "Equal"
#       value: "true"
#       effect: "NoSchedule"
# so the (I1 state-pinned) scoreboard tolerates the server taint and lands on
# the k3s server node. Key names MUST match platform's vm-prod values
# (nodeSelector / tolerations). NOTE: there is NO ctf.falco/tier label — the
# platform cloud-init only taints the server; it selects via the built-in
# control-plane label. Scheduling only — does not touch securityContext (I2/I3)
# or replicas/strategy (I1).
nodeSelector: {}
tolerations: []

resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits:   { cpu: 200m, memory: 256Mi }

# Prod hardening — off by default (local), enabled via helmfile prod env.
podDisruptionBudget:
  enabled: false   # maxUnavailable: 0 (replicas=1; block voluntary drains)

# NOTE: The scoreboard S3 SQLite backup CronJob was removed (P11, CEO decision
# 2026-07-13). Backup is now handled exclusively by EBS volume snapshots at the
# infrastructure layer (see falco-ctf-platform operations.md), so the chart no
# longer carries an S3 backup path, its IRSA ServiceAccount, or egress policy.

monitoring:
  enabled: false                   # needs Prometheus Operator CRDs
  prometheusReleaseLabel: kube-prometheus-stack
