# scoreboard NetworkPolicies — default-deny + scoped ingress for the audiences
# that legitimately reach this Pod. See AGENTS.md threat model (Falco webhook
# authenticity): without this, any cluster pod could POST forged events.
{{ include "falco-ctf-common.networkPolicy.defaultDeny" (dict "name" "scoreboard" "namespace" "scoreboard") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scoreboard-allow
  namespace: scoreboard
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: scoreboard
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # falcosidekick webhook → /falco/events
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: falco
      ports:
        - protocol: TCP
          port: 8000
    # dashboard / API / metrics from ingress-nginx
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    # collector → participant surface (submit / me / display-name) + the
    # internal exfil sink /internal/exfil/{cid} (P11.5 full one-pipe). Workspaces
    # NEVER reach the scoreboard directly: with egress lockdown on, ctf-user can
    # only talk to the collector, which fronts and forwards here. The old
    # `from: ctf-user` allow is intentionally removed — allowing it back would
    # let a workspace forge /falco/events or hit /internal/exfil directly.
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: collector
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # kube-dns only — the scoreboard never originates outbound traffic.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
