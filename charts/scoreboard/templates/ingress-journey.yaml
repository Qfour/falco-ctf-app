{{- if and .Values.ingress.enabled .Values.ingress.journeyHost }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scoreboard-journey
  namespace: scoreboard
  labels:
    {{- include "falco-ctf-common.labels" (dict "name" "scoreboard" "managedBy" .Release.Service) | nindent 4 }}
  annotations:
    # P18 participant gate: ANY authenticated login (oauth2-proxy /oauth2/auth
    # directly — no host<->email binding, no admin allowlist). The scoreboard
    # self-scopes reads off the forwarded X-Auth-Request-Email.
    #
    # P19-2b: `.Values.ingress.host` (admin, see ingress.yaml) and
    # `.Values.ingress.journeyHost` (this Ingress) are now expected to be the
    # SAME value in a single-origin deploy (e.g. both = app.<suffix>) — this
    # object and ingress.yaml become two path-scoped Ingress objects on ONE
    # host rather than two separate hosts. ingress-nginx merges same-host
    # Ingress objects and routes by path specificity (Exact / longest-Prefix
    # wins over the admin Ingress's blanket `path: /` Prefix — see that
    # file's own path list), so this participant allow-list still can NOT be
    # widened by the admin Ingress's `/` rule matching first. The value NAMES
    # (host / journeyHost) are kept distinct in this chart even though a
    # single-origin deploy sets them equal — this stays inverse of the admin
    # host's /check-admin gate (I8: this does NOT loosen the auth boundary —
    # admin ingress.yaml + its /check-admin stay untouched; self-scope
    # enforcement lives server-side in the scoreboard).
    nginx.ingress.kubernetes.io/auth-url: {{ .Values.ingress.journeyAuthUrl | quote }}
    {{- with .Values.ingress.authSignin }}
    nginx.ingress.kubernetes.io/auth-signin: {{ . | quote }}
    {{- end }}
    # Header-forgery guard: auth-response-headers makes ingress-nginx OVERWRITE
    # these headers on the upstream request with the values returned by the auth
    # subrequest (oauth2-proxy /oauth2/auth). A client-supplied X-Auth-Request-*
    # is discarded and replaced — so the scoreboard's self-scope key
    # (X-Auth-Request-Email) is always auth-subrequest-derived, never spoofable
    # by the participant. (security-lead cross-repo 5x focus.)
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Preferred-Username"
    {{- with .Values.ingress.journeyAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.journeyHost | quote }}
      http:
        # Participant allow-list (P18 5x fix; P19-2b cutover). The journey
        # host is reachable by ANY authenticated login, so it must NOT
        # re-expose the whole scoreboard like the admin host's `path: /`
        # does. Only the paths the unified portal shell actually needs are
        # routed here; everything else (GET /, /api/state, /api/admin/*,
        # /falco/events, /internal/exfil/*) has no matching rule and falls
        # through to the ingress-nginx default backend (404) on
        # this host. Server-side gates still apply on top of this
        # (selfOrAdmin on /api/users/*, admin gates on /api/state|admin) —
        # this is the ingress-layer half of the fix.
        #
        # Why each entry:
        #   /portal          — unified portal shell (P23-1), hash-tab router
        #                      over Home/Journey/Me/Terminal (+ Scoreboard for
        #                      admins) panes; Exact/GET. Admin-only data stays
        #                      gated server-side (isAdmin), so opening this to
        #                      any authenticated login is safe. P19-2b removed
        #                      the legacy /journey and /me routes (see
        #                      internal/scoreboard/view/view.go) — the portal's
        #                      Journey/Me tabs fetch the exact same
        #                      /api/users/{user}/{journey,me} endpoints those
        #                      pages used, so this single entry now covers what
        #                      three routes used to.
        #   /api/users/     — self-scoped reads (me/journey) + per-user progress
        #                      writes (step-check / hint reveal / display-name);
        #                      all server-side self-or-admin gated.
        #   /api/board/     — app#292 Phase 2 QA Board: the 6 participant routes
        #                      (list/get/create/append-message/like/unlike),
        #                      all server-side authz=authenticated gated (any
        #                      proven identity — no {user} path segment to
        #                      self-match, since threads are addressed by their
        #                      own {tid} and internal/board.Store performs the
        #                      audience/ownership entitlement check). The 4
        #                      operator routes live under /api/admin/board/
        #                      (audience=operator) — deliberately NOT covered by
        #                      this Prefix, and the I15 reverse-audience test
        #                      (internal/apispec/ingressparity) fails closed if
        #                      they ever were: /api/admin/board/ does not share
        #                      this entry's /api/board/ prefix, so it is
        #                      structurally unreachable through this Ingress
        #                      regardless.
        #   /api/challenges/ — the evade flag-submit form the Journey pane posts
        #                      to (plain-evade missions submit manually here);
        #                      the Grader enforces flag+window+exfil, and a
        #                      claimed user cannot forge a solve without the
        #                      real flag.
        #   /csp-report      — CSP violation report intake (Issue #95). The
        #                      portal's own CSP `report-uri`/`report-to`
        #                      directives (internal/scoreboard/view/csp.go)
        #                      point every participant's browser at this
        #                      SAME-origin path, so it must be reachable by
        #                      the SAME audience /portal itself is (any
        #                      authenticated login) — Exact, like /portal,
        #                      since it is one fixed path, not a prefix.
        #                      MUST live here, not on the admin ingress.yaml
        #                      catch-all: this was missed on the route's
        #                      initial landing (R5=R1, /review-5x) and the
        #                      symptom was total — auth-policy's
        #                      /check-admin gate 403s any non-admin caller,
        #                      so EVERY participant's browser-emitted
        #                      violation report silently 403'd while the app
        #                      layer (x-ctf-authz: none — no per-identity
        #                      check in the Go handler itself) looked
        #                      correctly configured. "any authenticated
        #                      login" here is a real narrower-than-public
        #                      gate, not decorative: a same-origin CSP
        #                      report request carries the portal's own
        #                      session cookie (Fetch/Reporting API spec:
        #                      `credentials: same-origin`), so oauth2-proxy's
        #                      auth subrequest resolves the SAME way it does
        #                      for the page load that triggered the report —
        #                      a fully anonymous client (never logged in)
        #                      cannot reach this route through ingress at
        #                      all, regardless of what the Go handler itself
        #                      would do with the request.
        #   /vendor/cybercore.min.css — the vendored, pinned cybercore-css
        #                               stylesheet (P23-6) portal.html's <link> tag
        #                               loads on every /portal render. Exact, not
        #                               Prefix: internal/scoreboard/view/vendorassets.go
        #                               embeds exactly this one file at exactly this
        #                               one mux Pattern (apispec Audience: participant,
        #                               Authz: none) — there is no /vendor/ directory
        #                               of further assets today, so a Prefix rule
        #                               would open ingress reachability for paths the
        #                               mux does not yet (and may never) serve, ahead
        #                               of any actual route existing. Mirrors /portal
        #                               and /csp-report's Exact choice for the same
        #                               reason: this entry's specificity should track
        #                               the mux Pattern it stands in for, not
        #                               pre-provision for hypothetical future assets.
        #                               Same Issue #235 gap class as #95: correctly
        #                               declared x-ctf-authz: none in the Go
        #                               handler/spec, but every participant's browser
        #                               hit /check-admin's 403 here because ingress
        #                               never carried a matching allow-list entry —
        #                               the portal rendered with no styling at all
        #                               (not a hard failure, so it shipped unnoticed
        #                               until #95's review-5x flagged the same class
        #                               of gap by inspection, Issue #235).
        #   /static/tokens.css — the design-token single source (app#116)
        #                        both portal.html and the admin index.html
        #                        <link> to. Same Exact rationale as
        #                        /vendor/cybercore.min.css immediately above:
        #                        one embedded file, one mux Pattern.
        #   /vendor/fonts.css, /vendor/fonts/chakrapetch-500.woff2,
        #   /vendor/fonts/chakrapetch-600.woff2,
        #   /vendor/fonts/chakrapetch-700.woff2, /vendor/fonts/inter-var.woff2,
        #   /vendor/fonts/jetbrainsmono-var.woff2 — the self-hosted Google
        #                        Fonts stylesheet + its 5 vendored woff2 files
        #                        (app#96, P12 follow-up: replaces the portal's
        #                        former fonts.googleapis.com/fonts.gstatic.com
        #                        <link>). This IS the "second embedded asset
        #                        under /vendor/" the comment above used to
        #                        anticipate — still Exact per file (6 literal
        #                        entries), not a Prefix /vendor/fonts/ rule:
        #                        internal/scoreboard/view/vendorassets.go
        #                        registers one mux Pattern per file (no
        #                        wildcard/path-param route), so a Prefix rule
        #                        here would open ingress reachability for
        #                        paths the mux does not serve, same reasoning
        #                        as /vendor/cybercore.min.css's Exact choice.
        #                        If a THIRD /vendor/ asset is ever added,
        #                        revisit Prefix deliberately at that point
        #                        (as a genuine multi-asset decision) rather
        #                        than reusing this comment's per-file
        #                        reasoning unmodified.
        # NOTE: /falco/events (Falco ingest, no app-layer auth) is deliberately
        # absent — routing it here would let any login forge trigger solves.
        paths:
          - path: /portal
            pathType: Exact
            backend:
              service:
                name: scoreboard
                port:
                  number: 80
          - path: /api/users/
            pathType: Prefix
            backend:
              service:
                name: scoreboard
                port:
                  number: 80
          - path: /api/board/
            pathType: Prefix
            backend:
              service:
                name: scoreboard
                port:
                  number: 80
          - path: /api/challenges/
            pathType: Prefix
            backend:
              service:
                name: scoreboard
                port:
                  number: 80
          - path: /csp-report
            pathType: Exact
            backend:
              service:
                name: scoreboard
                port:
                  number: 80
          - path: /vendor/cybercore.min.css
            pathType: Exact
            backend:
              service:
                name: scoreboard
                port:
                  number: 80
          - path: /static/tokens.css
            pathType: Exact
            backend:
              service:
                name: scoreboard
                port:
                  number: 80
          - path: /vendor/fonts.css
            pathType: Exact
            backend:
              service:
                name: scoreboard
                port:
                  number: 80
          - path: /vendor/fonts/chakrapetch-500.woff2
            pathType: Exact
            backend:
              service:
                name: scoreboard
                port:
                  number: 80
          - path: /vendor/fonts/chakrapetch-600.woff2
            pathType: Exact
            backend:
              service:
                name: scoreboard
                port:
                  number: 80
          - path: /vendor/fonts/chakrapetch-700.woff2
            pathType: Exact
            backend:
              service:
                name: scoreboard
                port:
                  number: 80
          - path: /vendor/fonts/inter-var.woff2
            pathType: Exact
            backend:
              service:
                name: scoreboard
                port:
                  number: 80
          - path: /vendor/fonts/jetbrainsmono-var.woff2
            pathType: Exact
            backend:
              service:
                name: scoreboard
                port:
                  number: 80
  {{- if .Values.ingress.tls }}
  tls:
    # Journey host rides the ingress-nginx wildcard default-ssl-certificate
    # (*.<suffix>) — NO per-host secretName and NO cert-manager issuer (those
    # live in .Values.ingress.annotations, deliberately NOT merged here via
    # journeyAnnotations). The admin host's scoreboard-tls SAN does not cover
    # journey.<suffix>, so it must not be reused here.
    - hosts:
        - {{ .Values.ingress.journeyHost | quote }}
  {{- end }}
{{- end }}
