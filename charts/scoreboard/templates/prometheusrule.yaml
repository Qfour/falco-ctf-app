{{- if .Values.monitoring.enabled }}
# Prometheus Operator alerts. Requires kube-prometheus-stack CRDs.
# Metric names/labels match the scoreboard's actual exposition
# (internal/scoreboard/metrics): the ingest counter labels by `outcome`,
# 5xx is observed via the http_request_duration histogram's `status` label.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: scoreboard
  namespace: scoreboard
  labels:
    app.kubernetes.io/name: scoreboard
    release: {{ .Values.monitoring.prometheusReleaseLabel }}
spec:
  groups:
    - name: scoreboard.rules
      interval: 30s
      rules:
        - alert: ScoreboardPodDown
          expr: |
            kube_deployment_status_replicas_available{namespace="scoreboard",deployment="scoreboard"} == 0
          for: 1m
          labels:
            severity: critical
            component: scoreboard
          annotations:
            summary: "scoreboard pod down — scoring is paused"
            description: "0 available replicas for >1m. Scoring is offline (replicas=1 + Recreate). Check pod logs and PVC mount."

        - alert: ScoreboardIngestErrorRate
          expr: |
            sum(rate(scoreboard_ingest_falco_events_received_total{outcome="store_error"}[5m]))
              / sum(rate(scoreboard_ingest_falco_events_received_total[5m])) > 0.01
          for: 5m
          labels:
            severity: warning
            component: scoreboard
          annotations:
            summary: "scoreboard /falco/events store-error rate >1%"
            description: "Events reach the scoreboard but the SQLite write fails. Check PVC free space and WAL state."

        - alert: ScoreboardHTTP5xxRate
          expr: |
            sum(rate(scoreboard_http_request_duration_seconds_count{status=~"5.."}[5m]))
              / sum(rate(scoreboard_http_request_duration_seconds_count[5m])) > 0.01
          for: 5m
          labels:
            severity: warning
            component: scoreboard
          annotations:
            summary: "scoreboard 5xx rate >1%"
            description: "Participants/falcosidekick are seeing 5xx (submit or ingest). Inspect pod logs and SQLite write health."

        - alert: ScoreboardNoFalcoEvents
          expr: |
            sum(increase(scoreboard_ingest_falco_events_received_total{outcome="accepted"}[5m])) == 0
          for: 5m
          labels:
            severity: warning
            component: scoreboard
          annotations:
            summary: "no Falco events accepted by scoreboard in 5m"
            description: "Either a very quiet event, or the Falco→falcosidekick→scoreboard path is broken. Run scripts/verify.sh."

        # app#404 (ADR-0038), replacing app#387's per-bucket rule. Counts every
        # request an identity gate refused for lack of a usable proven identity,
        # in ONE metric, scoreboard_identity_denials_total{gate, reason}:
        #   gate=strict         the identity-keyed rate-limit buckets (403, no token spent)
        #   gate=self_or_admin  selfOrAdmin (me / journey, the participant POSTs)
        #   gate=authenticated  requireAuthenticated / boardIdentity (board)
        #   gate=portal         GET /portal served a shell (200) to a caller with
        #                       no usable identity: on a fresh page load this is
        #                       the ONLY signal, the panes stay empty and send nothing
        # In a healthy production reason=no_identity and reason=non_canonical are
        # 0: every sender that can reach the scoreboard goes through the ingress'
        # auth-url (I8 premise 1) or is falcosidekick / the collector, which hit
        # no identity gate. So the threshold is "> 0" for every gate and there is
        # no `for:`: a larger number only delays detection (the portal gate emits
        # one count per page load). reason=mismatch (a canonical identity for
        # another seat) is a participant's own action, never alerted on.
        # It does NOT see a forged header that gets through (a valid identity for
        # the wrong person); the preventive controls for that are V12/V13. A
        # manual `kubectl port-forward` + curl without the header fires it too:
        # that is correct (it reached an identity gate with no identity), and it
        # clears in 5 minutes.
        - alert: ScoreboardIdentityDenials
          expr: |
            sum by (gate, reason) (increase(scoreboard_identity_denials_total{reason=~"no_identity|non_canonical"}[5m])) > 0
          labels:
            severity: warning
            component: scoreboard
          annotations:
            summary: "scoreboard identity gate {{ "{{ $labels.gate }}" }} denied requests (reason {{ "{{ $labels.reason }}" }}) in the last 5m"
            description: "An identity gate refused (gate=portal: served an empty shell to) a caller without a usable proven identity; this stays 0 in a healthy production. reason=no_identity (X-Auth-Request-Email absent or blank): read remote_addr in the scoreboard log line 'identity gate denied'. ingress-nginx Pod IP = auth-url / auth-response-headers broke (I8 premise 1); collector Pod IP = the forward table grew onto an identity route (ADR-0034 D12, ADR-0037 V7); anything else = NetworkPolicy not enforcing, or probing. reason=non_canonical (header present but not <seat>@EXPECTED_EMAIL_DOMAIN, nor an ADMIN_EMAILS member where the gate admits one): EXPECTED_EMAIL_DOMAIN differs between auth-policy and the scoreboard or is empty, or auth-policy is not stamping the canonical form."
{{- end }}
