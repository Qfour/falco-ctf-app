# Named ServiceAccount for the scoreboard pod.
#
# Why a named SA (not the namespace `default`): when DETECT_RUNNER=k8s the
# scoreboard drives the Batch API in-cluster (internal/scoreboard/detect,
# rest.InClusterConfig) to create per-submission grader Jobs. The platform's
# detect-grader release (falco-ctf-platform helmfile/releases/detect-grader)
# binds a least-privilege Role in the grader namespace to THIS SA by name.
# The subject name + namespace MUST match the platform RoleBinding exactly:
#   name: scoreboard  /  namespace: scoreboard
# (detect-grader chart values.scoreboardServiceAccount.{name,namespace}).
#
# The SA is always created (name stability across runners), but the pod only
# mounts its token when DETECT_RUNNER=k8s — see deployment.yaml. In off/local
# the token is never projected, so a pod compromise gains no API identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scoreboard
  namespace: scoreboard
  labels:
    {{- include "scoreboard.labels" . | nindent 4 }}
# Never auto-mount at the SA level. Token projection is decided per-pod in the
# deployment (only when DETECT_RUNNER=k8s), so this stays false regardless of
# runner to avoid leaking a token onto any other pod that might use this SA.
automountServiceAccountToken: false
