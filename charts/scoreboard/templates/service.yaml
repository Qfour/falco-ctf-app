apiVersion: v1
kind: Service
metadata:
  name: scoreboard
  namespace: scoreboard
  labels:
    {{- include "falco-ctf-common.labels" (dict "name" "scoreboard" "managedBy" .Release.Service) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: scoreboard
  ports:
    - name: http
      port: 80
      targetPort: 8000
