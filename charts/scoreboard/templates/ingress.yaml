{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scoreboard
  namespace: scoreboard
  labels:
    {{- include "falco-ctf-common.labels" (dict "name" "scoreboard" "managedBy" .Release.Service) | nindent 4 }}
  annotations:
    # Operator-only gate. auth-policy /check-admin returns 200 only when the
    # logged-in oauth2-proxy email is in the ADMIN_EMAILS allowlist. Without
    # this any logged-in user could reach the operator dashboard (GET /) and
    # its admin-only APIs.
    #
    # P19-2b: this Ingress and ingress-journey.yaml's are designed to render
    # on the SAME host (single origin, e.g. app.<suffix>) with NON-OVERLAPPING
    # effective paths — this object's `path: /` below is a catch-all Prefix,
    # but ingress-nginx merges same-host Ingress objects and dispatches by
    # path specificity, so the journey Ingress's more specific paths
    # (/portal Exact, /api/users/ and /api/challenges/ Prefix) win over this
    # `/` rule for those exact routes and keep their own (any-login)
    # auth-url/auth-response-headers — this `/check-admin` gate only ever
    # applies to paths NEITHER Ingress object claims more specifically
    # (i.e. GET /, /api/state, /api/admin/*, /falco/events,
    # /internal/exfil/*). See ingress-journey.yaml's path list for the full
    # participant allow-list and the invariant that admin paths must never
    # appear there.
    #
    # ⚠ A route landing here by DEFAULT (i.e. not yet added to
    # ingress-journey.yaml's allow-list) means it silently requires
    # /check-admin — every non-admin caller gets 403 with no error anywhere
    # in the app layer, since the app's own x-ctf-authz gate (if declared
    # "none") never even runs. This exact gap shipped once (Issue #95's
    # POST /csp-report: correctly declared x-ctf-authz: none in the Go
    # handler/spec, but omitted from ingress-journey.yaml's paths — every
    # participant's CSP violation report 403'd at the ingress layer while
    # the app-layer contract looked fully correct). Any NEW same-origin
    # route a participant's own BROWSER is expected to reach (not just a
    # server-to-server caller) needs a deliberate decision recorded in
    # ingress-journey.yaml's own "Why each entry" comment — silence here is
    # not a safe default, it is admin-only.
    nginx.ingress.kubernetes.io/auth-url: "http://auth-policy.auth-policy.svc.cluster.local:80/check-admin"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Preferred-Username"
    {{- with .Values.ingress.authSignin }}
    nginx.ingress.kubernetes.io/auth-signin: {{ . | quote }}
    {{- end }}
    {{- /* The passthrough must not replace or weaken the identity-stamping gate
         (ADR-0034 D4). The whole nginx.ingress.kubernetes.io/auth- namespace is
         refused, not just auth-url / auth-response-headers: auth-cache-key and
         auth-cache-duration would reuse one caller's 200 (with its canonical
         identity headers) for another, or keep a revoked seat admitted for the
         cache period; auth-snippet and auth-proxy-set-headers change what the
         auth subrequest carries. Without X-Auth-Request-* from auth-policy the
         browser path is indistinguishable from the collector / falcosidekick
         path, so the internal-only 403s stop firing. Refuse at render time. */ -}}
    {{- range $k, $_ := (default dict $.Values.ingress.annotations) }}
    {{- if hasPrefix "nginx.ingress.kubernetes.io/auth-" (toString $k) }}
    {{- fail (printf "ingress.annotations must not set %s (every nginx.ingress.kubernetes.io/auth-* annotation is fixed by this chart: the auth gate is not overridable)" $k) }}
    {{- end }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scoreboard
                port:
                  number: 80
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      {{- with .Values.ingress.tlsSecretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
{{- end }}
