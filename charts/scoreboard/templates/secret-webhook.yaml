{{- /*
  ADR-WS-0006 Layer 2: the falcosidekick webhook shared-secret. Unlike
  flagsSecret (values.yaml, flagsSecret.enabled) — which references a Secret
  the PLATFORM creates out-of-band from events/<date>/flags.sops.yaml — this
  chart owns and renders the Secret object itself, sourced directly from
  .Values.webhookSharedSecret. That mirrors the ADR's "single SOPS source →
  helmfile supplies both falco's customHeaders AND this chart value directly,
  no manual kubectl create secret" design (the ADR explicitly calls out NOT
  repeating the flagsSecret "recurs" operational friction for this new
  secret).

  Rendered UNCONDITIONALLY (no .enabled toggle): the default empty value is
  itself the I7-compliant, fail-closed default — internal/scoreboard/ingest
  treats an empty secret as "can never match" regardless of
  WEBHOOK_SECRET_MODE, so an always-present Secret with an empty string is
  indistinguishable, functionally, from "not configured". This also means
  the Deployment's secretKeyRef below never has to be conditional, and a
  platform that has not yet rolled out the paired customHeaders change (the
  ADR's "off between rollout steps is harmless" rollout design) needs no
  chart-side toggle to flip later.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: scoreboard-webhook-secret
  namespace: scoreboard
  labels:
    {{- include "falco-ctf-common.labels" (dict "name" "scoreboard" "managedBy" .Release.Service) | nindent 4 }}
type: Opaque
stringData:
  # Key name is this chart's own contract (Deployment's secretKeyRef below);
  # it is NOT the cross-repo string that must match platform (that is the
  # HEADER name, X-Falco-Shared-Secret — see internal/scoreboard/ingest.go).
  sharedSecret: {{ .Values.webhookSharedSecret | default "" | quote }}
