apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scoreboard-data
  namespace: scoreboard
  labels:
    {{- include "scoreboard.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
