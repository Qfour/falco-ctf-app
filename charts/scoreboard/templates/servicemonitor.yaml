{{- if .Values.monitoring.enabled }}
# Requires the Prometheus Operator CRDs (kube-prometheus-stack). Inert until
# they exist. `release` label must match the operator's serviceMonitorSelector.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: scoreboard
  namespace: scoreboard
  labels:
    app.kubernetes.io/name: scoreboard
    release: {{ .Values.monitoring.prometheusReleaseLabel }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: scoreboard
  namespaceSelector:
    matchNames:
      - scoreboard
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
{{- end }}
