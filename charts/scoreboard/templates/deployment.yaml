apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoreboard
  namespace: scoreboard
  labels:
    {{- include "scoreboard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scoreboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scoreboard
        app.kubernetes.io/part-of: falco-ctf
    spec:
      serviceAccountName: scoreboard
      # Token projection is conditional on the detect runner (minimal privilege):
      #   * DETECT_RUNNER=k8s → the scoreboard drives the Batch API in-cluster
      #     (rest.InClusterConfig) to create per-submission grader Jobs, so it
      #     needs its SA token mounted. The platform binds a grader-namespace
      #     scoped Role to this SA, so the token's blast radius is limited to
      #     creating/watching/deleting Jobs+Secrets in the dedicated grader ns.
      #   * off / local (default) → the scoreboard never calls the K8s API, so
      #     the token is NOT mounted. A pod compromise gains no API identity —
      #     the pre-#44 hardening (no automount) is preserved unchanged.
      automountServiceAccountToken: {{ eq (toString .Values.env.detectRunner) "k8s" }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scoreboard
          image: {{ include "scoreboard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: CHALLENGES_DIR
              value: {{ .Values.env.challengesDir | quote }}
            - name: SCOREBOARD_DB
              value: {{ .Values.env.dbPath | quote }}
            {{- with .Values.env.scenarioFile }}
            - name: SCENARIO_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.env.adminEmails }}
            - name: ADMIN_EMAILS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.env.docsBaseUrl }}
            - name: DOCS_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- /* Use `ne (toString ...) ""` not `with`: `with` treats the
                   integer 0 as falsy and would drop the env, silently reverting
                   to the code default. Only an empty string (unset) is skipped;
                   0 / "0" / any integer is emitted so an operator can pin 0. */}}
            {{- if ne (toString .Values.env.scorePointsPerSolve) "" }}
            - name: SCORE_POINTS_PER_SOLVE
              value: {{ .Values.env.scorePointsPerSolve | quote }}
            {{- end }}
            {{- if ne (toString .Values.env.scoreHintPenalty) "" }}
            - name: SCORE_HINT_PENALTY
              value: {{ .Values.env.scoreHintPenalty | quote }}
            {{- end }}
            {{- /* #44.1 detect-challenge grader wiring (cross-repo contract with
                   platform detect-grader release). Surfaced only when set so the
                   default (off) prod image renders identically to pre-#44. Key
                   names MUST match platform helmfile releases/scoreboard values
                   (detectRunner/detectGraderNamespace/detectGraderImage). */}}
            {{- if ne (toString .Values.env.detectRunner) "" }}
            - name: DETECT_RUNNER
              value: {{ .Values.env.detectRunner | quote }}
            {{- end }}
            {{- if ne (toString .Values.env.detectGraderNamespace) "" }}
            - name: DETECT_GRADER_NAMESPACE
              value: {{ .Values.env.detectGraderNamespace | quote }}
            {{- end }}
            {{- if ne (toString .Values.env.detectGraderImage) "" }}
            - name: DETECT_GRADER_IMAGE
              value: {{ .Values.env.detectGraderImage | quote }}
            {{- end }}
            {{- if .Values.flagsSecret.enabled }}
            - name: FLAGS_FILE
              value: /etc/ctf-flags/{{ .Values.flagsSecret.key }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/scoreboard
            {{- if .Values.flagsSecret.enabled }}
            - name: flags
              mountPath: /etc/ctf-flags
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: scoreboard-data
        {{- if .Values.flagsSecret.enabled }}
        - name: flags
          secret:
            secretName: {{ .Values.flagsSecret.name }}
        {{- end }}
