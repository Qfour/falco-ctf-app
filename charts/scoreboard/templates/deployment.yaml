{{- /*
  Invariant I1 (scoreboard is SQLite single-writer): replicas must be 1.
  Unlike the UID/fsGroup invariants (I2/I3), which are hardcoded literals in
  the templates and therefore cannot be weakened via values, `replicas` here
  is values-driven for legitimate reasons (helmfile renders it per
  environment). That makes it overridable by mistake, so guard it with a hard
  `fail` — any `--set replicas=N` with N>1 must abort the render, not
  silently deploy a second SQLite writer.
*/}}
{{- if gt (int .Values.replicas) 1 }}
{{- fail "I1 違反: scoreboard は SQLite 単一 writer。replicas は 1 のみ (values.yaml のコメント参照)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoreboard
  namespace: scoreboard
  labels:
    {{- include "falco-ctf-common.labels" (dict "name" "scoreboard" "managedBy" .Release.Service) | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scoreboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scoreboard
        app.kubernetes.io/part-of: falco-ctf
    spec:
      serviceAccountName: scoreboard
      # Token projection is conditional on the detect runner (minimal privilege):
      #   * DETECT_RUNNER=k8s → the scoreboard drives the Batch API in-cluster
      #     (rest.InClusterConfig) to create per-submission grader Jobs, so it
      #     needs its SA token mounted. The platform binds a grader-namespace
      #     scoped Role to this SA, so the token's blast radius is limited to
      #     creating/watching/deleting Jobs+Secrets in the dedicated grader ns.
      #   * off / local (default) → the scoreboard never calls the K8s API, so
      #     the token is NOT mounted. A pod compromise gains no API identity —
      #     the pre-#44 hardening (no automount) is preserved unchanged.
      automountServiceAccountToken: {{ eq (toString .Values.env.detectRunner) "k8s" }}
      securityContext:
        {{- include "falco-ctf-common.podSecurityContext" (dict "fsGroup" 65532) | nindent 8 }}
      {{- /*
        P20 substrate generalisation: pin fixed services to a node tier. On the
        VM k3s substrate the platform taints the server node
        ctf.falco/fixed-only=true:NoSchedule (cloud-init taint only — there is
        NO ctf.falco/tier label); scheduling selects via the built-in
        node-role.kubernetes.io/control-plane label that k3s auto-applies. The
        vm-prod overlay supplies nodeSelector + tolerations here, e.g.:
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          tolerations:
            - key: "ctf.falco/fixed-only"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"
        so the (I1 state-pinned) scoreboard tolerates the server taint and lands
        on the k3s server node. Empty defaults render nothing — unset =
        identical to prior render (no regression on EKS / local).
      */}}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: scoreboard
          image: {{ include "falco-ctf-common.image" (dict "repository" .Values.image.repository "tag" .Values.image.tag "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "falco-ctf-common.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: CHALLENGES_DIR
              value: {{ .Values.env.challengesDir | quote }}
            - name: SCOREBOARD_DB
              value: {{ .Values.env.dbPath | quote }}
            {{- with .Values.env.scenarioFile }}
            - name: SCENARIO_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.env.adminEmails }}
            - name: ADMIN_EMAILS
              value: {{ . | quote }}
            {{- end }}
            {{- /* P23-2 origin guard allowlist. `with` (not the ne/toString
                   form) is correct here: an empty string IS the fail-closed
                   default (deny every guarded POST) and there is no falsy-0
                   ambiguity for a CSV string, unlike scorePointsPerSolve. */}}
            {{- with .Values.env.allowedOrigins }}
            - name: ALLOWED_ORIGINS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.env.docsBaseUrl }}
            - name: DOCS_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- /* P23-4 portal Terminal iframe. `with` is correct here: an
                   empty string IS the fail-safe default (no iframe, "not
                   configured" placeholder), same posture as docsBaseUrl
                   above. */}}
            {{- with .Values.env.portalTtydSuffix }}
            - name: PORTAL_TTYD_SUFFIX
              value: {{ . | quote }}
            {{- end }}
            {{- /* Use `ne (toString ...) ""` not `with`: `with` treats the
                   integer 0 as falsy and would drop the env, silently reverting
                   to the code default. Only an empty string (unset) is skipped;
                   0 / "0" / any integer is emitted so an operator can pin 0. */}}
            {{- if ne (toString .Values.env.scorePointsPerSolve) "" }}
            - name: SCORE_POINTS_PER_SOLVE
              value: {{ .Values.env.scorePointsPerSolve | quote }}
            {{- end }}
            {{- /* CSV schedule string: `with` is correct here (unlike the
                   scorePointsPerSolve int above) — an empty string is the
                   "omit env, let cmd/scoreboard's fail-soft default apply"
                   case with no falsy-0 ambiguity, matching allowedOrigins /
                   docsBaseUrl above. The chart's own default value is
                   "10,30,50" (CEO-confirmed schedule) so this normally
                   renders. */}}
            {{- with .Values.env.scoreHintPenalties }}
            - name: SCORE_HINT_PENALTIES
              value: {{ . | quote }}
            {{- end }}
            {{- /* #44.1 detect-challenge grader wiring (cross-repo contract with
                   platform detect-grader release). Surfaced only when set so the
                   default (off) prod image renders identically to pre-#44. Key
                   names MUST match platform helmfile releases/scoreboard values
                   (detectRunner/detectGraderNamespace/detectGraderImage). */}}
            {{- if ne (toString .Values.env.detectRunner) "" }}
            - name: DETECT_RUNNER
              value: {{ .Values.env.detectRunner | quote }}
            {{- end }}
            {{- if ne (toString .Values.env.detectGraderNamespace) "" }}
            - name: DETECT_GRADER_NAMESPACE
              value: {{ .Values.env.detectGraderNamespace | quote }}
            {{- end }}
            {{- if ne (toString .Values.env.detectGraderImage) "" }}
            - name: DETECT_GRADER_IMAGE
              value: {{ .Values.env.detectGraderImage | quote }}
            {{- end }}
            {{- if .Values.flagsSecret.enabled }}
            - name: FLAGS_FILE
              value: /etc/ctf-flags/{{ .Values.flagsSecret.key }}
            {{- end }}
            {{- /* ADR-WS-0006 Layer 2 (webhook shared-secret). The secret
                   value ALWAYS comes from the chart-owned Secret (see
                   templates/secret-webhook.yaml) — never rendered inline —
                   so an empty default never appears in `helm template`
                   output or in this Deployment's own spec. WEBHOOK_SECRET_MODE
                   is a plain (non-secret) value; `off` is the safe default so
                   an operator who has not set anything gets today's
                   behaviour unchanged. */}}
            - name: FALCO_WEBHOOK_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: scoreboard-webhook-secret
                  key: sharedSecret
            - name: WEBHOOK_SECRET_MODE
              value: {{ .Values.webhookSecretMode | default "off" | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/scoreboard
            {{- if .Values.flagsSecret.enabled }}
            - name: flags
              mountPath: /etc/ctf-flags
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: scoreboard-data
        {{- if .Values.flagsSecret.enabled }}
        - name: flags
          secret:
            secretName: {{ .Values.flagsSecret.name }}
        {{- end }}
